<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Инвентарь</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
  body > .auth-widget { display: none !important; }
  .my-page { min-height: 100vh; padding: 80px clamp(16px, 2.5vw, 56px) 140px; position: relative; z-index: 1; }
  .my-container { width: 100%; max-width: 1920px; margin: 0 auto; }

  .inv-section-title { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .inv-section-title .count { display: inline-block; padding: 3px 10px; background: rgba(255,255,255,0.06); border-radius: 100px; font-size: 12px; color: var(--text-dim); font-weight: 700; }

  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 24px; }

  .inv-card {
    background: linear-gradient(145deg, #0e0e0e, #060606);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
    display: flex;
    flex-direction: column;
  }
  .inv-card:hover { transform: translateY(-6px); border-color: var(--item-color, var(--red)); }
  .inv-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--item-color, var(--red)); box-shadow: 0 0 20px var(--item-color, var(--red)); }

  .inv-tag { position: absolute; top: 14px; left: 14px; padding: 4px 11px; border-radius: 100px; font-size: 10px; font-weight: 900; font-family: 'Unbounded', sans-serif; letter-spacing: 0.4px; display: inline-flex; align-items: center; gap: 6px; }
  .inv-tag.admin { background: rgba(239,68,68,0.15); color: #ef4444; }
  .inv-tag.vip   { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .inv-count { background: rgba(0,0,0,0.4); padding: 1px 6px; border-radius: 100px; font-size: 9px; color: #fff; }

  .inv-image { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 56px; margin: 16px 0 12px; filter: drop-shadow(0 0 25px rgba(251,191,36,0.3)); }
  .inv-name { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 6px; letter-spacing: -0.4px; }
  .inv-duration { font-size: 12px; color: var(--item-color, #fbbf24); text-align: center; font-weight: 700; margin-bottom: 12px; font-family: 'Unbounded', sans-serif; letter-spacing: -0.2px; }

  .inv-progress { height: 4px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden; margin-bottom: 12px; }
  .inv-progress-bar { height: 100%; background: linear-gradient(90deg, var(--item-color, var(--red)), #fff); border-radius: 100px; transition: width 0.4s; box-shadow: 0 0 10px var(--item-color, var(--red)); }

  .inv-info { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-dim); padding-top: 12px; border-top: 1px solid var(--border); }
  .inv-info b { color: #fff; }

  .inv-price { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 8px; }
  .inv-price b { color: #4ade80; font-family: 'Unbounded', sans-serif; font-weight: 700; }

  .inv-empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 13px; }
  .inv-empty .ico { font-size: 48px; margin-bottom: 12px; opacity: 0.35; }

  @media (max-width: 699px) {
    .my-page { padding: 70px 12px 120px; }
    .inv-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .inv-card { padding: 14px 12px; }
    .inv-image { height: 70px; font-size: 40px; margin: 10px 0 8px; }
    .inv-name { font-size: 13px; }
    .inv-duration { font-size: 11px; }
    .inv-info { font-size: 10px; }
    .inv-price { font-size: 10px; }
  }
  .loading-state { display: flex; align-items: center; justify-content: center; padding: 60px 20px; gap: 10px; color: var(--text-dim); font-size: 13px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-glow-3"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="auth-widget" id="authWidget"></div>

<main class="my-page">
  <div class="my-container">
    <div class="my-header">
      <div class="my-header-right">
        <div class="profile-avatar-btn" id="profileAvatarBtn" onclick="toggleProfileMenu(event)">
          <img id="headerAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          <div id="profileMenuContent"></div>
        </div>
      </div>
    </div>
    <div class="inv-section-title">Активные <span class="count" id="invCount">0</span></div>
    <div class="inv-grid" id="invActive"><div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div> Загрузка...</div></div>
    <div class="inv-section-title">Неактивные <span class="count">0</span></div>
    <div class="inv-empty" id="invInactive"><div class="ico">📦</div>Неактивных услуг нет</div>
  </div>
</main>

<nav class="bottom-nav">
  <a class="nav-btn" href="/"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Главная</span></a>
  <a class="nav-btn" href="/rules"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Правила</span></a>
  <a class="nav-btn" href="/roles"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Роли</span></a>
  <a class="nav-btn" href="/shop"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Магазин</span></a>
  <a class="nav-btn active" href="/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg><span>Профиль</span></a>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/js/common.js"></script>
<script src="/js/my-profile.js"></script>
<script src="/js/auth.js"></script>
<script>
window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  if (!user) return;
  document.getElementById('headerAvatar').src = user.avatar || '';
  document.getElementById('profileMenuContent').innerHTML = renderProfileMenu('inventory');
  loadInventory();
});

function formatDuration(item) {
  if (item.forever) return 'Навсегда';
  if (item.expiresAt) {
    const exp = new Date(item.expiresAt);
    const diff = exp - Date.now();
    if (diff <= 0) return 'Истекла';
    return `Осталось ${Math.ceil(diff / 86400000)} дн.`;
  }
  if (item.totalDays > 0) return `${item.totalDays} дн.`;
  return 'Активно';
}

function formatTotalDays(item) {
  if (item.forever) return 'Навсегда';
  if (item.totalDays === 0) return '';
  const days = item.totalDays;
  if (days >= 365) {
    const y = Math.floor(days / 365);
    const rest = days % 365;
    return rest === 0 ? `${y} ${y === 1 ? 'год' : (y < 5 ? 'года' : 'лет')}` : `${y} г. ${rest} дн.`;
  }
  if (days >= 30) {
    const m = Math.floor(days / 30);
    const rest = days % 30;
    return rest === 0 ? `${m} мес.` : `${m} мес. ${rest} дн.`;
  }
  return `${days} дн.`;
}

async function loadInventory() {
  const grid = document.getElementById('invActive');
  try {
    const data = await api('/api/inventory');
    const items = data.items || [];
    document.getElementById('invCount').textContent = items.length;
    if (!items.length) {
      grid.innerHTML = `<div class="inv-empty" style="grid-column:1/-1;"><div class="ico">📦</div>Пока нет покупок. Загляните в магазин!</div>`;
      return;
    }
    const ICONS = {
      fernodd_plus: { icon: '⭐', color: '#fbbf24', tag: 'vip', tagLabel: 'FERNODD+' },
    };
    grid.innerHTML = items.map(it => {
      const meta = ICONS[it.itemId] || { icon: '🎁', color: 'var(--red)', tag: 'vip', tagLabel: 'Услуга' };
      const duration = formatDuration(it);
      const totalDaysText = formatTotalDays(it);
      const lastDate = new Date(it.lastPurchase).toLocaleDateString('ru-RU');
      const purchasesCount = it.count > 1 ? `<span class="inv-count">×${it.count}</span>` : '';

      let progressHTML = '';
      if (!it.forever && it.expiresAt && it.totalDays > 0) {
        const total = it.totalDays * 24 * 60 * 60 * 1000;
        const left = new Date(it.expiresAt) - Date.now();
        const pct = Math.max(0, Math.min(100, (left / total) * 100));
        progressHTML = `<div class="inv-progress"><div class="inv-progress-bar" style="width:${pct}%;"></div></div>`;
      }

      return `
        <div class="inv-card" style="--item-color:${meta.color};">
          <span class="inv-tag ${meta.tag}">${meta.tagLabel}${purchasesCount}</span>
          <div class="inv-image">${meta.icon}</div>
          <div class="inv-name">${escapeHtml(it.itemName)}</div>
          ${duration ? `<div class="inv-duration">${escapeHtml(duration)}</div>` : ''}
          ${progressHTML}
          <div class="inv-info">
            <span>${totalDaysText ? totalDaysText : 'Активно'}</span>
            <span>${lastDate}</span>
          </div>
          ${it.totalPrice > 0 ? `<div class="inv-price">Всего оплачено: <b>${it.totalPrice.toLocaleString('ru-RU')} ₽</b></div>` : ''}
        </div>
      `;
    }).join('');
  } catch (e) {
    grid.innerHTML = `<div class="inv-empty" style="grid-column:1/-1;color:var(--red);">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}
</script>
</body>
</html>
