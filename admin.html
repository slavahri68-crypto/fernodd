<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Админ-панель</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
* { box-sizing: border-box; }
body > .auth-widget { display: none !important; }

.admin-wrap { min-height: 100vh; position: relative; z-index: 1; padding: 84px clamp(16px, 2.5vw, 56px) 60px; width: 100%; max-width: 1920px; margin: 0 auto; overflow: visible; }
.admin-top { position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 12px; z-index: 1000; }
.admin-user { display: flex; align-items: center; gap: 8px; position: relative; z-index: 200; }

.admin-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; position: relative; z-index: 50; }
.tab-block { display: flex; align-items: center; justify-content: center; padding: 12px 16px; background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; text-align: center; flex: 1; min-width: 140px; }
.tab-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--tab-color, var(--red)); box-shadow: 0 0 20px var(--tab-color, var(--red)); opacity: 0.5; transition: opacity 0.3s; }
.tab-block:hover { transform: translateY(-4px); border-color: var(--tab-color, var(--red)); }
.tab-block.active { border-color: var(--tab-color, var(--red)); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
.tab-block.active::before { opacity: 1; height: 4px; }
.tab-block-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.4px; margin: 0; width: 100%; }

.admin-content { animation: fadeUp 0.4s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.section-block { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; margin-bottom: 16px; }
.section-block-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.section-block-title { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.section-block-sub { font-size: 12px; color: var(--text-dim); margin-top: 5px; }

.subtabs { display: inline-flex; gap: 4px; padding: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.subtab { padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 7px; }
.subtab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.subtab.active { color: #fff; background: linear-gradient(135deg, rgba(225,6,0,0.25), rgba(139,0,0,0.15)); border-color: rgba(225,6,0,0.5); }
.subtab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; padding: 2px 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-bright); border-radius: 100px; font-size: 10px; font-weight: 700; font-family: 'Unbounded', sans-serif; }
.subtab.active .subtab-count { background: rgba(225,6,0,0.25); border-color: rgba(225,6,0,0.6); color: #fff; }

.cards-list { display: flex; flex-direction: column; gap: 8px; }
.app-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; gap: 16px; align-items: flex-start; transition: all 0.3s; }
.app-card:hover { border-color: rgba(225,6,0,0.4); transform: translateX(4px); }
.app-avatar { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; object-fit: cover; }
.app-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.app-avatar-empty::after { content: '—'; opacity: 0.5; }
.app-body { flex: 1; min-width: 0; }
.app-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.app-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
.app-date { font-size: 11.5px; color: var(--text-dim); }
.app-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }
.app-row b { color: var(--text); }
.app-text { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-top: 6px; color: var(--text); }
.app-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.status-pill { display: inline-block; padding: 3px 11px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
.status-pill.pending  { background: rgba(251,191,36,0.15); color: #fbbf24; }
.status-pill.approved { background: rgba(74,222,128,0.15); color: #4ade80; }
.status-pill.rejected { background: rgba(239,68,68,0.15); color: #ef4444; }

.btn-act { padding: 8px 14px; border-radius: 9px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px; }
.btn-act:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-act.green { background: rgba(74,222,128,0.12); color: #4ade80; border-color: rgba(74,222,128,0.4); }
.btn-act.green:hover:not(:disabled) { background: rgba(74,222,128,0.25); }
.btn-act.red { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.4); }
.btn-act.red:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
.btn-act.blue { background: rgba(59,130,246,0.12); color: #60a5fa; border-color: rgba(59,130,246,0.4); }
.btn-act.blue:hover:not(:disabled) { background: rgba(59,130,246,0.25); }
.btn-act.ghost { background: rgba(255,255,255,0.04); color: var(--text); border-color: var(--border-bright); }
.btn-act.ghost:hover:not(:disabled) { border-color: var(--red); background: rgba(225,6,0,0.08); }
.btn-act.gold { background: rgba(251,191,36,0.12); color: #fbbf24; border-color: rgba(251,191,36,0.4); }
.btn-act.gold:hover:not(:disabled) { background: rgba(251,191,36,0.22); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 13px; }
.loading-state { display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 10px; color: var(--text-dim); font-size: 13px; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, rgba(255,255,255,0.04) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 14px; height: 90px; margin-bottom: 12px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.search-wrap { position: relative; margin-bottom: 16px; }
.search-input { width: 100%; padding: 12px 16px 12px 42px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; }
.search-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.search-wrap .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-dim); pointer-events: none; z-index: 1; }
.search-wrap .search-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat-tile { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
.stat-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--tile-color, var(--red)); box-shadow: 0 0 20px var(--tile-color, var(--red)); opacity: 0.7; }
.stat-tile-value { font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; color: #fff; margin-bottom: 5px; }
.stat-tile-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); font-weight: 700; }

.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.staff-tile { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-left: 4px solid var(--role-color, var(--red)); border-radius: 14px; padding: 16px 18px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: all 0.3s; }
.staff-tile:hover { transform: translateY(-4px); border-color: var(--role-color, var(--red)); }
.staff-avatar-wrap { position: relative; flex-shrink: 0; }
.staff-avatar { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; }
.staff-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.staff-avatar-empty::after { content: '—'; opacity: 0.5; }
.staff-presence { position: absolute; bottom: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--bg-card); }
.staff-presence.online  { background: #4ade80; }
.staff-presence.idle    { background: #fbbf24; }
.staff-presence.dnd     { background: #ef4444; }
.staff-presence.offline { background: #6b7280; }
.staff-info { flex: 1; min-width: 0; }
.staff-info h3 { font-family: 'Unbounded', sans-serif; font-size: 13.5px; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staff-role { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.setting-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.setting-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); margin-bottom: 7px; font-weight: 700; }
.setting-value { font-family: 'Unbounded', sans-serif; font-size: 12.5px; word-break: break-all; color: #fff; }
.setting-value.ok { color: #4ade80; }
.setting-value.err { color: var(--red); }

.role-simple-list { display: flex; flex-direction: column; border: 1px solid var(--border-bright); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.01); }
.role-simple-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--border); }
.role-simple-item:last-child { border-bottom: none; }
.role-simple-item:hover { background: rgba(225,6,0,0.06); }
.role-simple-name { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }

.chart-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.chart-title { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 16px; letter-spacing: -0.3px; }
.line-chart { width: 100%; height: 260px; display: block; }

.top-staff-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; cursor: pointer; transition: all 0.2s; border-bottom: 1px solid var(--border); }
.top-staff-row:last-child { border-bottom: none; }
.top-staff-row:hover { background: rgba(225,6,0,0.06); transform: translateX(4px); }
.top-staff-rank { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded'; font-weight: 900; font-size: 13px; flex-shrink: 0; }
.top-staff-rank.gold   { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; box-shadow: 0 0 20px rgba(251,191,36,0.5); }
.top-staff-rank.silver { background: linear-gradient(135deg, #d1d5db, #6b7280); color: #000; }
.top-staff-rank.bronze { background: linear-gradient(135deg, #d97706, #92400e); color: #fff; }
.top-staff-avatar { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; object-fit: cover; }
.top-staff-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.top-staff-avatar-empty::after { content: '—'; opacity: 0.5; font-size: 14px; }
.top-staff-name { flex: 1; font-weight: 600; color: #fff; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-staff-count { font-family: 'Unbounded'; color: var(--red); font-weight: 900; font-size: 14px; }

.balance-search-hero { text-align: center; padding: 30px 20px; background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 18px; margin-bottom: 16px; position: relative; overflow: hidden; }
.balance-search-hero::before { content: ''; position: absolute; top: -50%; left: 50%; transform: translateX(-50%); width: 240px; height: 240px; background: radial-gradient(circle, rgba(225,6,0,0.18), transparent 65%); filter: blur(40px); pointer-events: none; }
.balance-search-title { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; position: relative; z-index: 1; }
.balance-search-desc { font-size: 12.5px; color: var(--text-dim); margin-bottom: 20px; position: relative; z-index: 1; }
.balance-search-input-wrap { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; position: relative; z-index: 1; }
.balance-search-input { flex: 1; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 12px; color: #fff; font-family: 'Inter', monospace; font-size: 14px; outline: none; transition: all 0.25s; letter-spacing: 0.5px; }
.balance-search-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.balance-search-btn { padding: 14px 22px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border: none; border-radius: 12px; color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; transition: all 0.3s; white-space: nowrap; box-shadow: 0 6px 20px rgba(225,6,0,0.35); }
.balance-search-btn:hover:not(:disabled) { transform: translateY(-2px); }
.balance-search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.balance-search-hint { margin-top: 10px; font-size: 11px; color: var(--text-dim); position: relative; z-index: 1; }

.balance-result { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 16px; animation: fadeUp 0.35s; }
.balance-user-row { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.balance-user-avatar { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; border: 2px solid var(--border-bright); flex-shrink: 0; }
.balance-user-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.balance-user-avatar-empty::after { content: '—'; font-size: 20px; opacity: 0.5; }
.balance-user-info { flex: 1; min-width: 0; }
.balance-user-name { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; word-break: break-word; }
.balance-user-steam { font-family: 'Inter', monospace; font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; word-break: break-all; text-decoration: none; }
.balance-user-current { text-align: right; flex-shrink: 0; }
.balance-user-current-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
.balance-user-current-value { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 900; color: #4ade80; letter-spacing: -0.5px; }

.balance-actions-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.balance-action-btn { padding: 12px 10px; border-radius: 11px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.balance-action-btn.green { background: rgba(74,222,128,0.12); color: #4ade80; border-color: rgba(74,222,128,0.4); }
.balance-action-btn.green:hover { background: rgba(74,222,128,0.25); }
.balance-action-btn.red { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.4); }
.balance-action-btn.red:hover { background: rgba(239,68,68,0.25); }
.balance-action-btn.blue { background: rgba(96,165,250,0.12); color: #60a5fa; border-color: rgba(96,165,250,0.4); }
.balance-action-btn.blue:hover { background: rgba(96,165,250,0.25); }

.balance-panel { display: none; margin-top: 12px; }
.balance-panel.visible { display: block; animation: fadeUp 0.25s; }
.balance-panel-input-row { display: flex; gap: 8px; align-items: stretch; }
.balance-panel-input { flex: 1; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 11px; color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; outline: none; min-width: 0; }
.balance-panel-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.balance-panel-submit { padding: 14px 22px; border: none; border-radius: 11px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12.5px; cursor: pointer; color: #fff; white-space: nowrap; }
.balance-panel-submit.green { background: linear-gradient(135deg, #4ade80, #16a34a); }
.balance-panel-submit.red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.balance-panel-submit.blue { background: linear-gradient(135deg, #60a5fa, #2563eb); }

.balance-quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.balance-quick-btn { padding: 6px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); border-radius: 8px; color: var(--text-dim); font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px; cursor: pointer; }
.balance-quick-btn:hover { color: #fff; border-color: var(--red); background: rgba(225,6,0,0.08); }

.balance-result-empty { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.3); border-radius: 14px; padding: 24px; text-align: center; color: var(--red); font-size: 13px; }

/* Привилегии */
.priv-owned-list { display: flex; flex-direction: column; gap: 8px; }
.priv-owned-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-left: 3px solid var(--item-color, #4ade80); border-radius: 12px; padding: 12px 16px; }
.priv-owned-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.priv-owned-name { font-family: 'Unbounded', sans-serif; font-size: 13.5px; font-weight: 700; color: #fff; }
.priv-owned-meta { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-dim); }
.priv-owned-meta b { color: #fff; }
.priv-revoke-btn { padding: 6px 14px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); border-radius: 8px; color: #ef4444; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11.5px; cursor: pointer; transition: all 0.2s; }
.priv-revoke-btn:hover { background: rgba(239,68,68,0.25); border-color: rgba(239,68,68,0.7); }

.priv-grant-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.priv-grant-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-top: 3px solid var(--item-color, var(--red)); border-radius: 14px; padding: 14px 16px; transition: all 0.3s; cursor: pointer; }
.priv-grant-card:hover { border-color: var(--item-color, var(--red)); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.priv-grant-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.priv-grant-name { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: -0.3px; }
.priv-grant-owned { padding: 2px 8px; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.4); border-radius: 100px; font-size: 9.5px; font-weight: 700; color: #4ade80; text-transform: uppercase; letter-spacing: 0.5px; }
.priv-grant-desc { font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.4; }

  <a class="btn-act ghost" href="/" style="padding: 12px 22px; font-size: 13px; text-decoration: none;">На главную</a>
</div>

  <div class="admin-top">
    <div class="admin-user">
      <div class="profile-avatar-btn" id="profileAvatarBtn" onclick="toggleProfileMenu(event)" style="position:relative; display:none;">

        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>

<script src="/js/auth.js"></script>
<script>
let currentTab = 'staff';
let analyticsRange = 'week';
let analyticsTimer = null;
let appsData = { pending: [], approved: [], rejected: [] };
let appsFilter = 'pending';
let staffData = { administrators: [], moderators: [] };
let staffFilter = 'administrators';
let ticketsData = { open: [], closed: [] };
let ticketsFilter = 'open';
let currentTicketId = null;
let ticketPoll = null;
let lastMessageId = null;
let selectedMember = null;
let availableRoles = [];
let currentBalanceUser = null;
let selectedPrivilegeUser = null;
let privilegesCache = [];
let siteLogsFilter = { category: '', action: '', search: '', page: 1 };
let siteLogsMeta = { categories: [], actions: [] };
let siteLogsSearchTimeout = null;
let roulettePrizesCache = [];

const CATEGORY_LABELS = { general: 'Общее', auth: 'Авторизация', profile: 'Профиль', shop: 'Магазин', moderation: 'Модерация', admin: 'Админ', roles: 'Роли', privileges: 'Привилегии', balance: 'Баланс', promo: 'Промокоды', referral: 'Рефералы', inventory: 'Инвентарь' };
const ACTION_LABELS = { login: 'Вход', profile_update: 'Изменение профиля', promo_activate: 'Активация промокода', promo_create: 'Создание промокода', promo_delete: 'Удаление промокода', referral_activate: 'Активация реферала', shop_purchase: 'Покупка в магазине', inventory_remove: 'Удаление из инвентаря', balance_change: 'Изменение баланса', give_role: 'Выдача роли', privilege_grant: 'Выдача привилегии', privilege_revoke: 'Снятие привилегии', application_status: 'Статус заявки', application_delete: 'Удаление заявки', roulette_spin: 'Спин рулетки' };

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

function hasRole(roleName) {
  const u = window.currentUser;
  if (!u) return false;
  if (u.isOwner) return true;
  const roles = [...(u.roles || []), ...(u.siteRoles || [])].map(r => (r || '').toLowerCase());
  return roles.includes(roleName.toLowerCase());
}
function isOwner() { return !!(window.currentUser && window.currentUser.isOwner); }

const PERMISSIONS = {
  staff: () => hasRole('куратор') || hasRole('следящий') || hasRole('главная администрация'),
  analytics: () => hasRole('куратор') || hasRole('следящий') || hasRole('главная администрация'),
  balances: () => hasRole('следящий') || hasRole('главная администрация'),
  privileges: () => hasRole('следящий') || hasRole('главная администрация'),
  roles: () => hasRole('следящий') || hasRole('главная администрация'),
  promo: () => isOwner(),
  roulette: () => isOwner(),
  settings: () => isOwner(),
  logs: () => hasRole('главная администрация'),
  siteLogs: () => hasRole('главная администрация'),
};

function renderTabs() {
  const tabsEl = document.querySelector('.admin-tabs');
  if (!tabsEl) return;
  const allTabs = [
    { id: 'staff', label: 'Персонал', color: '#4ade80' },
    { id: 'analytics', label: 'Статистика', color: '#fbbf24' },
    { id: 'balances', label: 'Баланс', color: '#60a5fa' },
    { id: 'privileges', label: 'Привилегии', color: '#eb459e' },
    { id: 'roles', label: 'Выдача админки', color: '#5865f2' },
    { id: 'promo', label: 'Промокоды', color: '#e10600' },
    { id: 'roulette', label: 'Рулетка', color: '#d97706' },
    { id: 'logs', label: 'Логи Discord', color: '#8a8a8a' },
    { id: 'siteLogs', label: 'Логи сайта', color: '#8a8a8a' },
    { id: 'settings', label: 'Настройки', color: '#ef4444' },
  ];
  const allowedTabs = allTabs.filter(t => PERMISSIONS[t.id] && PERMISSIONS[t.id]());
  if (allowedTabs.length === 0) { document.getElementById('adminContent').innerHTML = '<div class="empty-state">Нет доступных разделов</div>'; return; }
  tabsEl.innerHTML = allowedTabs.map(tab => `
    <button class="tab-block ${currentTab === tab.id ? 'active' : ''}" data-tab="${tab.id}" style="--tab-color: ${tab.color};" onclick="switchTab('${tab.id}')">
      <div class="tab-block-title">${tab.label}</div>
    </button>
  `).join('');
  if (!allowedTabs.find(t => t.id === currentTab)) { switchTab(allowedTabs[0].id); } else { renderContent(currentTab); }
}

function switchTab(tab) {
  if (!PERMISSIONS[tab] || !PERMISSIONS[tab]()) { toast('Нет доступа к этому разделу', 'error'); return; }
  currentTab = tab;
  document.querySelectorAll('.tab-block').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderContent(tab);
}

function renderContent(tab) {
  const content = document.getElementById('adminContent');
  content.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  switch(tab) {
    case 'staff': return loadStaffBlock(content);
    case 'analytics': return loadAnalyticsBlock(content);
    case 'balances': return loadBalancesBlock(content);
    case 'privileges': return loadPrivilegesBlock(content);
    case 'roles': return loadRolesBlock(content);
    case 'promo': return loadPromoBlock(content);
    case 'roulette': return loadRouletteBlock(content);
    case 'logs': return loadLogsBlock(content);
    case 'siteLogs': return loadSiteLogsBlock(content);
    case 'settings': return loadSettingsBlock(content);
    default: content.innerHTML = '<div class="empty-state">Вкладка в разработке</div>';
  }
}

// --- СТАТИСТИКА С ГРАФИКОМ ---
function setAnalyticsRange(range) { analyticsRange = range; loadAnalyticsBlock(document.getElementById('adminContent')); }

async function loadAnalyticsBlock(body) {
  if (analyticsTimer) clearTimeout(analyticsTimer);
  body.innerHTML = '<div class="skeleton"></div>';
  try {
    const data = await api('/api/analytics-data'); 
    const pointsCount = analyticsRange === 'day' ? 24 : analyticsRange === 'week' ? 7 : analyticsRange === 'month' ? 30 : 50;
    const mockData = Array.from({length: pointsCount}).map((_, i) => {
      const val = 10 + Math.random() * 30 + (i * 2); 
      return { label: analyticsRange === 'day' ? `${i}:00` : `${i+1}`, open: val, close: val + (Math.random() * 10 - 5), high: val + Math.random() * 15, low: val - Math.random() * 15, count: Math.floor(val) };
    });

    const chartW = 900, chartH = 300, padX = 20, padY = 30;
    const maxVal = Math.max(...mockData.map(d => d.high)) * 1.1;
    const minVal = Math.min(...mockData.map(d => d.low)) * 0.9;
    const rangeVal = maxVal - minVal;
    const stepX = (chartW - padX * 2) / mockData.length;
    const candleWidth = stepX * 0.6;

    const candles = mockData.map((d, i) => {
      const x = padX + i * stepX + (stepX - candleWidth) / 2;
      const centerX = x + candleWidth / 2;
      const yHigh = chartH - padY - ((d.high - minVal) / rangeVal) * (chartH - padY * 2);
      const yLow = chartH - padY - ((d.low - minVal) / rangeVal) * (chartH - padY * 2);
      const yOpen = chartH - padY - ((d.open - minVal) / rangeVal) * (chartH - padY * 2);
      const yClose = chartH - padY - ((d.close - minVal) / rangeVal) * (chartH - padY * 2);
      const isGreen = d.close >= d.open;
      const color = isGreen ? '#22d3ee' : '#ef4444'; 
      const bodyY = Math.min(yOpen, yClose);
      const bodyHeight = Math.max(Math.abs(yOpen - yClose), 2);
      return `
        <g class="candle-group">
          <line x1="${centerX}" y1="${yHigh}" x2="${centerX}" y2="${yLow}" stroke="${color}" stroke-width="1.5"/>
          <rect x="${x}" y="${bodyY}" width="${candleWidth}" height="${bodyHeight}" fill="${isGreen ? color : 'transparent'}" stroke="${color}" stroke-width="1.5"/>
          <rect x="${x - 10}" y="${padY}" width="${candleWidth + 20}" height="${chartH - padY*2}" fill="transparent" class="candle-hover"><title>${d.label}</title></rect>
        </g>
      `;
    }).join('');

    const gridLines = Array.from({length: 4}).map((_, i) => { const y = padY + i * ((chartH - padY * 2) / 3); return `<line x1="${padX}" y1="${y}" x2="${chartW - padX}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4 4"/>`; }).join('');
    const xLabels = mockData.map((d, i) => { if (mockData.length > 15 && i % Math.ceil(mockData.length / 10) !== 0) return ''; const x = padX + i * stepX + stepX / 2; return `<text x="${x}" y="${chartH - 10}" text-anchor="middle" fill="#8a8a8a" font-family="Inter" font-size="10">${d.label}</text>`; }).join('');

    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head" style="align-items: center;">
          <div class="section-block-title">Статистика</div>
          <div class="time-filters" style="display: flex; gap: 6px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 12px; border: 1px solid var(--border-bright);">
            <button class="btn-act ${analyticsRange === 'day' ? 'blue' : 'ghost'}" onclick="setAnalyticsRange('day')" style="padding: 6px 12px; border-radius: 8px; font-size: 12px;">День</button>
            <button class="btn-act ${analyticsRange === 'week' ? 'blue' : 'ghost'}" onclick="setAnalyticsRange('week')" style="padding: 6px 12px; border-radius: 8px; font-size: 12px;">Неделя</button>
            <button class="btn-act ${analyticsRange === 'month' ? 'blue' : 'ghost'}" onclick="setAnalyticsRange('month')" style="padding: 6px 12px; border-radius: 8px; font-size: 12px;">Месяц</button>
            <button class="btn-act ${analyticsRange === 'all' ? 'blue' : 'ghost'}" onclick="setAnalyticsRange('all')" style="padding: 6px 12px; border-radius: 8px; font-size: 12px;">Все</button>
          </div>
        </div>
        <div class="chart-card" style="margin-bottom:16px; padding: 20px; background: #0a0a0a; border-radius: 16px; border: 1px solid var(--border);">
          <svg viewBox="0 0 ${chartW} ${chartH}" style="width: 100%; height: auto; display: block;">${gridLines}${candles}${xLabels}</svg>
        </div>
        <div class="chart-card">
          <div class="section-block-title" style="font-size: 15px; margin-bottom: 16px;">ТОП сотрудников</div>

}

function renderRouletteBlock(body, data) {
  const prizes = data.prizes || [];
  const totalWeight = prizes.reduce((s, p) => s + Number(p.weight || 0), 0);
  body.innerHTML = `
    <div class="section-block">
      <div class="section-block-head"><div><div class="section-block-title">Рулетка — настройка шансов</div><div class="section-block-sub">Сумма весов: <b>${totalWeight.toFixed(2)}</b></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn-act ghost" onclick="resetRoulettePrizes()">Сбросить</button><button class="btn-act green" onclick="saveRoulettePrizes()">Сохранить</button></div>
      </div>
      <div id="rouletteEditor" style="display:flex;flex-direction:column;gap:8px;"></div>
      <div style="margin-top:16px;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;"><div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.4px;font-weight:700;margin-bottom:8px;">Итоговые шансы</div><div id="rouletteChances" style="display:flex;flex-wrap:wrap;gap:8px;"></div></div>
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn-act blue" onclick="addRoulettePrize()">+ Добавить приз</button></div>
    </div>
  `;
  renderRouletteEditor();
  renderRouletteChances();
}

function renderRouletteEditor() {
  const el = document.getElementById('rouletteEditor');
  if (!el) return;
  if (el.children.length === roulettePrizesCache.length) {
    roulettePrizesCache.forEach((p, i) => {
      const row = el.children[i];
      if (!row) return;
      const amountInput = row.querySelector('input[type="number"]:first-of-type');
      if (amountInput && document.activeElement !== amountInput && amountInput.value != p.amount) amountInput.value = p.amount;
      const weightInput = row.querySelector('input[type="number"]:last-of-type');
      if (weightInput && document.activeElement !== weightInput && weightInput.value != p.weight) weightInput.value = p.weight;
      const tier = p.tier || (p.amount === 0 ? 'empty' : p.amount >= 300 ? 'red' : p.amount >= 50 ? 'purple' : 'blue');
      const select = row.querySelector('select');
      if (select && select.value !== tier) select.value = tier;
    });
    renderRouletteChances();
    return;
  }
  el.innerHTML = roulettePrizesCache.map((p, i) => {
    const tier = p.tier || (p.amount === 0 ? 'empty' : p.amount >= 300 ? 'red' : p.amount >= 50 ? 'purple' : 'blue');
    const color = tier === 'red' ? '#ef4444' : tier === 'purple' ? '#a855f7' : tier === 'empty' ? '#6b7280' : '#60a5fa';
    return `
      <div class="roulette-editor-row" data-index="${i}" style="border-left:4px solid ${color};">
        <div class="roulette-editor-field"><label>Сумма (₽)</label><input type="number" min="0" step="1" value="${p.amount}" oninput="onRoulettePrizeChange(${i}, 'amount', this.value)"></div>
        <div class="roulette-editor-field"><label>Вес (шанс)</label><input type="number" min="0.01" step="0.01" value="${p.weight}" oninput="onRoulettePrizeChange(${i}, 'weight', this.value)"></div>
        <div class="roulette-editor-field"><label>Редкость</label><select onchange="onRoulettePrizeChange(${i}, 'tier', this.value)">
          <option value="blue" ${tier === 'blue' ? 'selected' : ''}>Синий</option><option value="purple" ${tier === 'purple' ? 'selected' : ''}>Фиолетовый</option><option value="red" ${tier === 'red' ? 'selected' : ''}>Красный</option><option value="empty" ${tier === 'empty' ? 'selected' : ''}>Пусто</option>
        </select></div>
        <button class="roulette-editor-remove" onclick="removeRoulettePrize(${i})" title="Удалить">${window.ICONS.trash}</button>
      </div>`;
  }).join('');
  renderRouletteChances();
}

window.onRoulettePrizeChange = function (index, field, value) {
  if (!roulettePrizesCache[index]) return;
  if (field === 'tier') {
    roulettePrizesCache[index].tier = value;
    roulettePrizesCache[index].amount = value === 'empty' ? 0 : roulettePrizesCache[index].amount;
    renderRouletteEditor(); return;
  }
  const num = Number(value);
  if (!Number.isFinite(num)) return;
  roulettePrizesCache[index][field] = num;
  if (field === 'amount' && roulettePrizesCache[index].tier !== 'empty') {
    roulettePrizesCache[index].tier = num >= 300 ? 'red' : num >= 50 ? 'purple' : 'blue';
    renderRouletteEditor();
  } else { renderRouletteChances(); }
};

window.submitBalance = async function(mode) {

  const input = document.getElementById('amount-' + mode);

  if (!Number.isFinite(amount) || (mode !== 'set' && amount <= 0)) { toast('Введите корректную сумму', 'error'); return; }
  const labels = { add: 'выдать', subtract: 'снять', set: 'установить' };
  confirmModal({
    title: `${mode === 'add' ? 'Выдать' : mode === 'subtract' ? 'Снять' : 'Установить'} ${amount}₽?`,
    desc: `Пользователь: ${currentBalanceUser.username}\nSteam ID: ${currentBalanceUser.steamId}`,
    confirmText: `Да, ${labels[mode]}`,
    onConfirm: async () => {
      try {
        const r = await api('/api/admin/balance/change', { method: 'POST', body: JSON.stringify({ steamId: currentBalanceUser.steamId, mode, amount }) });
        toast(`${currentBalanceUser.username}: ${r.oldBalance}₽ → ${r.newBalance}₽`, 'success');

        const valueEl = document.getElementById('balanceValue');
        if (valueEl) valueEl.textContent = `${r.newBalance.toLocaleString('ru-RU')} ₽`;

        document.querySelectorAll('.balance-panel').forEach(p => p.classList.remove('visible'));

    <p style="margin-bottom:16px;">Пользователь: <b style="color:#fff;">${esc(selectedPrivilegeUser.username)}</b>${isAlreadyOwned ? '<br><span style="color:#fbbf24;">У пользователя уже есть эта привилегия — срок продлится.</span>' : ''}</p>
    <div class="fd-modal-label">Выберите срок</div>
    <div class="duration-preset-row">${presets.map(p => `<button class="duration-preset-btn" data-minutes="${p.minutes}">${esc(p.label)}</button>`).join('')}</div>
    <div class="duration-forever-row"><button class="duration-forever-btn" data-forever="1">Навсегда</button></div>
    <div class="fd-modal-label" style="margin-top:18px;">Или свой срок (в минутах)</div>
    <input type="number" min="1" step="1" class="fd-modal-input" id="fdCustomMinutes" placeholder="Например, 1440 (= 1 день)" autocomplete="off">
    <div id="fdCustomHint" style="font-size:11.5px;color:var(--text-dim);margin-top:-6px;margin-bottom:10px;">Будет выдано: <b style="color:#fff;">—</b></div>
    <div class="fd-modal-actions"><button class="fd-btn-cancel" onclick="closeModal()">Отмена</button><button class="fd-btn-confirm" id="fdGrantConfirmBtn" disabled>Выдать</button></div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  let selectedMinutes = null;
  const customInput = document.getElementById('fdCustomMinutes');
  const customHint = document.getElementById('fdCustomHint');
  const confirmBtn = document.getElementById('fdGrantConfirmBtn');
  const clearPresetSelection = () => { box.querySelectorAll('.duration-preset-btn, .duration-forever-btn').forEach(b => b.classList.remove('selected')); };
  const updateConfirmState = () => { if (selectedMinutes === 'forever') { confirmBtn.disabled = false; return; } if (typeof selectedMinutes === 'number' && selectedMinutes > 0) { confirmBtn.disabled = false; return; } confirmBtn.disabled = true; };
  const formatMinutes = (mins) => {
    if (!mins || mins <= 0) return '0 мин';
    const total = Math.round(mins);
    const days = Math.floor(total / (60 * 24));
    const hours = Math.floor((total % (60 * 24)) / 60);
    const m = total % 60;
    const parts = [];
    if (days > 0) parts.push(`${days} д`);
    if (hours > 0) parts.push(`${hours} ч`);
    if (m > 0 && days === 0) parts.push(`${m} мин`);
    return parts.join(' ') || '0 мин';
  };
  box.querySelectorAll('.duration-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      clearPresetSelection(); btn.classList.add('selected'); selectedMinutes = Number(btn.dataset.minutes); customInput.value = ''; customHint.innerHTML = `Будет выдано: <b style="color:#fff;">${formatMinutes(selectedMinutes)}</b>`; updateConfirmState();
    });
  });
  box.querySelectorAll('.duration-forever-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      clearPresetSelection(); btn.classList.add('selected'); selectedMinutes = 'forever'; customInput.value = ''; customHint.innerHTML = `Будет выдано: <b style="color:#fff;">Навсегда</b>`; updateConfirmState();
    });
  });
  customInput.addEventListener('input', () => {
    const v = customInput.value.replace(/\D/g, '').slice(0, 8);
    if (customInput.value !== v) customInput.value = v;
    const num = Number(v);
    if (num > 0) { clearPresetSelection(); selectedMinutes = num; customHint.innerHTML = `Будет выдано: <b style="color:#fff;">${formatMinutes(num)}</b>`; } else { selectedMinutes = null; customHint.innerHTML = `Будет выдано: <b style="color:#fff;">—</b>`; }
    updateConfirmState();
  });
  confirmBtn.onclick = async () => {
    if (selectedMinutes === null) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Выдача...';
    const durationMinutes = selectedMinutes === 'forever' ? 0 : selectedMinutes;
    try {
      const r = await api('/api/admin/privileges/grant', { method: 'POST', body: JSON.stringify({ steamId: selectedPrivilegeUser.steamId, privilegeId, durationMinutes }) });
      toast(`«${privilegeName}» (${r.durationLabel}) выдана`, 'success');
      if (!r.roleApplied) setTimeout(() => toast('В Discord применится после привязки', 'info'), 1200);
      closeModal();
      findPrivilegeUser();
    } catch (e) {
      const errors = { bad_steam_id: 'Неверный Steam ID', privilege_not_found: 'Привилегия не найдена', bad_duration: 'Некорректный срок', no_db: 'Ошибка базы данных', forbidden: 'Нет прав' };
      const key = e.message.split(' — ')[0];
      toast(errors[key] || e.message, 'error');
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Выдать';
    }
  };
};

  searchTimeout = setTimeout(async () => {
    list.innerHTML = '<div class="loading-state"><div class="spinner"></div> Поиск...</div>';
    try {
      const data = await api('/api/steam-search?q=' + encodeURIComponent(q));

async function pickSteamUser(steamId, name, discordId) {

function giveRole(roleId, roleName) {
  if (!selectedMember) return;
  const warn = selectedMember.discordId ? 'Роль будет выдана на сайте и сразу в Discord.' : 'Роль будет выдана на сайте. В Discord она применится автоматически после привязки аккаунта.';
  confirmModal({
    title: `Выдать роль "${roleName}"?`,
    desc: `Пользователь: ${selectedMember.name}. ${warn}`,
    confirmText: 'Выдать',
    onConfirm: async () => {
      try {
        const result = await api('/api/give-role', { method: 'POST', body: JSON.stringify({ steamId: selectedMember.steamId, discordId: selectedMember.discordId, roleId }) });
        toast(`Роль "${roleName}" выдана`, 'success');
        if (!result.appliedToDiscord) setTimeout(() => toast('В Discord применится после привязки', 'info'), 1200);
        document.getElementById('rolePickArea').style.display = 'none';
        selectedMember = null;
        document.getElementById('steamSearch').value = '';
        document.getElementById('steamResults').innerHTML = '<div class="empty-state">Готово</div>';
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

function openPromoCreate() {
  const box = document.getElementById('fdModalBox');
  box.innerHTML = `
    <h3>Новый промокод</h3>
    <p style="margin-bottom:14px;">Код автоматически переводится в верхний регистр. Поддерживаются латиница, <b style="color:#fff;">кириллица</b>, цифры, «_» и «-».</p>

    <input type="text" class="fd-modal-input" id="fd_code" placeholder="FERM100 или СКИДКА" maxlength="32" autocomplete="off" spellcheck="false" style="margin-bottom:6px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><span id="fd_code_status" style="font-size:11px;color:var(--text-dim);">3–32 символа · латиница, кириллица, цифры, «_», «-»</span><span id="fd_code_counter" style="font-size:10.5px;color:var(--text-dim);font-family:'Unbounded';font-weight:600;">0 / 32</span></div>
    <label class="fd-modal-label">Сумма (₽)</label>
    <input type="number" class="fd-modal-input" id="fd_amount" placeholder="100" min="1">
    <label class="fd-modal-label">Лимит активаций (0 = ∞)</label>
    <input type="number" class="fd-modal-input" id="fd_maxUses" placeholder="0" value="0" min="0">
    <div style="margin-bottom:14px;"><div style="font-size:10.5px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;">Быстрые пресеты</div><div style="display:flex;gap:6px;flex-wrap:wrap;"><button type="button" class="btn-act ghost" style="font-size:11px;" onclick="fdPresetCode('ПРОМО')">ПРОМО</button><button type="button" class="btn-act ghost" style="font-size:11px;" onclick="fdPresetCode('СКИДКА')">СКИДКА</button><button type="button" class="btn-act ghost" style="font-size:11px;" onclick="fdPresetCode('БОНУС')">БОНУС</button><button type="button" class="btn-act ghost" style="font-size:11px;" onclick="fdPresetCode('FERM')">FERM</button></div></div>
    <div class="fd-modal-actions"><button class="fd-btn-cancel" onclick="closeModal()">Отмена</button><button class="fd-btn-confirm" id="fdConfirmBtn" disabled>+ Создать</button></div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  const codeEl = document.getElementById('fd_code');
  const statusEl = document.getElementById('fd_code_status');
  const counterEl = document.getElementById('fd_code_counter');
  const confirmBtn = document.getElementById('fdConfirmBtn');
  function validate() {
    const raw = codeEl.value;
    const cleaned = raw.replace(/[^a-zA-Zа-яА-ЯёЁ0-9_\-]/g, '');
    if (cleaned !== raw) codeEl.value = cleaned;
    const upper = cleaned.toUpperCase();
    counterEl.textContent = `${upper.length} / 32`;
    if (!upper) { statusEl.textContent = '3–32 символа · латиница, кириллица, цифры, «_», «-»'; statusEl.style.color = 'var(--text-dim)'; confirmBtn.disabled = true; return; }
    if (upper.length < 3) { statusEl.textContent = `Минимум 3 символа (${upper.length})`; statusEl.style.color = '#fbbf24'; confirmBtn.disabled = true; return; }
    if (/^[A-ZА-ЯЁ0-9_\-]{3,32}$/.test(upper)) {
      const hasCyr = /[А-ЯЁ]/.test(upper);
      statusEl.textContent = hasCyr ? 'Кириллица разрешена' : 'Код валиден';
      statusEl.style.color = '#4ade80';
      confirmBtn.disabled = false;
    }
  }
  codeEl.addEventListener('input', validate);
  validate();
  setTimeout(() => codeEl.focus(), 100);
  confirmBtn.onclick = async () => {
    const code = codeEl.value.trim().toUpperCase();
    const amount = Number(document.getElementById('fd_amount').value);
    const maxUses = Number(document.getElementById('fd_maxUses').value) || 0;
    if (!code || !amount) { toast('Заполните код и сумму', 'error'); return; }
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Создание...';
    try {
      await api('/api/promocodes', { method: 'POST', body: JSON.stringify({ code, amount, maxUses }) });
      toast(`Промокод «${code}» создан`, 'success');
      closeModal();
      loadPromoList();
    } catch (e) {
      const errors = { already_exists: 'Такой уже есть', bad_code_format: 'Неверный формат', missing_fields: 'Заполните поля' };
      const key = e.message.split(' — ')[0];
      toast((errors[key] || e.message), 'error');
      confirmBtn.disabled = false;
      confirmBtn.textContent = '+ Создать';
    }
  };
}

window.fdPresetCode = function(prefix) {

};

async function loadSiteLogsList() {
  const list = document.getElementById('siteLogsList');
  const pag = document.getElementById('siteLogsPagination');
  if (!list) return;
  list.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  if (pag) pag.innerHTML = '';
  const params = new URLSearchParams();
  if (siteLogsFilter.category) params.set('category', siteLogsFilter.category);
  if (siteLogsFilter.action) params.set('action', siteLogsFilter.action);
  if (siteLogsFilter.search) params.set('search', siteLogsFilter.search);
  params.set('page', siteLogsFilter.page);
  params.set('limit', '50');
  try {
    const data = await api('/api/admin/logs?' + params.toString());
    const logs = data.logs || [];
    if (!logs.length) { list.innerHTML = '<div class="empty-state">Записей нет</div>'; return; }
    list.innerHTML = logs.map(l => renderSiteLogRow(l)).join('');
    if (pag && data.pages > 1) {
      const total = data.pages;
      const cur = data.page;
      let html = '';
      html += `<button class="logs-page-btn" ${cur <= 1 ? 'disabled' : ''} onclick="setSiteLogsPage(${cur - 1})">←</button>`;
      const start = Math.max(1, cur - 2);
      const end = Math.min(total, cur + 2);
      for (let i = start; i <= end; i++) { html += `<button class="logs-page-btn ${i === cur ? 'active' : ''}" onclick="setSiteLogsPage(${i})">${i}</button>`; }
      html += `<button class="logs-page-btn" ${cur >= total ? 'disabled' : ''} onclick="setSiteLogsPage(${cur + 1})">→</button>`;
      html += `<span class="logs-page-info">Всего: ${data.total}</span>`;
      pag.innerHTML = html;
    }
  } catch (e) { list.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`; }
}

function setSiteLogsPage(p) {
  siteLogsFilter.page = p;
  loadSiteLogsList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSiteLogRow(l) {
  const date = new Date(l.createdAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const categoryLabel = CATEGORY_LABELS[l.category] || l.category;
  const actionLabel = ACTION_LABELS[l.action] || l.action;
  const CAT_COLORS = { auth: '#60a5fa', profile: '#a855f7', shop: '#fbbf24', moderation: '#4ade80', admin: '#ef4444', roles: '#00a8fc', privileges: '#fbbf24', balance: '#4ade80', promo: '#eb459e', referral: '#23a55a', inventory: '#8b5cf6', general: '#8a8a8a' };
  const color = CAT_COLORS[l.category] || '#8a8a8a';
  const actorHTML = l.actorName ? `<span class="logs-actor">${esc(l.actorName)}${l.actorIsAdmin ? ' <span class="logs-admin-tag">ADMIN</span>' : ''}</span>` : '<span class="logs-actor logs-actor-empty">система</span>';
  const targetHTML = l.targetName || l.targetSteamId ? `<span class="logs-arrow">→</span> <span class="logs-target">${esc(l.targetName || l.targetSteamId)}</span>` : '';
  const metaParts = [];
  const m = l.meta || {};
  if (m.privilegeName) metaParts.push(m.privilegeName);
  if (m.durationLabel) metaParts.push(m.durationLabel);
  if (m.roleName) metaParts.push(m.roleName);
  if (m.itemName) metaParts.push(m.itemName);
  if (m.tariffLabel) metaParts.push(m.tariffLabel);
  if (m.price != null) metaParts.push(`${m.price} ₽`);
  if (m.amount != null && !m.price) metaParts.push(`${m.amount} ₽`);
  if (m.mode) { const modeLabel = m.mode === 'add' ? 'выдал' : m.mode === 'subtract' ? 'снял' : 'установил'; metaParts.push(modeLabel); }
  if (m.oldBalance != null && m.newBalance != null) metaParts.push(`${m.oldBalance} → ${m.newBalance} ₽`);
  if (m.code) metaParts.push(`\`${m.code}\``);
  if (m.oldStatus && m.newStatus) metaParts.push(`${m.oldStatus} → ${m.newStatus}`);
  if (m.fields && m.fields.length) metaParts.push(m.fields.join(', '));
  if (m.appliedToDiscord === true) metaParts.push('Discord: применено');
  if (m.appliedToDiscord === false) metaParts.push('Discord: ожидает');
  if (m.roleApplied === true) metaParts.push('роль выдана');
  if (m.roleApplied === false) metaParts.push('роль ожидает');
  if (m.roleRemoved === true) metaParts.push('роль снята');
  if (m.tier) metaParts.push(`тир: ${m.tier}`);
  if (m.isWin != null) metaParts.push(m.isWin ? 'выигрыш' : 'пусто');
  if (m.type) metaParts.push(`тип: ${m.type}`);
  if (m.paid != null && m.paid > 0) metaParts.push(`оплата ${m.paid} ₽`);
  if (m.count != null) metaParts.push(`позиций: ${m.count}`);
  const metaHTML = metaParts.length ? `<div class="logs-meta">${metaParts.map(p => `<span class="logs-meta-item">${esc(p)}</span>`).join('')}</div>` : '';
  
  // IP-АДРЕС УБРАН ОТСЮДА
  const ipHTML = ''; 

  return `
    <div class="logs-row" style="--log-color:${color};">
      <div class="logs-head"><span class="logs-category" style="background:${color}22;border:1px solid ${color}66;color:${color};">${esc(categoryLabel)}</span><span class="logs-action">${esc(actionLabel)}</span><span class="logs-date">${date}</span></div>
      <div class="logs-body">${actorHTML}${targetHTML}</div>
      ${metaHTML}
      ${ipHTML ? `<div class="logs-footer">${ipHTML}</div>` : ''}
    </div>
  `;
}

async function loadSettingsBlock(body) {
  if (!isOwner()) { body.innerHTML = '<div class="empty-state">Доступно только владельцу.</div>'; return; }
  body.innerHTML = '<div class="skeleton"></div>';
  try {
    const data = await api('/api/settings');
    const s = data.settings || {};
    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head"><div><div class="section-block-title">Настройки</div></div></div>
        <div class="settings-grid">
          <div class="setting-card"><div class="setting-label">Discord сервер</div><div class="setting-value">${esc(s.guildId)}</div></div>
          <div class="setting-card"><div class="setting-label">Канал заявок</div><div class="setting-value">${esc(s.applyChannel)}</div></div>
          <div class="setting-card"><div class="setting-label">Канал логов</div><div class="setting-value">${esc(s.logsChannel)}</div></div>
          <div class="setting-card"><div class="setting-label">Канал покупок</div><div class="setting-value">${esc(s.purchaseChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Канал ролей</div><div class="setting-value">${esc(s.rolesChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Канал привилегий</div><div class="setting-value">${esc(s.privilegesChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Канал логов сайта</div><div class="setting-value">${esc(s.siteLogsChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Канал ошибок</div><div class="setting-value">${esc(s.errorsChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Статус бота</div><div class="setting-value ${s.botConnected ? 'ok' : 'err'}">${s.botConnected ? 'Подключён' : 'Не подключён'}</div></div>
        </div>
      </div>
    `;
  } catch (e) { body.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
}

// --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ МОДАЛОК ---
window.closeModal = function() {
  document.getElementById('fdModal').classList.remove('visible');
  document.getElementById('fdModalBox').innerHTML = '';
};

window.confirmModal = function({ title, desc, confirmText = 'OK', onConfirm }) {
  const box = document.getElementById('fdModalBox');
  box.innerHTML = `
    <h3>${esc(title)}</h3>
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <div class="fd-modal-actions"><button class="fd-btn-cancel" onclick="closeModal()">Отмена</button><button class="fd-btn-confirm" id="fdConfirmBtn">${esc(confirmText)}</button></div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  document.getElementById('fdConfirmBtn').onclick = async () => {
    const btn = document.getElementById('fdConfirmBtn');
    btn.disabled = true;
    try { await onConfirm(); } finally { closeModal(); }
  };
};

window.toast = function(text, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const icons = { success: window.ICONS.checkCircle, error: window.ICONS.x, info: window.ICONS.info };
  const cleanText = window.stripEmoji(text);
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span>${esc(cleanText)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('fade'); setTimeout(() => el.remove(), 300); }, 3000);
};

document.addEventListener('DOMContentLoaded', () => {
  const di = document.getElementById('deniedIcon');
  if (di) di.innerHTML = window.ICONS.lock;
});

window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  const isAuthorized = window.canAccessAdmin ? window.canAccessAdmin(user) : false;
  if (!isAuthorized) {
    document.getElementById('deniedBlock').style.display = 'flex';
    document.getElementById('adminWrap').style.display = 'none';
    return;
  }
  document.getElementById('deniedBlock').style.display = 'none';
  document.getElementById('adminWrap').style.display = 'block';
  const avatar = document.getElementById('headerAvatar');
  if (avatar) { if (user.avatar) { avatar.src = user.avatar; avatar.style.display = ''; } else { avatar.style.display = 'none'; } }
  const btn = document.getElementById('profileAvatarBtn');
  if (btn) btn.style.display = '';
  const menuBox = document.getElementById('profileMenuContent');
  if (menuBox) menuBox.innerHTML = renderProfileMenu('admin');
  renderTabs();
});

setTimeout(() => {
  if (!window.currentUser && document.getElementById('adminWrap').style.display === 'none') {
    document.getElementById('deniedBlock').style.display = 'flex';
  }
}, 2000);
</script>
