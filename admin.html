<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Админ-панель</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
* { box-sizing: border-box; }
body > .auth-widget { display: none !important; }

.admin-wrap { min-height: 100vh; position: relative; z-index: 1; padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }

.admin-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 20px; background: rgba(10,10,10,0.9); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 22px; backdrop-filter: blur(20px); }
.admin-brand { display: flex; align-items: center; gap: 12px; }
.admin-brand img { width: 38px; height: 38px; border-radius: 11px; object-fit: contain; background: rgba(225,6,0,0.08); border: 1px solid rgba(225,6,0,0.3); padding: 4px; }
.admin-brand-text { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: -0.6px; background: linear-gradient(135deg, #fff 20%, var(--red) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
.admin-brand-sub { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-top: 1px; }

.admin-user { display: flex; align-items: center; gap: 12px; }
.admin-exit { padding: 9px 16px; background: rgba(225,6,0,0.12); border: 1px solid rgba(225,6,0,0.4); border-radius: 10px; color: var(--red); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; transition: all 0.3s; }
.admin-exit:hover { background: rgba(225,6,0,0.25); border-color: var(--red); }

.admin-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
.tab-block { display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; text-align: left; }
.tab-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--tab-color, var(--red)); box-shadow: 0 0 20px var(--tab-color, var(--red)); opacity: 0.5; transition: opacity 0.3s; }
.tab-block:hover { transform: translateY(-4px); border-color: var(--tab-color, var(--red)); }
.tab-block.active { border-color: var(--tab-color, var(--red)); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
.tab-block.active::before { opacity: 1; height: 4px; }
.tab-block-icon { width: 48px; height: 48px; border-radius: 13px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--tab-color, var(--red)); flex-shrink: 0; }
.tab-block-info { flex: 1; min-width: 0; }
.tab-block-title { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.4px; margin-bottom: 3px; }
.tab-block-desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
.tab-block-badge { padding: 4px 12px; background: rgba(225,6,0,0.15); border: 1px solid rgba(225,6,0,0.5); border-radius: 100px; font-size: 11px; color: var(--red); font-weight: 700; font-family: 'Unbounded', sans-serif; flex-shrink: 0; }

.admin-content { animation: fadeUp 0.4s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.section-block { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; margin-bottom: 16px; }
.section-block-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.section-block-title { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.section-block-title .ico { width: 32px; height: 32px; border-radius: 9px; background: rgba(225,6,0,0.12); border: 1px solid rgba(225,6,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.section-block-sub { font-size: 12px; color: var(--text-dim); margin-top: 5px; }

.subtabs { display: inline-flex; gap: 4px; padding: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.subtab { padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 7px; }
.subtab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.subtab.active { color: #fff; background: linear-gradient(135deg, rgba(225,6,0,0.25), rgba(139,0,0,0.15)); border-color: rgba(225,6,0,0.5); }
.subtab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; padding: 2px 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-bright); border-radius: 100px; font-size: 10px; font-weight: 700; font-family: 'Unbounded', sans-serif; }
.subtab.active .subtab-count { background: rgba(225,6,0,0.25); border-color: rgba(225,6,0,0.6); color: #fff; }

.cards-list { display: flex; flex-direction: column; gap: 12px; }
.app-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; gap: 16px; align-items: flex-start; transition: all 0.3s; }
.app-card:hover { border-color: rgba(225,6,0,0.4); transform: translateX(4px); }
.app-avatar { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; object-fit: cover; }
.app-body { flex: 1; min-width: 0; }
.app-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.app-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
.app-date { font-size: 11.5px; color: var(--text-dim); }
.app-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }
.app-row b { color: var(--text); }
.app-text { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-top: 6px; color: var(--text); }
.app-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.status-pill { display: inline-block; padding: 3px 11px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
.status-pill.pending  { background: rgba(251,191,36,0.15); color: #fbbf24; }
.status-pill.approved { background: rgba(74,222,128,0.15); color: #4ade80; }
.status-pill.rejected { background: rgba(239,68,68,0.15); color: #ef4444; }

.btn-act { padding: 8px 14px; border-radius: 9px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px; }
.btn-act:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-act.green { background: rgba(74,222,128,0.12); color: #4ade80; border-color: rgba(74,222,128,0.4); }
.btn-act.green:hover:not(:disabled) { background: rgba(74,222,128,0.25); }
.btn-act.red { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.4); }
.btn-act.red:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
.btn-act.blue { background: rgba(59,130,246,0.12); color: #60a5fa; border-color: rgba(59,130,246,0.4); }
.btn-act.blue:hover:not(:disabled) { background: rgba(59,130,246,0.25); }
.btn-act.ghost { background: rgba(255,255,255,0.04); color: var(--text); border-color: var(--border-bright); }
.btn-act.ghost:hover:not(:disabled) { border-color: var(--red); background: rgba(225,6,0,0.08); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 13px; }
.empty-state .ico { font-size: 44px; margin-bottom: 12px; opacity: 0.35; }
.loading-state { display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 10px; color: var(--text-dim); font-size: 13px; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, rgba(255,255,255,0.04) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 14px; height: 90px; margin-bottom: 12px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.search-wrap { position: relative; margin-bottom: 16px; }
.search-input { width: 100%; padding: 12px 16px 12px 42px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; }
.search-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.search-wrap::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: 0.5; z-index: 1; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat-tile { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
.stat-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--tile-color, var(--red)); box-shadow: 0 0 20px var(--tile-color, var(--red)); opacity: 0.7; }
.stat-tile-icon { font-size: 20px; margin-bottom: 10px; color: var(--tile-color, var(--red)); }
.stat-tile-value { font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; color: #fff; margin-bottom: 5px; }
.stat-tile-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); font-weight: 700; }

.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.staff-tile { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-left: 4px solid var(--role-color, var(--red)); border-radius: 14px; padding: 16px 18px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: all 0.3s; }
.staff-tile:hover { transform: translateY(-4px); border-color: var(--role-color, var(--red)); }
.staff-avatar-wrap { position: relative; flex-shrink: 0; }
.staff-avatar { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; }
.staff-presence { position: absolute; bottom: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--bg-card); }
.staff-presence.online  { background: #4ade80; }
.staff-presence.idle    { background: #fbbf24; }
.staff-presence.dnd     { background: #ef4444; }
.staff-presence.offline { background: #6b7280; }
.staff-info { flex: 1; min-width: 0; }
.staff-info h3 { font-family: 'Unbounded', sans-serif; font-size: 13.5px; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staff-role { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.setting-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.setting-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); margin-bottom: 7px; font-weight: 700; }
.setting-value { font-family: 'Unbounded', sans-serif; font-size: 12.5px; word-break: break-all; color: #fff; }
.setting-value.ok { color: #4ade80; }
.setting-value.err { color: var(--red); }

.role-simple-list { display: flex; flex-direction: column; border: 1px solid var(--border-bright); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.01); }
.role-simple-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--border); }
.role-simple-item:last-child { border-bottom: none; }
.role-simple-item:hover { background: rgba(225,6,0,0.06); }
.role-checkbox { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.role-simple-item:hover .role-checkbox { border-color: var(--red); }
.role-checkbox.checked { background: var(--red); border-color: var(--red); }
.role-checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 900; line-height: 1; }
.role-simple-name { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }

.fd-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
.fd-modal-overlay.visible { display: flex; }
.fd-modal { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border-bright); border-radius: 22px; padding: 28px; max-width: 480px; width: 100%; animation: fdModalIn 0.35s; position: relative; overflow: hidden; }
.fd-modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--red), var(--red-dark), var(--red)); }
@keyframes fdModalIn { from { opacity: 0; transform: scale(0.94) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.fd-modal-icon { width: 56px; height: 56px; border-radius: 16px; background: rgba(225,6,0,0.12); border: 1px solid rgba(225,6,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 16px; }
.fd-modal h3 { font-family: 'Unbounded', sans-serif; font-size: 19px; margin-bottom: 8px; color: #fff; }
.fd-modal p { color: var(--text-dim); font-size: 13.5px; margin-bottom: 20px; line-height: 1.6; }
.fd-modal-input { width: 100%; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none; margin-bottom: 12px; }
.fd-modal-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.fd-modal-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 700; margin-bottom: 8px; }
.fd-modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
.fd-modal-actions button { padding: 12px 22px; border-radius: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; }
.fd-btn-cancel { background: rgba(255,255,255,0.04); color: var(--text); border-color: var(--border-bright); }
.fd-btn-cancel:hover { border-color: var(--red); }
.fd-btn-confirm { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; }
.fd-btn-confirm:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(225,6,0,0.4); }
.fd-btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
.fd-btn-confirm.green { background: linear-gradient(135deg, #4ade80, #16a34a); }

.fd-radio-list { display: flex; flex-direction: column; gap: 8px; }
.fd-radio { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; }
.fd-radio:hover { border-color: rgba(225,6,0,0.5); }
.fd-radio.selected { border-color: var(--red); background: rgba(225,6,0,0.08); }
.fd-radio input { accent-color: var(--red); }
.fd-radio span { font-size: 14px; color: var(--text); }

.toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: 380px; }
.toast { background: rgba(14,14,14,0.97); backdrop-filter: blur(20px); border: 1px solid var(--border-bright); border-left: 4px solid var(--red); border-radius: 12px; padding: 13px 18px; min-width: 240px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); pointer-events: auto; animation: toastIn 0.4s; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 10px; }
.toast.success { border-left-color: #4ade80; }
.toast.error { border-left-color: var(--red); }
.toast.info { border-left-color: #60a5fa; }
.toast.fade { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

.denied { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; gap: 16px; }
.denied-icon { font-size: 70px; }
.denied h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(28px, 4.5vw, 46px); color: var(--red); letter-spacing: -2px; }
.denied p { color: var(--text-dim); max-width: 460px; line-height: 1.7; font-size: 14px; }

@media (max-width: 700px) {
  .admin-wrap { padding: 14px 14px 50px; }
  .admin-tabs { grid-template-columns: 1fr; gap: 8px; }
  .tab-block { padding: 14px 16px; }
  .tab-block-icon { width: 40px; height: 40px; font-size: 18px; }
  .tab-block-title { font-size: 14px; }
  .app-avatar { width: 48px; height: 48px; }
  .fd-modal { padding: 22px; }
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-glow-3"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="auth-widget" id="authWidget"></div>

<div class="denied" id="deniedBlock" style="display:none;">
  <div class="denied-icon">🔒</div>
  <h1>Доступ запрещён</h1>
  <p>Эта страница доступна только персоналу проекта Fernodd.</p>
  <a class="btn-act ghost" href="/index.html" style="padding: 12px 22px; font-size: 13px; text-decoration: none;">← На главную</a>
</div>

<div class="admin-wrap" id="adminWrap" style="display:none;">
  <div class="admin-top">
    <div class="admin-brand">
      <img src="/logo.png" alt="Fernodd">
      <div>
        <div class="admin-brand-text">Fernodd</div>
        <div class="admin-brand-sub">Admin Panel</div>
      </div>
    </div>
    <div class="admin-user">
      <div class="profile-avatar-btn" id="profileAvatarBtn" onclick="toggleProfileMenu(event)">
        <img id="headerAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        <div id="profileMenuContent"></div>
      </div>
      <button class="admin-exit" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="tab-block active" data-tab="moderator" style="--tab-color: #60a5fa;" onclick="switchTab('moderator')">
      <div class="tab-block-icon">🛡️</div>
      <div class="tab-block-info">
        <div class="tab-block-title">Модератор</div>
        <div class="tab-block-desc">Заявки, жалобы, логи модерации</div>
      </div>
      <span class="tab-block-badge" id="modBadge">0</span>
    </button>
    <button class="tab-block" data-tab="manage" style="--tab-color: #4ade80;" onclick="switchTab('manage')">
      <div class="tab-block-icon">⚙️</div>
      <div class="tab-block-info">
        <div class="tab-block-title">Управление</div>
        <div class="tab-block-desc">Персонал, аналитика, промокоды, роли</div>
      </div>
    </button>
  </div>

  <div class="admin-content" id="adminContent"></div>
</div>

<div class="fd-modal-overlay" id="fdModal">
  <div class="fd-modal" id="fdModalBox"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/js/common.js"></script>
<script src="/js/my-profile.js"></script>
<script src="/js/auth.js"></script>
<script>
const ROLE_COLOR_OVERRIDE = {
  'Главная администрация': '#e10600',
  'Владелец': '#e10600',
  'Разработчик': '#e10600',
  'Следящий': '#e10600',
  'Куратор': '#e10600',
  'Поддержка': '#e10600',
  'Медиа': '#e10600',
  'Главный модератор': '#22d3ee',
  'Старший модератор': '#4ade80',
  'Модератор': '#3b82f6',
  'Игрок': '#a855f7',
};

let isAuthorized = false;
let currentTab = 'moderator';
let moderatorSub = 'apps';
let manageSub = 'staff';
let appsData = { pending: [], approved: [], rejected: [] };
let appsFilter = 'pending';
let staffData = { administrators: [], moderators: [] };
let staffFilter = 'administrators';

function getToken() { return localStorage.getItem('fernodd_token') || ''; }

async function api(path, options = {}) {
  const base = window.API_BASE || '';
  const r = await fetch(base + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getToken(),
      ...(options.headers || {})
    }
  });
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { error: text }; }
  if (!r.ok) throw new Error((data.error || 'error') + ' — ' + (data.details || ''));
  return data;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(text, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span style="font-weight:900;">${icons[type] || 'ℹ'}</span><span>${esc(text)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('fade');
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

function closeModal() {
  document.getElementById('fdModal').classList.remove('visible');
  document.getElementById('fdModalBox').innerHTML = '';
}

function confirmModal({ icon = '❓', title, desc, confirmText = 'OK', confirmClass = '', onConfirm }) {
  const box = document.getElementById('fdModalBox');
  box.innerHTML = `
    <div class="fd-modal-icon">${icon}</div>
    <h3>${esc(title)}</h3>
    <p>${esc(desc || '')}</p>
    <div class="fd-modal-actions">
      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm ${confirmClass}" id="fdConfirmBtn">${esc(confirmText)}</button>
    </div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  document.getElementById('fdConfirmBtn').onclick = async () => {
    const btn = document.getElementById('fdConfirmBtn');
    btn.disabled = true;
    try { await onConfirm(); } finally { closeModal(); }
  };
}

function formModal({ icon = '📝', title, fields = [], confirmText = 'Создать', onConfirm }) {
  const box = document.getElementById('fdModalBox');
  const fieldsHtml = fields.map(f => `
    <label class="fd-modal-label">${esc(f.label)}</label>
    <input type="${f.type || 'text'}" class="fd-modal-input" id="fd_${f.id}" placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}">
  `).join('');
  box.innerHTML = `
    <div class="fd-modal-icon">${icon}</div>
    <h3>${esc(title)}</h3>
    ${fieldsHtml}
    <div class="fd-modal-actions">
      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm" id="fdConfirmBtn">${esc(confirmText)}</button>
    </div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  setTimeout(() => {
    const first = box.querySelector('.fd-modal-input');
    if (first) first.focus();
  }, 100);
  document.getElementById('fdConfirmBtn').onclick = async () => {
    const values = {};
    for (const f of fields) values[f.id] = document.getElementById('fd_' + f.id).value.trim();
    const btn = document.getElementById('fdConfirmBtn');
    btn.disabled = true;
    try { await onConfirm(values); } finally { closeModal(); }
  };
}

function radioModal({ icon = '❓', title, desc, options = [], confirmText = 'Применить', confirmClass = 'green', onConfirm }) {
  const box = document.getElementById('fdModalBox');
  const optsHtml = options.map(o => `
    <label class="fd-radio" data-val="${esc(o.value)}">
      <input type="radio" name="fdRadio" value="${esc(o.value)}">
      <span>${esc(o.label)}</span>
    </label>
  `).join('');
  box.innerHTML = `
    <div class="fd-modal-icon">${icon}</div>
    <h3>${esc(title)}</h3>
    <p>${esc(desc || '')}</p>
    <div class="fd-radio-list">${optsHtml}</div>
    <div class="fd-modal-actions">
      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm ${confirmClass}" id="fdConfirmBtn" disabled>${esc(confirmText)}</button>
    </div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  let selected = null;
  box.querySelectorAll('.fd-radio').forEach(label => {
    label.addEventListener('click', () => {
      box.querySelectorAll('.fd-radio').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      selected = label.querySelector('input').value;
      document.getElementById('fdConfirmBtn').disabled = false;
    });
  });
  document.getElementById('fdConfirmBtn').onclick = async () => {
    if (!selected) return;
    const btn = document.getElementById('fdConfirmBtn');
    btn.disabled = true;
    try { await onConfirm(selected); } finally { closeModal(); }
  };
}

function isOwner() { return !!(window.currentUser && window.currentUser.isOwner); }
function isHeadAdminOrOwner() { return !!(window.currentUser && (window.currentUser.isHeadAdmin || window.currentUser.isOwner)); }
function isWatcherOrAbove() {
  const u = window.currentUser;
  if (!u) return false;
  if (u.isHeadAdmin || u.isOwner) return true;
  return (u.roles || []).some(r => r === 'Следящий');
}
function canApprove() { return isWatcherOrAbove(); }

window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  isAuthorized = window.canAccessAdmin ? window.canAccessAdmin(user) : false;
  if (!isAuthorized) {
    document.getElementById('deniedBlock').style.display = 'flex';
    document.getElementById('adminWrap').style.display = 'none';
    return;
  }
  document.getElementById('deniedBlock').style.display = 'none';
  document.getElementById('adminWrap').style.display = 'block';

  const avatar = document.getElementById('headerAvatar');
  if (avatar) avatar.src = user.avatar || '';

  const menuBox = document.getElementById('profileMenuContent');
  if (menuBox) menuBox.innerHTML = renderProfileMenu('');

  switchTab('moderator');
});

setTimeout(() => {
  if (!isAuthorized && document.getElementById('adminWrap').style.display === 'none') {
    document.getElementById('deniedBlock').style.display = 'flex';
  }
}, 2000);

function logout() {
  localStorage.removeItem('fernodd_token');
  window.location.reload();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-block').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'moderator') {
    renderModerator();
    loadModeratorCounts();
  } else {
    if (!isHeadAdminOrOwner()) {
      toast('Раздел доступен только главной администрации.', 'error');
      switchTab('moderator');
      return;
    }
    renderManage();
  }
}

async function loadModeratorCounts() {
  try {
    const apps = await api('/api/applications').catch(() => ({ applications: [] }));
    const pending = (apps.applications || []).filter(a => a.status === 'pending').length;
    const tickets = await api('/api/tickets').catch(() => ({ open: [] }));
    const total = pending + (tickets.open || []).length;
    const badge = document.getElementById('modBadge');
    if (badge) {
      badge.textContent = total;
      badge.style.display = total > 0 ? 'inline-block' : 'none';
    }
  } catch {}
}

async function loadAppsBlock(body) {
  body.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    const data = await api('/api/applications');
    const all = data.applications || [];
    appsData.pending = all.filter(a => a.status === 'pending');
    appsData.approved = all.filter(a => a.status === 'approved');
    appsData.rejected = all.filter(a => a.status === 'rejected');
    document.getElementById('cntApps').textContent = appsData.pending.length;

    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head">
          <div>
            <div class="section-block-title"><span class="ico">📋</span> Заявки игроков</div>
            <div class="section-block-sub">Одобряйте, отклоняйте, удаляйте заявки</div>
          </div>
          <button class="btn-act ghost" onclick="loadAppsBlock(document.getElementById('modBody'))">↻ Обновить</button>
        </div>
        <div class="subtabs">
          <button class="subtab ${appsFilter === 'pending' ? 'active' : ''}" onclick="setAppsFilter('pending')">🕒 Ожидание <span class="subtab-count">${appsData.pending.length}</span></button>
          <button class="subtab ${appsFilter === 'approved' ? 'active' : ''}" onclick="setAppsFilter('approved')">✓ Одобрено <span class="subtab-count">${appsData.approved.length}</span></button>
          <button class="subtab ${appsFilter === 'rejected' ? 'active' : ''}" onclick="setAppsFilter('rejected')">✕ Отклонено <span class="subtab-count">${appsData.rejected.length}</span></button>
        </div>
        <div class="search-wrap">
          <input class="search-input" id="appsSearch" placeholder="Поиск по нику..." oninput="renderAppsList()">
        </div>
        <div class="cards-list" id="appsList"></div>
      </div>
    `;
    renderAppsList();
  } catch (e) {
    body.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

function setAppsFilter(f) {
  appsFilter = f;
  document.querySelectorAll('.subtabs .subtab').forEach(b => {
    if (b.textContent.includes('Ожидание')) b.classList.toggle('active', f === 'pending');
    else if (b.textContent.includes('Одобрено')) b.classList.toggle('active', f === 'approved');
    else if (b.textContent.includes('Отклонено')) b.classList.toggle('active', f === 'rejected');
  });
  renderAppsList();
}

function renderAppsList() {
  const el = document.getElementById('appsList');
  if (!el) return;
  const search = (document.getElementById('appsSearch')?.value || '').toLowerCase().trim();
  let list = appsData[appsFilter] || [];
  if (search) list = list.filter(a => (a.discord || '').toLowerCase().includes(search) || (a.authorName || '').toLowerCase().includes(search) || (a.steam || '').toLowerCase().includes(search));
  if (!list.length) {
    const labels = { pending: 'Заявок в ожидании нет.', approved: 'Одобренных заявок нет.', rejected: 'Отклонённых заявок нет.' };
    el.innerHTML = `<div class="empty-state"><div class="ico">📭</div>${labels[appsFilter]}</div>`;
    return;
  }
  el.innerHTML = list.map(a => {
    const date = new Date(a.date).toLocaleString('ru-RU');
    const statusLabel = a.status === 'approved' ? 'Одобрено' : a.status === 'rejected' ? 'Отклонено' : 'Ожидание';
    const borderColor = a.status === 'approved' ? '#4ade80' : a.status === 'rejected' ? '#ef4444' : '#fbbf24';
    let actions = '';
    if (a.status === 'pending' && canApprove()) {
      actions = `<div class="app-actions">
        <button class="btn-act green" onclick="quickStatus('${a.id}','approve')">✓ Одобрить</button>
        <button class="btn-act red" onclick="quickStatus('${a.id}','reject')">✕ Отклонить</button>
      </div>`;
    } else if (a.status !== 'pending' && canApprove()) {
      actions = `<div class="app-actions">
        <button class="btn-act blue" onclick="openChange('${a.id}')">↻ Изменить</button>
        <button class="btn-act red" onclick="openDelete('${a.id}')">🗑 Удалить</button>
      </div>`;
    }
    return `<div class="app-card" style="border-left:4px solid ${borderColor};">
      <img class="app-avatar" src="${a.avatar}" alt="">
      <div class="app-body">
        <div class="app-head">
          <div><span class="app-name">${esc(a.discord || a.steam || a.authorName)}</span> <span class="status-pill ${a.status}">${statusLabel}</span></div>
          <span class="app-date">${date}</span>
        </div>
        <div class="app-row">
          <span>Возраст: <b>${esc(a.age || '—')}</b></span>
          <span>Онлайн: <b>${esc(a.online || '—')}</b></span>
          <span>Опыт: <b>${esc(a.experience || '—')}</b></span>
        </div>
        <div class="app-text">${esc(a.motivation || '—')}</div>
        ${actions}
      </div>
    </div>`;
  }).join('');
}

function quickStatus(id, action) {
  confirmModal({
    icon: action === 'approve' ? '✓' : '✕',
    title: action === 'approve' ? 'Одобрить заявку?' : 'Отклонить заявку?',
    desc: 'Действие изменит статус заявки в Discord.',
    confirmText: action === 'approve' ? 'Одобрить' : 'Отклонить',
    confirmClass: action === 'approve' ? 'green' : '',
    onConfirm: async () => {
      try {
        await api(`/api/applications/${id}/${action}`, { method: 'POST' });
        toast(action === 'approve' ? '✓ Заявка одобрена.' : '✕ Заявка отклонена.', 'success');
        loadAppsBlock(document.getElementById('modBody'));
        loadModeratorCounts();
      } catch (e) { toast(e.message, 'error'); }
    }
  });
}

function openChange(id) {
  radioModal({
    icon: '↻',
    title: 'Изменить статус',
    desc: 'Выберите новый статус заявки',
    options: [
      { value: 'approved', label: '✓ Одобрить' },
      { value: 'rejected', label: '✕ Отклонить' },
      { value: 'pending', label: '🕒 Вернуть на рассмотрение' },
    ],
    onConfirm: async (newStatus) => {
      try {
        await api(`/api/applications/${id}/change`, { method: 'POST', body: JSON.stringify({ newStatus }) });
        toast('✓ Статус изменён.', 'success');
        loadAppsBlock(document.getElementById('modBody'));
        loadModeratorCounts();
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

function openDelete(id) {
  confirmModal({
    icon: '🗑',
    title: 'Удалить заявку?',
    desc: 'Заявка будет навсегда удалена из Discord.',
    confirmText: '🗑 Удалить',
    onConfirm: async () => {
      try {
        await api(`/api/applications/${id}`, { method: 'DELETE' });
        toast('🗑 Заявка удалена.', 'success');
        loadAppsBlock(document.getElementById('modBody'));
        loadModeratorCounts();
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

  body.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    const data = await api('/api/tickets');
    ticketsData.open = data.open || [];
    ticketsData.closed = data.closed || [];
    document.getElementById('cntTickets').textContent = ticketsData.open.length;
    body.innerHTML = `
      <div class="section-block" id="ticketsMain">
        <div class="section-block-head">
          <div>
            <div class="section-block-title"><span class="ico">💬</span> Жалобы игроков</div>
            <div class="section-block-sub">Открытые и закрытые тикеты</div>
          </div>
        </div>
        <div class="subtabs">
          <button class="subtab ${ticketsFilter === 'open' ? 'active' : ''}" onclick="setTicketsFilter('open')">🟢 Открытые <span class="subtab-count">${ticketsData.open.length}</span></button>
          <button class="subtab ${ticketsFilter === 'closed' ? 'active' : ''}" onclick="setTicketsFilter('closed')">🔒 Закрытые <span class="subtab-count">${ticketsData.closed.length}</span></button>
        </div>
        <div class="cards-list" id="ticketsList"></div>
      </div>
      <div id="ticketDetail" style="display:none;">
        <button class="btn-act ghost" onclick="closeTicket()" style="margin-bottom: 12px;">← Назад</button>

        <div id="ticketChat" class="section-block" style="max-height:60vh;overflow-y:auto;"></div>
      </div>
    `;
    renderTicketsList();
  } catch (e) {
    body.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }

function setTicketsFilter(f) {
  ticketsFilter = f;
  document.querySelectorAll('.subtabs .subtab').forEach(b => {
    if (b.textContent.includes('Открытые')) b.classList.toggle('active', f === 'open');
    if (b.textContent.includes('Закрытые')) b.classList.toggle('active', f === 'closed');
  });
  renderTicketsList();
}

function renderTicketsList() {
  const el = document.getElementById('ticketsList');
  if (!el) return;
  const list = ticketsData[ticketsFilter] || [];
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="ico">📭</div>Тикетов нет.</div>`;
    return;
  }
  el.innerHTML = list.map(t => {
    const date = t.lastDate ? new Date(t.lastDate).toLocaleString('ru-RU') : '—';
    const icon = ticketsFilter === 'closed' ? '🔒' : '🟢';
    const safeName = (t.name || '').replace(/'/g, "\\'");
    return `<div class="app-card" style="cursor:pointer;" onclick="openTicket('${t.id}', '${safeName}')">
      <div class="app-body">
        <div class="app-head">
          <span class="app-name">${icon} #${esc(t.name)}</span>
          <span class="app-date">${date}</span>
        </div>
        ${t.lastAuthor ? `<div class="app-row"><span>Последний: <b>${esc(t.lastAuthor)}</b></span></div>` : ''}
        <div class="app-text">${esc(t.preview || '(нет сообщений)')}</div>
      </div>
    </div>`;
  }).join('');
}

async function openTicket(id, name) {
  currentTicketId = id;
  lastMessages = '';
  document.getElementById('ticketsMain').style.display = 'none';
  document.getElementById('ticketDetail').style.display = 'block';
  document.getElementById('ticketHeader').innerHTML = `<h3 style="font-family:'Unbounded';font-size:16px;margin-bottom:10px;color:#fff;">#${esc(name)}</h3>`;
  document.getElementById('ticketChat').innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  await loadTicketMessages();
  if (ticketPoll) clearInterval(ticketPoll);
  ticketPoll = setInterval(loadTicketMessages, 5000);
}
function closeTicket() {
  if (ticketPoll) { clearInterval(ticketPoll); ticketPoll = null; }
  currentTicketId = null;
  document.getElementById('ticketDetail').style.display = 'none';
  document.getElementById('ticketsMain').style.display = 'block';
}
async function loadTicketMessages() {
  if (!currentTicketId) return;
  try {
    const data = await api(`/api/tickets/${currentTicketId}/messages`);
    const json = JSON.stringify(data.messages);
    if (json === lastMessages) return;
    lastMessages = json;
    const el = document.getElementById('ticketChat');
    if (!data.messages.length) {
      el.innerHTML = '<div class="empty-state">Сообщений нет.</div>';
      return;
    }
    el.innerHTML = data.messages.map(m => {
      const time = new Date(m.date).toLocaleString('ru-RU');
      const body = m.content || m.embedDescription || '';
      const atts = (m.attachments || []).map(a => {
        if ((a.type || '').startsWith('image/')) return `<img src="${a.url}" style="max-width:280px;border-radius:10px;margin-top:8px;" alt="">`;
        return `<a href="${a.url}" target="_blank" class="btn-act ghost" style="margin-top:8px;">📎 Вложение</a>`;
      }).join('');
      return `<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">
        <img src="${m.avatar}" style="width:38px;height:38px;border-radius:10px;flex-shrink:0;object-fit:cover;" alt="">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px;">
            <span style="font-family:'Unbounded';font-size:12px;color:#fff;font-weight:700;">${esc(m.authorName)}${m.authorBot ? ' 🤖' : ''}</span>
            <span style="font-size:10px;color:var(--text-dim);">${time}</span>
          </div>
          ${body ? `<div style="font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;">${esc(body)}</div>` : ''}
          ${atts}
        </div>
      </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    document.getElementById('ticketChat').innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head">
          <div>
            <div class="section-block-title"><span class="ico">📜</span> Логи Discord</div>
            <div class="section-block-sub">Последние 50 записей</div>
          </div>
        </div>
        <div class="cards-list">
          ${logs.map(l => {
            const date = new Date(l.date).toLocaleString('ru-RU');
            return `<div class="app-card">
              <img class="app-avatar" src="${l.avatar}" alt="">
              <div class="app-body">
                <div class="app-head">
                  <span class="app-name">${esc(l.authorName)}</span>
                  <span class="app-date">${date}</span>
                </div>

function setStaffFilter(f) {
  staffFilter = f;
  document.querySelectorAll('.subtabs .subtab').forEach(b => {

  renderStaffGrid();
}

function renderStaffGrid() {
  const grid = document.getElementById('staffGrid');

  }
  grid.innerHTML = list.map(s => {
    const status = (s.presence && s.presence.status) || 'offline';
    const color = ROLE_COLOR_OVERRIDE[s.topRole] || s.topRoleColor;
    return `<div class="staff-tile" style="--role-color:${color};" onclick="window.location.href='/profile.html?id=${s.id}'">

}

let searchTimeout = null;
async function searchSteamUsers() {
  const q = document.getElementById('steamSearch').value.trim();
  const list = document.getElementById('steamResults');
  if (q.length < 3) { list.innerHTML = '<div class="empty-state">Минимум 3 символа</div>'; return; }
  if (searchTimeout) clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    list.innerHTML = '<div class="loading-state"><div class="spinner"></div> Поиск...</div>';
    try {
      const data = await api('/api/steam-search?q=' + encodeURIComponent(q));
      const users = data.users || [];
      if (!users.length) { list.innerHTML = '<div class="empty-state">Никого не найдено</div>'; return; }
      list.innerHTML = users.map(u => {
        const linked = !!u.discordId;
        const roleLabel = u.currentRole ? `<span style="background:rgba(74,222,128,0.15);color:#4ade80;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;">${esc(u.currentRole)}</span>` : '';
        const pendingLabel = u.pendingRole ? `<span style="background:rgba(251,191,36,0.15);color:#fbbf24;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;">Ожидает: ${esc(u.pendingRole)}</span>` : '';
        return `<div class="app-card" style="cursor:${linked ? 'pointer' : 'not-allowed'};opacity:${linked ? 1 : 0.5};"
               ${linked ? `onclick="pickSteamUser('${u.discordId}', '${(u.personaName || '').replace(/'/g, "\\'")}')"` : ''}>
          <img class="app-avatar" src="${u.avatar}" alt="">
          <div class="app-body">
            <div class="app-head"><span class="app-name">${esc(u.personaName)}</span> ${roleLabel} ${pendingLabel}</div>
            <div class="app-row">
              <span>Steam: <b>${esc(u.steamId)}</b></span>
              ${linked ? `<span>Discord: <b>${esc(u.discordId)}</b></span>` : '<span style="color:var(--red);">Discord не привязан</span>'}
            </div>
          </div>
        </div>`;
      }).join('');
    } catch (e) { list.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
  }, 400);
}

async function pickSteamUser(discordId, name) {
  selectedMember = { id: discordId, name };
  document.getElementById('selectedUserName').textContent = name;
  document.getElementById('rolePickArea').style.display = 'block';
  const roleList = document.getElementById('rolePickList');
  roleList.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  try {
    const [rolesData, currentData] = await Promise.all([
      api('/api/roles-list'),
      api('/api/user-current-role/' + discordId),
    ]);
    availableRoles = rolesData.roles || [];
    const currentRole = currentData.currentRole || null;
    if (!availableRoles.length) { roleList.innerHTML = '<div class="empty-state">Нет ролей</div>'; return; }
    roleList.innerHTML = `
      <div class="role-simple-list">
        ${availableRoles.map(r => {
          const isCurrent = currentRole && currentRole.toLowerCase() === r.name.toLowerCase();
          return `<div class="role-simple-item" onclick="giveRole('${r.id}','${r.name.replace(/'/g, "\\'")}')">
            <div class="role-checkbox ${isCurrent ? 'checked' : ''}"></div>
            <div class="role-simple-name">${esc(r.name)}</div>
            ${isCurrent ? '<span style="font-size:11px;color:var(--red);font-weight:700;margin-left:auto;">ТЕКУЩАЯ</span>' : ''}
          </div>`;
        }).join('')}
      </div>`;
  } catch (e) { roleList.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
}

function giveRole(roleId, roleName) {
  if (!selectedMember) return;
  confirmModal({
    icon: '👑',
    title: `Выдать роль "${roleName}"?`,
    desc: `Пользователь: ${selectedMember.name}. Роль будет выдана на сайте. В Discord она применится после привязки аккаунта.`,
    confirmText: '✓ Выдать',
    confirmClass: 'green',
    onConfirm: async () => {
      try {
        await api('/api/give-role', { method: 'POST', body: JSON.stringify({ discordId: selectedMember.id, roleId }) });
        toast(`✓ Роль "${roleName}" выдана на сайте`, 'success');
        document.getElementById('rolePickArea').style.display = 'none';
        selectedMember = null;
        document.getElementById('steamSearch').value = '';
        document.getElementById('steamResults').innerHTML = '<div class="empty-state">Готово</div>';
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

function openPromoCreate() {
  formModal({
    icon: '🎟️',
    title: 'Новый промокод',
    fields: [
      { id: 'code', label: 'Код', placeholder: 'FERM100' },
      { id: 'amount', label: 'Сумма (₽)', placeholder: '100', type: 'number' },
      { id: 'maxUses', label: 'Лимит (0 = ∞)', placeholder: '0', type: 'number', value: '0' },
    ],
    confirmText: '+ Создать',
    onConfirm: async (values) => {
      if (!values.code || !values.amount) { toast('Заполните поля', 'error'); return; }
      try {
        await api('/api/promocodes', { method: 'POST', body: JSON.stringify({ code: values.code, amount: Number(values.amount), maxUses: Number(values.maxUses) || 0 }) });
        toast('✓ Промокод создан', 'success');
        loadPromoList();
      } catch (e) {
        const errors = { already_exists: 'Такой уже есть', bad_code_format: 'Неверный формат' };
        const key = e.message.split(' — ')[0];
        toast(errors[key] || e.message, 'error');
      }
    }
  });
}

function deletePromo(code) {
  confirmModal({
    icon: '🗑',

      try {
        await api('/api/promocodes/' + encodeURIComponent(code), { method: 'DELETE' });
        toast('✓ Удалён', 'success');
        loadPromoList();
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

async function loadMonitorBlock(body) {
  body.innerHTML = '<div class="loading-state"><div class="spinner"></div> Проверка...</div>';
  const start = performance.now();
  let apiStatus = 'err', apiText = 'Недоступен', ping = '—';
  try {
    await api('/api/me');
    ping = Math.round(performance.now() - start) + ' ms';
    apiStatus = 'ok'; apiText = 'Работает';
  } catch { apiText = 'Ошибка'; }
  let presenceStatus = 'err', presenceText = 'Не подключён';
  try {
    const p = await api('/api/presence');
    if (p.ready) { presenceStatus = 'ok'; presenceText = `Активен · ${p.online + p.idle + p.dnd}/${p.total}`; }
  } catch {}
  body.innerHTML = `
    <div class="section-block">
      <div class="section-block-head">
        <div><div class="section-block-title"><span class="ico">💓</span> Мониторинг</div></div>
        <button class="btn-act ghost" onclick="loadMonitorBlock(document.getElementById('mgBody'))">↻ Обновить</button>
      </div>
      <div class="settings-grid">
        <div class="setting-card"><div class="setting-label">API</div><div class="setting-value ${apiStatus}">${apiStatus === 'ok' ? '✅' : '❌'} ${apiText}</div></div>
        <div class="setting-card"><div class="setting-label">Ping</div><div class="setting-value">${ping}</div></div>
        <div class="setting-card"><div class="setting-label">Presence</div><div class="setting-value ${presenceStatus}">${presenceStatus === 'ok' ? '✅' : '❌'} ${presenceText}</div></div>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
