<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Админ-панель</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
* { box-sizing: border-box; }
body > .auth-widget { display: none !important; }

.admin-wrap { min-height: 100vh; position: relative; z-index: 1; padding: 84px clamp(16px, 2.5vw, 56px) 60px; width: 100%; max-width: 1920px; margin: 0 auto; overflow: visible; }
.admin-top { position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 12px; z-index: 1000; }
.admin-user { display: flex; align-items: center; gap: 8px; position: relative; z-index: 200; }

.admin-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; position: relative; z-index: 50; }
.tab-block { display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; text-align: left; }
.tab-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--tab-color, var(--red)); box-shadow: 0 0 20px var(--tab-color, var(--red)); opacity: 0.5; transition: opacity 0.3s; }
.tab-block:hover { transform: translateY(-4px); border-color: var(--tab-color, var(--red)); }
.tab-block.active { border-color: var(--tab-color, var(--red)); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
.tab-block.active::before { opacity: 1; height: 4px; }
.tab-block-icon { width: 48px; height: 48px; border-radius: 13px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); display: flex; align-items: center; justify-content: center; color: var(--tab-color, var(--red)); flex-shrink: 0; }
.tab-block-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab-block-info { flex: 1; min-width: 0; }
.tab-block-title { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.4px; margin-bottom: 3px; }
.tab-block-desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
.tab-block-badge { padding: 4px 12px; background: rgba(225,6,0,0.15); border: 1px solid rgba(225,6,0,0.5); border-radius: 100px; font-size: 11px; color: var(--red); font-weight: 700; font-family: 'Unbounded', sans-serif; flex-shrink: 0; }

.admin-content { animation: fadeUp 0.4s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.section-block { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; margin-bottom: 16px; }
.section-block-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.section-block-title { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.section-block-sub { font-size: 12px; color: var(--text-dim); margin-top: 5px; }

.subtabs { display: inline-flex; gap: 4px; padding: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.subtab { padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 7px; }
.subtab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.subtab.active { color: #fff; background: linear-gradient(135deg, rgba(225,6,0,0.25), rgba(139,0,0,0.15)); border-color: rgba(225,6,0,0.5); }
.subtab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; padding: 2px 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-bright); border-radius: 100px; font-size: 10px; font-weight: 700; font-family: 'Unbounded', sans-serif; }
.subtab.active .subtab-count { background: rgba(225,6,0,0.25); border-color: rgba(225,6,0,0.6); color: #fff; }

.cards-list { display: flex; flex-direction: column; gap: 8px; }
.app-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; gap: 16px; align-items: flex-start; transition: all 0.3s; }
.app-card:hover { border-color: rgba(225,6,0,0.4); transform: translateX(4px); }
.app-avatar { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; object-fit: cover; }
.app-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.app-avatar-empty::after { content: '—'; opacity: 0.5; }
.app-body { flex: 1; min-width: 0; }
.app-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.app-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
.app-date { font-size: 11.5px; color: var(--text-dim); }
.app-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }
.app-row b { color: var(--text); }
.app-text { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-top: 6px; color: var(--text); }
.app-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.status-pill { display: inline-block; padding: 3px 11px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
.status-pill.pending  { background: rgba(251,191,36,0.15); color: #fbbf24; }
.status-pill.approved { background: rgba(74,222,128,0.15); color: #4ade80; }
.status-pill.rejected { background: rgba(239,68,68,0.15); color: #ef4444; }

.btn-act { padding: 8px 14px; border-radius: 9px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px; }
.btn-act:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-act.green { background: rgba(74,222,128,0.12); color: #4ade80; border-color: rgba(74,222,128,0.4); }
.btn-act.green:hover:not(:disabled) { background: rgba(74,222,128,0.25); }
.btn-act.red { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.4); }
.btn-act.red:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
.btn-act.blue { background: rgba(59,130,246,0.12); color: #60a5fa; border-color: rgba(59,130,246,0.4); }
.btn-act.blue:hover:not(:disabled) { background: rgba(59,130,246,0.25); }
.btn-act.ghost { background: rgba(255,255,255,0.04); color: var(--text); border-color: var(--border-bright); }
.btn-act.ghost:hover:not(:disabled) { border-color: var(--red); background: rgba(225,6,0,0.08); }
.btn-act.gold { background: rgba(251,191,36,0.12); color: #fbbf24; border-color: rgba(251,191,36,0.4); }
.btn-act.gold:hover:not(:disabled) { background: rgba(251,191,36,0.22); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 13px; }
.loading-state { display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 10px; color: var(--text-dim); font-size: 13px; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, rgba(255,255,255,0.04) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 14px; height: 90px; margin-bottom: 12px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.search-wrap { position: relative; margin-bottom: 16px; }
.search-input { width: 100%; padding: 12px 16px 12px 42px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; }
.search-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.search-wrap .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-dim); pointer-events: none; z-index: 1; }
.search-wrap .search-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat-tile { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
.stat-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--tile-color, var(--red)); box-shadow: 0 0 20px var(--tile-color, var(--red)); opacity: 0.7; }
.stat-tile-value { font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; color: #fff; margin-bottom: 5px; }
.stat-tile-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); font-weight: 700; }

.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.staff-tile { background: linear-gradient(145deg, var(--bg-card), rgba(14,14,14,0.5)); border: 1px solid var(--border); border-left: 4px solid var(--role-color, var(--red)); border-radius: 14px; padding: 16px 18px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: all 0.3s; }
.staff-tile:hover { transform: translateY(-4px); border-color: var(--role-color, var(--red)); }
.staff-avatar-wrap { position: relative; flex-shrink: 0; }
.staff-avatar { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; }
.staff-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.staff-avatar-empty::after { content: '—'; opacity: 0.5; }
.staff-presence { position: absolute; bottom: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--bg-card); }
.staff-presence.online  { background: #4ade80; }
.staff-presence.idle    { background: #fbbf24; }
.staff-presence.dnd     { background: #ef4444; }
.staff-presence.offline { background: #6b7280; }
.staff-info { flex: 1; min-width: 0; }
.staff-info h3 { font-family: 'Unbounded', sans-serif; font-size: 13.5px; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staff-role { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.setting-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.setting-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); margin-bottom: 7px; font-weight: 700; }
.setting-value { font-family: 'Unbounded', sans-serif; font-size: 12.5px; word-break: break-all; color: #fff; }
.setting-value.ok { color: #4ade80; }
.setting-value.err { color: var(--red); }

.role-simple-list { display: flex; flex-direction: column; border: 1px solid var(--border-bright); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.01); }
.role-simple-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--border); }
.role-simple-item:last-child { border-bottom: none; }
.role-simple-item:hover { background: rgba(225,6,0,0.06); }
.role-simple-name { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }

.chart-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.chart-title { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 16px; letter-spacing: -0.3px; }
.line-chart { width: 100%; height: 260px; display: block; }

.top-staff-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; cursor: pointer; transition: all 0.2s; border-bottom: 1px solid var(--border); }
.top-staff-row:last-child { border-bottom: none; }
.top-staff-row:hover { background: rgba(225,6,0,0.06); transform: translateX(4px); }
.top-staff-rank { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded'; font-weight: 900; font-size: 13px; flex-shrink: 0; }
.top-staff-rank.gold   { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; box-shadow: 0 0 20px rgba(251,191,36,0.5); }
.top-staff-rank.silver { background: linear-gradient(135deg, #d1d5db, #6b7280); color: #000; }
.top-staff-rank.bronze { background: linear-gradient(135deg, #d97706, #92400e); color: #fff; }
.top-staff-avatar { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; object-fit: cover; }
.top-staff-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.top-staff-avatar-empty::after { content: '—'; opacity: 0.5; font-size: 14px; }
.top-staff-name { flex: 1; font-weight: 600; color: #fff; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-staff-count { font-family: 'Unbounded'; color: var(--red); font-weight: 900; font-size: 14px; }

.balance-search-hero { text-align: center; padding: 30px 20px; background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 18px; margin-bottom: 16px; position: relative; overflow: hidden; }
.balance-search-hero::before { content: ''; position: absolute; top: -50%; left: 50%; transform: translateX(-50%); width: 240px; height: 240px; background: radial-gradient(circle, rgba(225,6,0,0.18), transparent 65%); filter: blur(40px); pointer-events: none; }
.balance-search-title { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; position: relative; z-index: 1; }
.balance-search-desc { font-size: 12.5px; color: var(--text-dim); margin-bottom: 20px; position: relative; z-index: 1; }
.balance-search-input-wrap { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; position: relative; z-index: 1; }
.balance-search-input { flex: 1; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 12px; color: #fff; font-family: 'Inter', monospace; font-size: 14px; outline: none; transition: all 0.25s; letter-spacing: 0.5px; }
.balance-search-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.balance-search-btn { padding: 14px 22px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border: none; border-radius: 12px; color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; transition: all 0.3s; white-space: nowrap; box-shadow: 0 6px 20px rgba(225,6,0,0.35); }
.balance-search-btn:hover:not(:disabled) { transform: translateY(-2px); }
.balance-search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.balance-search-hint { margin-top: 10px; font-size: 11px; color: var(--text-dim); position: relative; z-index: 1; }

.balance-result { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 16px; animation: fadeUp 0.35s; }
.balance-user-row { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.balance-user-avatar { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; border: 2px solid var(--border-bright); flex-shrink: 0; }
.balance-user-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
.balance-user-avatar-empty::after { content: '—'; font-size: 20px; opacity: 0.5; }
.balance-user-info { flex: 1; min-width: 0; }
.balance-user-name { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; word-break: break-word; }
.balance-user-steam { font-family: 'Inter', monospace; font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; word-break: break-all; text-decoration: none; }
.balance-user-current { text-align: right; flex-shrink: 0; }
.balance-user-current-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
.balance-user-current-value { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 900; color: #4ade80; letter-spacing: -0.5px; }

.balance-actions-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.balance-action-btn { padding: 12px 10px; border-radius: 11px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.balance-action-btn.green { background: rgba(74,222,128,0.12); color: #4ade80; border-color: rgba(74,222,128,0.4); }
.balance-action-btn.green:hover { background: rgba(74,222,128,0.25); }
.balance-action-btn.red { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.4); }
.balance-action-btn.red:hover { background: rgba(239,68,68,0.25); }
.balance-action-btn.blue { background: rgba(96,165,250,0.12); color: #60a5fa; border-color: rgba(96,165,250,0.4); }
.balance-action-btn.blue:hover { background: rgba(96,165,250,0.25); }

.balance-panel { display: none; margin-top: 12px; }
.balance-panel.visible { display: block; animation: fadeUp 0.25s; }
.balance-panel-input-row { display: flex; gap: 8px; align-items: stretch; }
.balance-panel-input { flex: 1; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 11px; color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; outline: none; min-width: 0; }
.balance-panel-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
.balance-panel-submit { padding: 14px 22px; border: none; border-radius: 11px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12.5px; cursor: pointer; color: #fff; white-space: nowrap; }
.balance-panel-submit.green { background: linear-gradient(135deg, #4ade80, #16a34a); }
.balance-panel-submit.red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.balance-panel-submit.blue { background: linear-gradient(135deg, #60a5fa, #2563eb); }

.balance-quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.balance-quick-btn { padding: 6px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); border-radius: 8px; color: var(--text-dim); font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px; cursor: pointer; }
.balance-quick-btn:hover { color: #fff; border-color: var(--red); background: rgba(225,6,0,0.08); }

.balance-result-empty { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.3); border-radius: 14px; padding: 24px; text-align: center; color: var(--red); font-size: 13px; }

/* Привилегии */
.priv-owned-list { display: flex; flex-direction: column; gap: 8px; }
.priv-owned-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-left: 3px solid var(--item-color, #4ade80); border-radius: 12px; padding: 12px 16px; }
.priv-owned-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.priv-owned-name { font-family: 'Unbounded', sans-serif; font-size: 13.5px; font-weight: 700; color: #fff; }
.priv-owned-meta { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-dim); }
.priv-owned-meta b { color: #fff; }
.priv-revoke-btn { padding: 6px 14px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); border-radius: 8px; color: #ef4444; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11.5px; cursor: pointer; transition: all 0.2s; }
.priv-revoke-btn:hover { background: rgba(239,68,68,0.25); border-color: rgba(239,68,68,0.7); }

.priv-grant-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.priv-grant-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-top: 3px solid var(--item-color, var(--red)); border-radius: 14px; padding: 14px 16px; transition: all 0.3s; cursor: pointer; }
.priv-grant-card:hover { border-color: var(--item-color, var(--red)); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }

.logs-row { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-left: 3px solid var(--log-color, #8a8a8a); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; transition: all 0.2s; }

/* Рулетка — редактор призов */
.roulette-editor-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto 40px;
  gap: 12px;
  align-items: end;
  padding: 12px 16px;

}

}
.roulette-editor-tier {

.roulette-tier-pill {

.roulette-editor-remove {

  border: 1px solid rgba(239,68,68,0.35);

  justify-content: center;

.roulette-editor-remove:hover {

}
.roulette-editor-remove svg {

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;

@media (max-width: 600px) {

<script>
const ROLE_COLOR_OVERRIDE = {

  'Главная администрация': '#5865f2',

};

let isAuthorized = false;
let currentTab = 'moderator';
let moderatorSub = 'apps';
let manageSub = 'staff';
let appsData = { pending: [], approved: [], rejected: [] };
let appsFilter = 'pending';
let staffData = { administrators: [], moderators: [] };
let staffFilter = 'administrators';

let ticketsFilter = 'open';
let currentTicketId = null;
let ticketPoll = null;
let lastMessageId = null;
let selectedMember = null;
let availableRoles = [];
let currentBalanceUser = null;
let selectedPrivilegeUser = null;
let privilegesCache = [];

/* Логи сайта */
let siteLogsFilter = { category: '', action: '', search: '', page: 1 };
let siteLogsMeta = { categories: [], actions: [] };
let siteLogsSearchTimeout = null;

/* Рулетка */
let roulettePrizesCache = [];

const CATEGORY_LABELS = {
  general: 'Общее', auth: 'Авторизация', profile: 'Профиль', shop: 'Магазин',
  moderation: 'Модерация', admin: 'Админ', roles: 'Роли', privileges: 'Привилегии',
  balance: 'Баланс', promo: 'Промокоды', referral: 'Рефералы', inventory: 'Инвентарь',
};

const ACTION_LABELS = {
  login: 'Вход', profile_update: 'Изменение профиля',
  promo_activate: 'Активация промокода', promo_create: 'Создание промокода', promo_delete: 'Удаление промокода',

  give_role: 'Выдача роли', privilege_grant: 'Выдача привилегии', privilege_revoke: 'Снятие привилегии',
  application_status: 'Статус заявки', application_delete: 'Удаление заявки',
  roulette_spin: 'Спин рулетки',
  roulette_config_update: 'Изменение конфига рулетки',
  roulette_config_reset: 'Сброс конфига рулетки',
};

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', () => {
  const di = document.getElementById('deniedIcon');
  if (di) di.innerHTML = window.ICONS.lock;
});

function toast(text, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const icons = {
    success: window.ICONS.checkCircle,
    error: window.ICONS.x,
    info: window.ICONS.info,
  };
  const cleanText = window.stripEmoji(text);
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span>${esc(cleanText)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('fade'); setTimeout(() => el.remove(), 300); }, 3000);
}

function closeModal() {
  document.getElementById('fdModal').classList.remove('visible');
  document.getElementById('fdModalBox').innerHTML = '';
}

function confirmModal({ title, desc, confirmText = 'OK', onConfirm }) {
  const box = document.getElementById('fdModalBox');
  box.innerHTML = `
    <h3>${esc(title)}</h3>
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <div class="fd-modal-actions">
      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm" id="fdConfirmBtn">${esc(confirmText)}</button>
    </div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  document.getElementById('fdConfirmBtn').onclick = async () => {
    const btn = document.getElementById('fdConfirmBtn');
    btn.disabled = true;
    try { await onConfirm(); } finally { closeModal(); }
  };
}

function radioModal({ title, desc, options = [], confirmText = 'Применить', onConfirm }) {
  const box = document.getElementById('fdModalBox');
  const optsHtml = options.map(o => `
    <label class="fd-radio" data-val="${esc(o.value)}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;cursor:pointer;margin-bottom:8px;">
      <input type="radio" name="fdRadio" value="${esc(o.value)}" style="accent-color:var(--red);">
      <span style="font-size:14px;color:var(--text);">${esc(o.label)}</span>
    </label>
  `).join('');
  box.innerHTML = `
    <h3>${esc(title)}</h3>
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <div>${optsHtml}</div>
    <div class="fd-modal-actions">
      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm" id="fdConfirmBtn" disabled>${esc(confirmText)}</button>
    </div>
  `;
  document.getElementById('fdModal').classList.add('visible');
  let selected = null;
  box.querySelectorAll('.fd-radio').forEach(label => {
    label.addEventListener('click', () => {
      box.querySelectorAll('.fd-radio').forEach(l => { l.style.borderColor = 'var(--border)'; l.style.background = 'rgba(255,255,255,0.03)'; });
      label.style.borderColor = 'var(--red)';
      label.style.background = 'rgba(225,6,0,0.08)';
      selected = label.querySelector('input').value;
      document.getElementById('fdConfirmBtn').disabled = false;
    });
  });
  document.getElementById('fdConfirmBtn').onclick = async () => {
    if (!selected) return;
    const btn = document.getElementById('fdConfirmBtn');
    btn.disabled = true;
    try { await onConfirm(selected); } finally { closeModal(); }
  };
}

function isOwner() { return !!(window.currentUser && window.currentUser.isOwner); }
function getAllUserRoles() {
  const u = window.currentUser;
  if (!u) return [];
  return [...(u.roles || []), ...(u.siteRoles || [])].map(r => (r || '').toLowerCase());
}
function isHeadAdminOrOwner() {
  const u = window.currentUser;
  if (!u) return false;
  if (u.isHeadAdmin || u.isOwner) return true;
  const roles = getAllUserRoles();
  return roles.includes('техническая поддержка') || roles.includes('главная администрация');
}
function canAccessManage() {
  const u = window.currentUser;
  if (!u) return false;
  if (u.isOwner || u.isHeadAdmin) return true;
  const roles = getAllUserRoles();
  return roles.some(r =>
    r === 'куратор' || r === 'следящий' || r === 'техническая поддержка' || r === 'главная администрация' || r === 'владелец'
  );
}
function isCuratorOrAbove() {
  const u = window.currentUser;
  if (!u) return false;
  if (u.isOwner || u.isHeadAdmin) return true;
  const roles = getAllUserRoles();
  return roles.some(r =>
    r === 'куратор' || r === 'следящий' || r === 'техническая поддержка' || r === 'главная администрация' || r === 'владелец'
  );
}
function canApprove() { return isCuratorOrAbove(); }

window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  isAuthorized = window.canAccessAdmin ? window.canAccessAdmin(user) : false;
  if (!isAuthorized) {
    document.getElementById('deniedBlock').style.display = 'flex';
    document.getElementById('adminWrap').style.display = 'none';
    return;
  }
  document.getElementById('deniedBlock').style.display = 'none';
  document.getElementById('adminWrap').style.display = 'block';
  const avatar = document.getElementById('headerAvatar');
  if (avatar) {
    if (user.avatar) { avatar.src = user.avatar; avatar.style.display = ''; }
    else { avatar.style.display = 'none'; }
  }
  const btn = document.getElementById('profileAvatarBtn');
  if (btn) btn.style.display = '';
  const menuBox = document.getElementById('profileMenuContent');
  if (menuBox) menuBox.innerHTML = renderProfileMenu('admin');
  switchTab('moderator');
});

setTimeout(() => {
  if (!isAuthorized && document.getElementById('adminWrap').style.display === 'none') {
    document.getElementById('deniedBlock').style.display = 'flex';
  }
}, 2000);

function switchTab(tab) {
  if (tab === 'manage' && !canAccessManage()) {
    toast('Раздел доступен кураторам и выше.', 'error');
    return;
  }
  currentTab = tab;
  document.querySelectorAll('.tab-block').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'moderator') { renderModerator(); loadModeratorCounts(); }
  else renderManage();
}

async function loadModeratorCounts() {
  try {
    const apps = await api('/api/applications').catch(() => ({ applications: [] }));
    const pending = (apps.applications || []).filter(a => a.status === 'pending').length;
    const tickets = await api('/api/tickets').catch(() => ({ open: [] }));
    const total = pending + (tickets.open || []).length;
    const badge = document.getElementById('modBadge');
    if (badge) { badge.textContent = total; badge.style.display = total > 0 ? 'inline-block' : 'none'; }
  } catch {}
}

        <div class="section-block-head">

function setAppsFilter(f) {
  appsFilter = f;
  document.querySelectorAll('.subtabs .subtab').forEach(b => {
    if (b.textContent.includes('Ожидание')) b.classList.toggle('active', f === 'pending');
    else if (b.textContent.includes('Одобрено')) b.classList.toggle('active', f === 'approved');
    else if (b.textContent.includes('Отклонено')) b.classList.toggle('active', f === 'rejected');
  });
  renderAppsList();
}

function renderAppsList() {
  const el = document.getElementById('appsList');
  if (!el) return;
  const search = (document.getElementById('appsSearch')?.value || '').toLowerCase().trim();
  let list = appsData[appsFilter] || [];
  if (search) list = list.filter(a => (a.steamName || '').toLowerCase().includes(search) || (a.authorName || '').toLowerCase().includes(search) || (a.steam || '').toLowerCase().includes(search));
  if (!list.length) {
    const labels = { pending: 'Заявок в ожидании нет.', approved: 'Одобренных заявок нет.', rejected: 'Отклонённых заявок нет.' };
    el.innerHTML = `<div class="empty-state">${labels[appsFilter]}</div>`;
    return;
  }
  el.innerHTML = list.map(a => {
    const date = new Date(a.date).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const statusLabel = a.status === 'approved' ? 'Одобрено' : a.status === 'rejected' ? 'Отклонено' : 'Ожидание';
    const borderColor = a.status === 'approved' ? '#4ade80' : a.status === 'rejected' ? '#ef4444' : '#fbbf24';
    let actions = '';
    if (a.status === 'pending' && canApprove()) {
      actions = `<div class="app-actions"><button class="btn-act green" onclick="quickStatus('${a.id}','approve')">Одобрить</button><button class="btn-act red" onclick="quickStatus('${a.id}','reject')">Отклонить</button></div>`;
    } else if (a.status !== 'pending' && canApprove()) {
      actions = `<div class="app-actions"><button class="btn-act blue" onclick="openChange('${a.id}')">Изменить</button><button class="btn-act red" onclick="openDelete('${a.id}')">Удалить</button></div>`;
    }
    return `<div class="app-card compact" style="border-left:3px solid ${borderColor};">
      <div class="app-body">
        <div class="app-row"><b>Telegram:</b> ${esc(a.telegram || '—')}</div>
        <div class="app-row"><b>Discord:</b> ${esc(a.discordNick || a.discord || '—')}</div>
        <div class="app-row"><b>Возраст:</b> ${esc(a.age || '—')}</div>
        <div class="app-row"><b>Причина подачи заявки:</b> ${esc(a.motivation || '—')}</div>
        <div class="app-date" style="margin-top:8px;">Дата подачи: ${date}</div>
        <div style="margin-top:8px;"><span class="status-pill ${a.status}">${statusLabel}</span></div>
        ${actions}
      </div>
    </div>`;
  }).join('');
}

function quickStatus(id, action) {
  confirmModal({
    title: action === 'approve' ? 'Одобрить заявку?' : 'Отклонить заявку?',
    desc: 'Действие изменит статус заявки в Discord.',
    confirmText: action === 'approve' ? 'Одобрить' : 'Отклонить',
    onConfirm: async () => {
      try {
        await api(`/api/applications/${id}/${action}`, { method: 'POST' });
        toast(action === 'approve' ? 'Заявка одобрена.' : 'Заявка отклонена.', 'success');
        loadAppsBlock(document.getElementById('modBody'));
        loadModeratorCounts();
      } catch (e) { toast(e.message, 'error'); }
    }
  });
}

function openChange(id) {
  radioModal({
    title: 'Изменить статус',
    desc: 'Выберите новый статус заявки',
    options: [
      { value: 'approved', label: 'Одобрить' },
      { value: 'rejected', label: 'Отклонить' },
      { value: 'pending', label: 'Вернуть на рассмотрение' },

    onConfirm: async (newStatus) => {
      try {
        await api(`/api/applications/${id}/change`, { method: 'POST', body: JSON.stringify({ newStatus }) });

function openDelete(id) {

    desc: 'Заявка будет навсегда удалена из Discord.',
    confirmText: 'Удалить',

        loadAppsBlock(document.getElementById('modBody'));

async function openTicket(id, name) {
  currentTicketId = id;
  lastMessageId = null;
  document.getElementById('ticketsMain').style.display = 'none';
  document.getElementById('ticketDetail').style.display = 'block';
  document.getElementById('ticketHeader').innerHTML = `<h3 style="font-family:'Unbounded';font-size:16px;margin-bottom:10px;color:#fff;">#${esc(name)}</h3>`;
  document.getElementById('ticketChat').innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  await loadTicketMessages();
  if (ticketPoll) clearInterval(ticketPoll);
  ticketPoll = setInterval(loadTicketMessages, 15000);
}
function closeTicket() {
  if (ticketPoll) { clearInterval(ticketPoll); ticketPoll = null; }
  currentTicketId = null;
  document.getElementById('ticketDetail').style.display = 'none';
  document.getElementById('ticketsMain').style.display = 'block';
}
async function loadTicketMessages() {
  if (!currentTicketId) return;
  try {
    const data = await api(`/api/tickets/${currentTicketId}/messages`);
    const messages = data.messages || [];
    const lastId = messages[messages.length - 1]?.id;
    if (lastId && lastId === lastMessageId) return;
    lastMessageId = lastId;

    const el = document.getElementById('ticketChat');
    if (!messages.length) { el.innerHTML = '<div class="empty-state">Сообщений нет.</div>'; return; }
    el.innerHTML = messages.map(m => {
      const time = new Date(m.date).toLocaleString('ru-RU');
      const body = m.content || m.embedDescription || '';
      const atts = (m.attachments || []).map(a => {
        if ((a.type || '').startsWith('image/')) return `<img src="${a.url}" style="max-width:280px;border-radius:10px;margin-top:8px;" alt="">`;
        return `<a href="${a.url}" target="_blank" class="btn-act ghost" style="margin-top:8px;">Вложение</a>`;
      }).join('');
      const avatarHTML = m.avatar
        ? `<img src="${m.avatar}" style="width:38px;height:38px;border-radius:10px;flex-shrink:0;object-fit:cover;" alt="">`
        : `<div style="width:38px;height:38px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,0.03);border:1px solid var(--border-bright);"></div>`;
      return `<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">
        ${avatarHTML}
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px;">
            <span style="font-family:'Unbounded';font-size:12px;color:#fff;font-weight:700;">${esc(m.authorName)}${m.authorBot ? ' (bot)' : ''}</span>
            <span style="font-size:10px;color:var(--text-dim);">${time}</span>
          </div>
          ${body ? `<div style="font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;">${esc(body)}</div>` : ''}
          ${atts}
        </div>
      </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  } catch (e) { document.getElementById('ticketChat').innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`; }
}

}

async function loadSiteLogsList() {
  const list = document.getElementById('siteLogsList');
  const pag = document.getElementById('siteLogsPagination');
  if (!list) return;
  list.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  if (pag) pag.innerHTML = '';

  const params = new URLSearchParams();
  if (siteLogsFilter.category) params.set('category', siteLogsFilter.category);
  if (siteLogsFilter.action) params.set('action', siteLogsFilter.action);
  if (siteLogsFilter.search) params.set('search', siteLogsFilter.search);
  params.set('page', siteLogsFilter.page);
  params.set('limit', '50');

  try {
    const data = await api('/api/admin/logs?' + params.toString());
    const logs = data.logs || [];

    if (!logs.length) {
      list.innerHTML = '<div class="empty-state">Записей нет</div>';
      return;
    }

    list.innerHTML = logs.map(l => renderSiteLogRow(l)).join('');

    if (pag && data.pages > 1) {
      const total = data.pages;
      const cur = data.page;
      let html = '';
      html += `<button class="logs-page-btn" ${cur <= 1 ? 'disabled' : ''} onclick="setSiteLogsPage(${cur - 1})">←</button>`;
      const start = Math.max(1, cur - 2);
      const end = Math.min(total, cur + 2);
      for (let i = start; i <= end; i++) {
        html += `<button class="logs-page-btn ${i === cur ? 'active' : ''}" onclick="setSiteLogsPage(${i})">${i}</button>`;
      }
      html += `<button class="logs-page-btn" ${cur >= total ? 'disabled' : ''} onclick="setSiteLogsPage(${cur + 1})">→</button>`;
      html += `<span class="logs-page-info">Всего: ${data.total}</span>`;
      pag.innerHTML = html;
    }
  } catch (e) {
    list.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

function setSiteLogsPage(p) {
  siteLogsFilter.page = p;
  loadSiteLogsList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSiteLogRow(l) {
  const date = new Date(l.createdAt).toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });

  const categoryLabel = CATEGORY_LABELS[l.category] || l.category;
  const actionLabel = ACTION_LABELS[l.action] || l.action;

  const CAT_COLORS = {
    auth: '#60a5fa', profile: '#a855f7', shop: '#fbbf24',
    moderation: '#4ade80', admin: '#ef4444', roles: '#00a8fc',
    privileges: '#fbbf24', balance: '#4ade80', promo: '#eb459e',
    referral: '#23a55a', inventory: '#8b5cf6', general: '#8a8a8a',
  };
  const color = CAT_COLORS[l.category] || '#8a8a8a';

  const actorHTML = l.actorName
    ? `<span class="logs-actor">${esc(l.actorName)}${l.actorIsAdmin ? ' <span class="logs-admin-tag">ADMIN</span>' : ''}</span>`
    : '<span class="logs-actor logs-actor-empty">система</span>';

  const targetHTML = l.targetName || l.targetSteamId
    ? `<span class="logs-arrow">→</span> <span class="logs-target">${esc(l.targetName || l.targetSteamId)}</span>`
    : '';

  const metaParts = [];
  const m = l.meta || {};
  if (m.privilegeName) metaParts.push(m.privilegeName);
  if (m.durationLabel) metaParts.push(m.durationLabel);
  if (m.roleName) metaParts.push(m.roleName);
  if (m.itemName) metaParts.push(m.itemName);
  if (m.tariffLabel) metaParts.push(m.tariffLabel);
  if (m.price != null) metaParts.push(`${m.price} ₽`);
  if (m.amount != null && !m.price) metaParts.push(`${m.amount} ₽`);
  if (m.mode) {
    const modeLabel = m.mode === 'add' ? 'выдал' : m.mode === 'subtract' ? 'снял' : 'установил';
    metaParts.push(modeLabel);
  }
  if (m.oldBalance != null && m.newBalance != null) metaParts.push(`${m.oldBalance} → ${m.newBalance} ₽`);
  if (m.code) metaParts.push(`\`${m.code}\``);
  if (m.oldStatus && m.newStatus) metaParts.push(`${m.oldStatus} → ${m.newStatus}`);
  if (m.fields && m.fields.length) metaParts.push(m.fields.join(', '));
  if (m.appliedToDiscord === true) metaParts.push('Discord: применено');
  if (m.appliedToDiscord === false) metaParts.push('Discord: ожидает');
  if (m.roleApplied === true) metaParts.push('роль выдана');
  if (m.roleApplied === false) metaParts.push('роль ожидает');
  if (m.roleRemoved === true) metaParts.push('роль снята');
  if (m.tier) metaParts.push(`тир: ${m.tier}`);
  if (m.isWin != null) metaParts.push(m.isWin ? 'выигрыш' : 'пусто');
  if (m.type) metaParts.push(`тип: ${m.type}`);
  if (m.paid != null && m.paid > 0) metaParts.push(`оплата ${m.paid} ₽`);
  if (m.count != null) metaParts.push(`позиций: ${m.count}`);

  const metaHTML = metaParts.length
    ? `<div class="logs-meta">${metaParts.map(p => `<span class="logs-meta-item">${esc(p)}</span>`).join('')}</div>`
    : '';

  const ipHTML = l.ip ? `<span class="logs-ip" title="IP адрес">${esc(l.ip)}</span>` : '';

  return `
    <div class="logs-row" style="--log-color:${color};">
      <div class="logs-head">
        <span class="logs-category" style="background:${color}22;border:1px solid ${color}66;color:${color};">
          ${esc(categoryLabel)}
        </span>
        <span class="logs-action">${esc(actionLabel)}</span>
        <span class="logs-date">${date}</span>
      </div>
      <div class="logs-body">
        ${actorHTML}${targetHTML}
      </div>
      ${metaHTML}
      ${ipHTML ? `<div class="logs-footer">${ipHTML}</div>` : ''}
    </div>
  `;
}

async function loadAnalyticsBlock(body) {
  body.innerHTML = '<div class="skeleton"></div>';
  try {
    const data = await api('/api/analytics-data');
    const { days, topStaff, stats } = data;
    const maxApps = Math.max(...days.map(d => d.apps), 1);
    const totalApps = days.reduce((s, d) => s + d.apps, 0);
    const totalActions = days.reduce((s, d) => s + (d.actions || 0), 0);

    const chartW = 900, chartH = 260, padX = 40, padY = 40;
    const stepX = (chartW - padX * 2) / (days.length - 1);
    const points = days.map((d, i) => {
      const x = padX + i * stepX;
      const y = chartH - padY - (d.apps / maxApps) * (chartH - padY * 2);
      return { x, y, val: d.apps, label: d.label };
    });
    const linePath = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
    const areaPath = `${linePath} L ${points[points.length-1].x} ${chartH - padY} L ${points[0].x} ${chartH - padY} Z`;

    const top5 = topStaff.slice(0, 5);

    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head">
          <div>
            <div class="section-block-title">Статистика проекта</div>
            <div class="section-block-sub">Активность за последние 7 дней</div>
          </div>
        </div>

        <div class="stats-grid" style="margin-bottom:20px;">
          <div class="stat-tile" style="--tile-color:#fbbf24;"><div class="stat-tile-value">${stats.pending}</div><div class="stat-tile-label">Ожидание</div></div>
          <div class="stat-tile" style="--tile-color:#4ade80;"><div class="stat-tile-value">${stats.approved}</div><div class="stat-tile-label">Одобрено</div></div>
          <div class="stat-tile" style="--tile-color:#ef4444;"><div class="stat-tile-value">${stats.rejected}</div><div class="stat-tile-label">Отклонено</div></div>
          <div class="stat-tile" style="--tile-color:#60a5fa;"><div class="stat-tile-value">${totalApps}</div><div class="stat-tile-label">Заявок за 7 дней</div></div>
          <div class="stat-tile" style="--tile-color:#a855f7;"><div class="stat-tile-value">${totalActions}</div><div class="stat-tile-label">Действий за 7 дней</div></div>
        </div>

        <div class="chart-card" style="margin-bottom:16px;">
          <div class="chart-title">Динамика заявок за неделю</div>
          <svg viewBox="0 0 ${chartW} ${chartH}" class="line-chart" preserveAspectRatio="none">
            <defs>
              <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e10600" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#e10600" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ff1e14"/>
                <stop offset="100%" stop-color="#8b0000"/>
              </linearGradient>
            </defs>
            ${[0,1,2,3,4].map(i => {
              const y = padY + i * ((chartH - padY*2) / 4);
              return `<line x1="${padX}" y1="${y}" x2="${chartW - padX}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
            }).join('')}
            <path d="${areaPath}" fill="url(#areaGrad)"/>
            <path d="${linePath}" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            ${points.map((p) => `
              <circle cx="${p.x}" cy="${p.y}" r="5" fill="#0e0e0e" stroke="#e10600" stroke-width="2.5"/>
              <text x="${p.x}" y="${p.y - 14}" text-anchor="middle" fill="#fff" font-family="Unbounded" font-size="12" font-weight="700">${p.val}</text>
              <text x="${p.x}" y="${chartH - 10}" text-anchor="middle" fill="#8a8a8a" font-family="Inter" font-size="11">${p.label}</text>
            `).join('')}
          </svg>
        </div>

        <div class="chart-card">
          <div class="chart-title">Топ-5 самых активных модераторов</div>
          ${top5.length ? top5.map((s, i) => {
            const avatarHTML = s.avatar
              ? `<img src="${s.avatar}" class="top-staff-avatar" alt="">`
              : `<div class="top-staff-avatar top-staff-avatar-empty"></div>`;
            return `
            <div class="top-staff-row" onclick="window.open('/profile/${s.steamId || s.id}', '_blank')">
              <div class="top-staff-rank ${i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : ''}">${i+1}</div>
              ${avatarHTML}
              <div class="top-staff-name">${esc(s.name)}</div>
              <div class="top-staff-count">${s.count} ${s.count === 1 ? 'действие' : s.count < 5 ? 'действия' : 'действий'}</div>
            </div>`;
          }).join('') : '<div class="empty-state">Нет данных</div>'}
        </div>
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

async function findBalanceUser() {
  const steamId = document.getElementById('balanceSteamInput').value.trim();

  const result = document.getElementById('balanceResult');
  result.innerHTML = '<div class="loading-state"><div class="spinner"></div> Поиск пользователя...</div>';
  try {
    const data = await api('/api/admin/balance/find?steamId=' + steamId);
    currentBalanceUser = data.user;
    renderBalanceUser(data.user);
    btn.disabled = false;
    btn.textContent = 'Найти';

    const errors = { bad_steam_id: 'Неверный Steam ID', not_found: 'Пользователь не найден', no_db: 'Ошибка базы данных' };
    const key = e.message.split(' — ')[0];
    result.innerHTML = `<div class="balance-result-empty">${esc(errors[key] || e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Найти';
  }
}

window.toggleBalancePanel = function(mode) {
  document.querySelectorAll('.balance-panel').forEach(p => p.classList.remove('visible'));
  const panel = document.getElementById('panel-' + mode);
  if (panel) {
    panel.classList.add('visible');
    const input = panel.querySelector('input');
    if (input) setTimeout(() => input.focus(), 100);
  }
};

window.setQuick = function(mode, value) {
  const input = document.getElementById('amount-' + mode);
  if (input) input.value = value;
};

window.submitBalance = async function(mode) {
  if (!currentBalanceUser) return;
  const input = document.getElementById('amount-' + mode);
  const amount = Number(input?.value);
  if (!Number.isFinite(amount) || (mode !== 'set' && amount <= 0)) { toast('Введите корректную сумму', 'error'); return; }
  const labels = { add: 'выдать', subtract: 'снять', set: 'установить' };
  confirmModal({
    title: `${mode === 'add' ? 'Выдать' : mode === 'subtract' ? 'Снять' : 'Установить'} ${amount}₽?`,
    desc: `Пользователь: ${currentBalanceUser.username}\nSteam ID: ${currentBalanceUser.steamId}`,
    confirmText: `Да, ${labels[mode]}`,
    onConfirm: async () => {
      try {
        const r = await api('/api/admin/balance/change', { method: 'POST', body: JSON.stringify({ steamId: currentBalanceUser.steamId, mode, amount }) });
        toast(`${currentBalanceUser.username}: ${r.oldBalance}₽ → ${r.newBalance}₽`, 'success');

async function findPrivilegeUser() {
  const steamId = document.getElementById('privSteamSearch').value.trim();
  if (!/^\d{17}$/.test(steamId)) { toast('Введите корректный Steam ID (17 цифр)', 'error'); return; }
  const btn = document.getElementById('privFindBtn');
  btn.disabled = true;
  btn.textContent = 'Поиск...';
  const area = document.getElementById('privUserArea');
  area.innerHTML = '<div class="loading-state"><div class="spinner"></div> Поиск пользователя...</div>';
  try {
    const [userData, privList] = await Promise.all([
      api('/api/admin/privileges/find?steamId=' + steamId),
      api('/api/admin/privileges/list'),
    ]);
    privilegesCache = privList.privileges || [];
    selectedPrivilegeUser = userData.user;
    renderPrivilegeUser(userData.user, privilegesCache);
  } catch (e) {
    const errors = { bad_steam_id: 'Неверный Steam ID', not_found: 'Пользователь не найден', no_db: 'Ошибка базы данных', forbidden: 'Нет прав' };
    const key = e.message.split(' — ')[0];
    area.innerHTML = `<div class="balance-result-empty">${esc(errors[key] || e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Найти пользователя';
  }
}

function renderPrivilegeUser(user, privileges) {
  const area = document.getElementById('privUserArea');
  const avatarHTML = user.avatar
    ? `<img class="balance-user-avatar" src="${esc(user.avatar)}" alt="">`
    : `<div class="balance-user-avatar balance-user-avatar-empty"></div>`;

  const ownedIds = new Set((user.privileges || []).map(p => p.itemId));

  const ownedHTML = (user.privileges || []).length
    ? user.privileges.map(p => {
        const priv = privileges.find(x => x.id === p.itemId);
        const color = priv?.color || '#4ade80';
        const duration = p.forever
          ? 'Навсегда'
          : p.expiresAt
            ? `до ${new Date(p.expiresAt).toLocaleDateString('ru-RU')}`
            : '—';
        return `
          <div class="priv-owned-card" style="--item-color:${color};">
            <div class="priv-owned-head">
              <span class="priv-owned-name">${esc(p.itemName)}</span>
              <button class="priv-revoke-btn" onclick="revokePrivilege('${esc(p.itemId)}', '${esc(p.itemName)}')">Снять</button>
            </div>
            <div class="priv-owned-meta">
              <span>Срок: <b>${duration}</b></span>
            </div>
          </div>
        `;
      }).join('')
    : '<div class="empty-state" style="padding:20px;">У пользователя нет активных привилегий</div>';

  const grantHTML = privileges.length
    ? privileges.map(p => {
        const owned = ownedIds.has(p.id);
        return `
          <div class="priv-grant-card" style="--item-color:${p.color};" onclick="openDurationPicker('${p.id}', '${esc(p.name)}', ${owned ? 'true' : 'false'})">
            <div class="priv-grant-head">
              <span class="priv-grant-name" style="color:${p.color};">${esc(p.name)}</span>
              ${owned ? '<span class="priv-grant-owned">Активна</span>' : ''}
            </div>
            <div class="priv-grant-desc">${esc(p.description || '')}</div>
            <div class="priv-grant-action">Выдать →</div>
          </div>
        `;
      }).join('')
    : '<div class="empty-state">Нет доступных привилегий</div>';

  area.innerHTML = `
    <div class="balance-result">
      <div class="balance-user-row">
        ${avatarHTML}
        <div class="balance-user-info">
          <div class="balance-user-name">${esc(user.username)}</div>
          <a class="balance-user-steam" href="https://steamcommunity.com/profiles/${esc(user.steamId)}" target="_blank" rel="noopener">${esc(user.steamId)}</a>
          ${user.discordId
            ? `<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">Discord: ${esc(user.discordId)}</div>`
            : '<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">Discord не привязан</div>'}
        </div>
      </div>

      <div class="section-block-title" style="font-size:14px;margin-bottom:12px;">Активные привилегии</div>
      <div class="priv-owned-list">${ownedHTML}</div>

      <div class="section-block-title" style="font-size:14px;margin:20px 0 12px;">Выдать привилегию</div>
      <div class="priv-grant-list">${grantHTML}</div>
    </div>
  `;
}

window.openDurationPicker = function (privilegeId, privilegeName, isAlreadyOwned) {
  if (!selectedPrivilegeUser) return;

  const presets = [
    { id: 'd1',  label: '1 день',    minutes: 60 * 24 },
    { id: 'd7',  label: '7 дней',    minutes: 60 * 24 * 7 },
    { id: 'd30', label: '30 дней',   minutes: 60 * 24 * 30 },
    { id: 'd90', label: '90 дней',   minutes: 60 * 24 * 90 },
  ];

  const box = document.getElementById('fdModalBox');
  box.innerHTML = `
    <h3>Выдать «${esc(privilegeName)}»</h3>
    <p style="margin-bottom:16px;">Пользователь: <b style="color:#fff;">${esc(selectedPrivilegeUser.username)}</b>${isAlreadyOwned ? '<br><span style="color:#fbbf24;">У пользователя уже есть эта привилегия — срок продлится.</span>' : ''}</p>

    <div class="fd-modal-label">Выберите срок</div>
    <div class="duration-preset-row">
      ${presets.map(p => `
        <button class="duration-preset-btn" data-minutes="${p.minutes}">${esc(p.label)}</button>
      `).join('')}
    </div>

    <div class="duration-forever-row">
      <button class="duration-forever-btn" data-forever="1">Навсегда</button>
    </div>

    <div class="fd-modal-label" style="margin-top:18px;">Или свой срок (в минутах)</div>
    <input type="number" min="1" step="1" class="fd-modal-input" id="fdCustomMinutes" placeholder="Например, 1440 (= 1 день)" autocomplete="off">
    <div id="fdCustomHint" style="font-size:11.5px;color:var(--text-dim);margin-top:-6px;margin-bottom:10px;">
      Будет выдано: <b style="color:#fff;">—</b>
    </div>

    <div class="fd-modal-actions">
      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm" id="fdGrantConfirmBtn" disabled>Выдать</button>
    </div>
  `;

  document.getElementById('fdModal').classList.add('visible');

  let selectedMinutes = null;
  const customInput = document.getElementById('fdCustomMinutes');
  const customHint = document.getElementById('fdCustomHint');
  const confirmBtn = document.getElementById('fdGrantConfirmBtn');

  const clearPresetSelection = () => {
    box.querySelectorAll('.duration-preset-btn, .duration-forever-btn').forEach(b => b.classList.remove('selected'));
  };

  const updateConfirmState = () => {
    if (selectedMinutes === 'forever') { confirmBtn.disabled = false; return; }
    if (typeof selectedMinutes === 'number' && selectedMinutes > 0) { confirmBtn.disabled = false; return; }
    confirmBtn.disabled = true;
  };

  const formatMinutes = (mins) => {
    if (!mins || mins <= 0) return '0 мин';
    const total = Math.round(mins);
    const days = Math.floor(total / (60 * 24));
    const hours = Math.floor((total % (60 * 24)) / 60);
    const m = total % 60;
    const parts = [];
    if (days > 0) parts.push(`${days} д`);
    if (hours > 0) parts.push(`${hours} ч`);
    if (m > 0 && days === 0) parts.push(`${m} мин`);
    return parts.join(' ') || '0 мин';
  };

  box.querySelectorAll('.duration-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      clearPresetSelection();
      btn.classList.add('selected');
      selectedMinutes = Number(btn.dataset.minutes);
      customInput.value = '';
      customHint.innerHTML = `Будет выдано: <b style="color:#fff;">${formatMinutes(selectedMinutes)}</b>`;
      updateConfirmState();
    });
  });

  box.querySelectorAll('.duration-forever-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      clearPresetSelection();
      btn.classList.add('selected');
      selectedMinutes = 'forever';
      customInput.value = '';
      customHint.innerHTML = `Будет выдано: <b style="color:#fff;">Навсегда</b>`;
      updateConfirmState();
    });
  });

  customInput.addEventListener('input', () => {
    const v = customInput.value.replace(/\D/g, '').slice(0, 8);
    if (customInput.value !== v) customInput.value = v;
    const num = Number(v);
    if (num > 0) {
      clearPresetSelection();
      selectedMinutes = num;
      customHint.innerHTML = `Будет выдано: <b style="color:#fff;">${formatMinutes(num)}</b>`;
    } else {
      selectedMinutes = null;
      customHint.innerHTML = `Будет выдано: <b style="color:#fff;">—</b>`;
    }
    updateConfirmState();
  });

  confirmBtn.onclick = async () => {
    if (selectedMinutes === null) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Выдача...';
    const durationMinutes = selectedMinutes === 'forever' ? 0 : selectedMinutes;
    try {
      const r = await api('/api/admin/privileges/grant', {
        method: 'POST',
        body: JSON.stringify({
          steamId: selectedPrivilegeUser.steamId,
          privilegeId,
          durationMinutes,
        }),
      });
      toast(`«${privilegeName}» (${r.durationLabel}) выдана`, 'success');
      if (!r.roleApplied) {
        setTimeout(() => toast('В Discord применится после привязки', 'info'), 1200);
      }
      closeModal();
      findPrivilegeUser();
    } catch (e) {
      const errors = {
        bad_steam_id: 'Неверный Steam ID',
        privilege_not_found: 'Привилегия не найдена',
        bad_duration: 'Некорректный срок',
        no_db: 'Ошибка базы данных',
        forbidden: 'Нет прав',
      };
      const key = e.message.split(' — ')[0];
      toast(errors[key] || e.message, 'error');
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Выдать';
    }
  };
};

async function revokePrivilege(privilegeId, privilegeName) {
  if (!selectedPrivilegeUser) return;
  confirmModal({
    title: `Снять «${privilegeName}»?`,
    desc: `Пользователь: ${selectedPrivilegeUser.username}\nРоль также снимется в Discord.`,
    confirmText: 'Снять',
    onConfirm: async () => {
      try {
        const r = await api('/api/admin/privileges/revoke', {
          method: 'POST',
          body: JSON.stringify({ steamId: selectedPrivilegeUser.steamId, privilegeId }),
        });
        toast(`«${privilegeName}» снята`, 'success');
        if (!r.roleRemoved) {
          setTimeout(() => toast('Роль не была найдена в Discord', 'info'), 1200);
        }
        findPrivilegeUser();
      } catch (e) {
        const errors = {
          privilege_not_owned: 'У пользователя нет этой привилегии',
          bad_steam_id: 'Неверный Steam ID',
          no_db: 'Ошибка базы данных',
          forbidden: 'Нет прав',
        };
        const key = e.message.split(' — ')[0];
        toast(errors[key] || e.message, 'error');
      }
    },
  });
}

let searchTimeout = null;
async function searchSteamUsers() {
  const q = document.getElementById('steamSearch').value.trim();
  const list = document.getElementById('steamResults');
  if (q.length < 3) { list.innerHTML = '<div class="empty-state">Минимум 3 символа</div>'; return; }
  if (searchTimeout) clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    list.innerHTML = '<div class="loading-state"><div class="spinner"></div> Поиск...</div>';
    try {
      const data = await api('/api/steam-search?q=' + encodeURIComponent(q));
      const users = data.users || [];
      if (!users.length) { list.innerHTML = '<div class="empty-state">Никого не найдено</div>'; return; }
      list.innerHTML = users.map(u => {
        const roleLabel = u.currentRole ? `<span style="background:rgba(74,222,128,0.15);color:#4ade80;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;">${esc(u.currentRole)}</span>` : '';
        const avatarHTML = u.avatar
          ? `<img class="app-avatar" src="${u.avatar}" alt="">`
          : `<div class="app-avatar app-avatar-empty"></div>`;
        return `<div class="app-card compact" style="cursor:pointer;" onclick="pickSteamUser('${u.steamId}', '${(u.personaName || '').replace(/'/g, "\\'")}', '${u.discordId || ''}')">
          ${avatarHTML}
          <div class="app-body">
            <div class="app-head"><span class="app-name">${esc(u.personaName)}</span> ${roleLabel}</div>
            <div class="app-row"><span>Steam: <b>${esc(u.steamId)}</b></span></div>
          </div>
        </div>`;
      }).join('');
    } catch (e) { list.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
  }, 400);
}

async function pickSteamUser(steamId, name, discordId) {
  selectedMember = { steamId, name, discordId };
  document.getElementById('selectedUserName').textContent = name;
  document.getElementById('rolePickArea').style.display = 'block';
  const roleList = document.getElementById('rolePickList');
  roleList.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  try {
    const rolesData = await api('/api/roles-list');
    availableRoles = rolesData.roles || [];
    if (!availableRoles.length) { roleList.innerHTML = '<div class="empty-state">Нет ролей</div>'; return; }
    roleList.innerHTML = `<div class="role-simple-list">
      ${availableRoles.map(r => `<div class="role-simple-item" onclick="giveRole('${r.id}','${r.name.replace(/'/g, "\\'")}')"><div class="role-simple-name">${esc(r.name)}</div></div>`).join('')}
    </div>`;
  } catch (e) { roleList.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
}

function giveRole(roleId, roleName) {
  if (!selectedMember) return;
  const warn = selectedMember.discordId
    ? 'Роль будет выдана на сайте и сразу в Discord.'
    : 'Роль будет выдана на сайте. В Discord она применится автоматически после привязки аккаунта.';
  confirmModal({
    title: `Выдать роль "${roleName}"?`,
    desc: `Пользователь: ${selectedMember.name}. ${warn}`,
    confirmText: 'Выдать',
    onConfirm: async () => {
      try {
        const result = await api('/api/give-role', { method: 'POST', body: JSON.stringify({ steamId: selectedMember.steamId, discordId: selectedMember.discordId, roleId }) });
        toast(`Роль "${roleName}" выдана`, 'success');
        if (!result.appliedToDiscord) setTimeout(() => toast('В Discord применится после привязки', 'info'), 1200);
        document.getElementById('rolePickArea').style.display = 'none';
        selectedMember = null;
        document.getElementById('steamSearch').value = '';
        document.getElementById('steamResults').innerHTML = '<div class="empty-state">Готово</div>';
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

      <button class="fd-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="fd-btn-confirm" id="fdConfirmBtn" disabled>+ Создать</button>
    </div>
  `;
  document.getElementById('fdModal').classList.add('visible');

  const codeEl = document.getElementById('fd_code');
  const statusEl = document.getElementById('fd_code_status');
  const counterEl = document.getElementById('fd_code_counter');
  const confirmBtn = document.getElementById('fdConfirmBtn');

  function validate() {
    const raw = codeEl.value;
    const cleaned = raw.replace(/[^a-zA-Zа-яА-ЯёЁ0-9_\-]/g, '');
    if (cleaned !== raw) codeEl.value = cleaned;
    const upper = cleaned.toUpperCase();
    counterEl.textContent = `${upper.length} / 32`;
    if (!upper) { statusEl.textContent = '3–32 символа · латиница, кириллица, цифры, «_», «-»'; statusEl.style.color = 'var(--text-dim)'; confirmBtn.disabled = true; return; }
    if (upper.length < 3) { statusEl.textContent = `Минимум 3 символа (${upper.length})`; statusEl.style.color = '#fbbf24'; confirmBtn.disabled = true; return; }
    if (/^[A-ZА-ЯЁ0-9_\-]{3,32}$/.test(upper)) {
      const hasCyr = /[А-ЯЁ]/.test(upper);
      statusEl.textContent = hasCyr ? 'Кириллица разрешена' : 'Код валиден';
      statusEl.style.color = '#4ade80';
      confirmBtn.disabled = false;
    }
  }
  codeEl.addEventListener('input', validate);
  validate();
  setTimeout(() => codeEl.focus(), 100);

  confirmBtn.onclick = async () => {
    const code = codeEl.value.trim().toUpperCase();
    const amount = Number(document.getElementById('fd_amount').value);
    const maxUses = Number(document.getElementById('fd_maxUses').value) || 0;
    if (!code || !amount) { toast('Заполните код и сумму', 'error'); return; }
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Создание...';
    try {
      await api('/api/promocodes', { method: 'POST', body: JSON.stringify({ code, amount, maxUses }) });
      toast(`Промокод «${code}» создан`, 'success');
      closeModal();
      loadPromoList();
    } catch (e) {
      const errors = { already_exists: 'Такой уже есть', bad_code_format: 'Неверный формат', missing_fields: 'Заполните поля' };
      const key = e.message.split(' — ')[0];
      toast((errors[key] || e.message), 'error');
      confirmBtn.disabled = false;
      confirmBtn.textContent = '+ Создать';
    }
  };
}

window.fdPresetCode = function(prefix) {
  const el = document.getElementById('fd_code');
  if (!el) return;
  el.value = prefix + Math.floor(10 + Math.random() * 90);
  el.dispatchEvent(new Event('input'));
  el.focus();
};

function deletePromo(code) {
  confirmModal({
    title: `Удалить «${code}»?`,
    desc: 'Промокод будет удалён безвозвратно.',
    confirmText: 'Удалить',
    onConfirm: async () => {
      try {
        await api('/api/promocodes/' + encodeURIComponent(code), { method: 'DELETE' });
        toast(`Промокод «${code}» удалён`, 'success');
        loadPromoList();
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }
  });
}

/* ============ РУЛЕТКА (только владелец) ============ */
async function loadRouletteBlock(body) {
  if (!isOwner()) {
    body.innerHTML = '<div class="empty-state">Только для владельца</div>';
    return;
  }
  body.innerHTML = '<div class="skeleton"></div>';
  try {
    const data = await api('/api/admin/roulette/prizes');
    roulettePrizesCache = data.prizes || [];
    renderRouletteBlock(body, data);
  } catch (e) {
    body.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

function renderRouletteBlock(body, data) {
  const prizes = data.prizes || [];
  const totalWeight = prizes.reduce((s, p) => s + Number(p.weight || 0), 0);

  body.innerHTML = `
    <div class="section-block">
      <div class="section-block-head">
        <div>
          <div class="section-block-title">Рулетка — настройка шансов</div>
          <div class="section-block-sub">Меняйте вес каждого приза. Чем выше вес — тем чаще выпадает. Сумма весов: <b>${totalWeight.toFixed(2)}</b></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-act ghost" onclick="resetRoulettePrizes()">Сбросить к дефолту</button>
          <button class="btn-act green" onclick="saveRoulettePrizes()">Сохранить</button>
        </div>
      </div>

      <div id="rouletteEditor" style="display:flex;flex-direction:column;gap:8px;"></div>

      <div style="margin-top:16px;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;">
        <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.4px;font-weight:700;margin-bottom:8px;">Итоговые шансы</div>
        <div id="rouletteChances" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>

      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-act blue" onclick="addRoulettePrize()">+ Добавить приз</button>
      </div>
    </div>
  `;

  renderRouletteEditor();
  renderRouletteChances();
}

function renderRouletteEditor() {
  const el = document.getElementById('rouletteEditor');
  if (!el) return;

  const tierColor = (t) => t === 'red' ? '#ef4444' : t === 'purple' ? '#a855f7' : t === 'empty' ? '#6b7280' : '#60a5fa';

  el.innerHTML = roulettePrizesCache.map((p, i) => {
    const tier = p.amount === 0 ? 'empty' : p.amount >= 300 ? 'red' : p.amount >= 50 ? 'purple' : 'blue';
    const color = tierColor(tier);
    return `
      <div class="roulette-editor-row" data-index="${i}" style="border-left:4px solid ${color};">
        <div class="roulette-editor-field">
          <label>Сумма (₽)</label>
          <input type="number" min="0" step="1" value="${p.amount}" oninput="onRoulettePrizeChange(${i}, 'amount', this.value)">
        </div>
        <div class="roulette-editor-field">
          <label>Вес (шанс)</label>
          <input type="number" min="0.01" step="0.01" value="${p.weight}" oninput="onRoulettePrizeChange(${i}, 'weight', this.value)">
        </div>
        <div class="roulette-editor-field roulette-editor-tier">
          <span class="roulette-tier-pill" style="background:${color}22;border-color:${color}66;color:${color};">
            ${tier === 'red' ? 'КРАСНЫЙ' : tier === 'purple' ? 'ФИОЛЕТ' : tier === 'empty' ? 'ПУСТО' : 'СИНИЙ'}
          </span>
        </div>
        <button class="roulette-editor-remove" onclick="removeRoulettePrize(${i})" title="Удалить">
          ${window.ICONS.trash}
        </button>
      </div>
    `;
  }).join('');
}

function renderRouletteChances() {
  const el = document.getElementById('rouletteChances');
  if (!el) return;
  const total = roulettePrizesCache.reduce((s, p) => s + Number(p.weight || 0), 0);
  if (total <= 0) { el.innerHTML = '<div style="color:var(--text-dim);font-size:12px;">Нет данных</div>'; return; }
  el.innerHTML = roulettePrizesCache.map((p, i) => {
    const chance = (Number(p.weight) / total) * 100;
    const tier = p.amount === 0 ? 'empty' : p.amount >= 300 ? 'red' : p.amount >= 50 ? 'purple' : 'blue';
    const color = tier === 'red' ? '#ef4444' : tier === 'purple' ? '#a855f7' : tier === 'empty' ? '#6b7280' : '#60a5fa';
    return `<span style="padding:4px 10px;background:${color}18;border:1px solid ${color}55;border-radius:100px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:11px;color:${color};">
      ${p.amount > 0 ? p.amount + '₽' : 'пусто'} — ${chance.toFixed(2)}%
    </span>`;
  }).join('');
}

window.onRoulettePrizeChange = function (index, field, value) {
  if (!roulettePrizesCache[index]) return;
  const num = Number(value);
  if (!Number.isFinite(num)) return;
  roulettePrizesCache[index][field] = num;
  renderRouletteEditor();
  renderRouletteChances();
};

window.removeRoulettePrize = function (index) {
  if (!roulettePrizesCache[index]) return;
  roulettePrizesCache.splice(index, 1);
  renderRouletteEditor();
  renderRouletteChances();
};

window.addRoulettePrize = function () {
  roulettePrizesCache.push({ amount: 0, weight: 1 });
  renderRouletteEditor();
  renderRouletteChances();
};

window.saveRoulettePrizes = async function () {
  try {
    const cleaned = roulettePrizesCache
      .map(p => ({ amount: Number(p.amount), weight: Number(p.weight) }))
      .filter(p => Number.isFinite(p.amount) && p.amount >= 0 && Number.isFinite(p.weight) && p.weight > 0);

    if (!cleaned.length) { toast('Добавьте хотя бы один приз', 'error'); return; }

    const res = await api('/api/admin/roulette/prizes', {
      method: 'POST',
      body: JSON.stringify({ prizes: cleaned }),
    });
    toast('Конфиг рулетки сохранён', 'success');
    roulettePrizesCache = res.prizes;
    loadRouletteBlock(document.getElementById('mgBody'));
  } catch (e) {
    const errors = {
      bad_prizes: 'Некорректный список призов',
      bad_amount: 'Некорректная сумма',
      bad_weight: 'Некорректный вес',
    };
    const key = e.message.split(' — ')[0];
    toast(errors[key] || e.message, 'error');
  }
};

window.resetRoulettePrizes = function () {
  confirmModal({
    title: 'Сбросить конфиг рулетки?',
    desc: 'Все призы и шансы вернутся к заводским значениям.',
    confirmText: 'Сбросить',
    onConfirm: async () => {
      try {
        await api('/api/admin/roulette/prizes/reset', { method: 'POST' });
        toast('Конфиг сброшен', 'success');
        loadRouletteBlock(document.getElementById('mgBody'));
      } catch (e) {
        toast('Ошибка: ' + e.message, 'error');
      }
    }
  });
};

/* ============ ПОКУПКИ ============ */
async function loadOrdersBlock(body) {
  if (!isOwner() && !isHeadAdminOrOwner()) { body.innerHTML = '<div class="empty-state">Доступно владельцу и главной администрации.</div>'; return; }
  body.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка...</div>';
  try {
    const data = await api('/api/shop/orders/all');
    const orders = data.orders || [];
    if (!orders.length) { body.innerHTML = '<div class="empty-state">Покупок нет</div>'; return; }
    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head"><div><div class="section-block-title">Покупки привилегий</div><div class="section-block-sub">Все покупки пользователей · уведомления также приходят в Discord</div></div></div>
        <div class="cards-list">
          ${orders.map(o => `
            <div class="app-card compact">
              <div style="width:40px;height:40px;border-radius:10px;background:rgba(225,6,0,0.12);border:1px solid rgba(225,6,0,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#e10600;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:18px;height:18px;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              </div>
              <div class="app-body">
                <div class="app-head"><span class="app-name">${esc(o.userName)}</span><span class="app-date">${new Date(o.createdAt).toLocaleDateString('ru-RU')}</span></div>
                <div class="app-row"><span>Товар: <b>${esc(o.itemName)}${o.tariffLabel ? ' — ' + esc(o.tariffLabel) : ''}</b></span><span>Цена: <b>${o.price} ₽</b></span></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch (e) { body.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
}

/* ============ НАСТРОЙКИ ============ */

  try {
    const data = await api('/api/settings');

    body.innerHTML = `
      <div class="section-block">
        <div class="section-block-head"><div><div class="section-block-title">Настройки</div></div></div>
        <div class="settings-grid">
          <div class="setting-card"><div class="setting-label">Discord сервер</div><div class="setting-value">${esc(s.guildId)}</div></div>
          <div class="setting-card"><div class="setting-label">Канал заявок</div><div class="setting-value">${esc(s.applyChannel)}</div></div>

          <div class="setting-card"><div class="setting-label">Канал покупок</div><div class="setting-value">${esc(s.purchaseChannel || '—')}</div></div>

          <div class="setting-card"><div class="setting-label">Канал привилегий</div><div class="setting-value">${esc(s.privilegesChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Канал логов сайта</div><div class="setting-value">${esc(s.siteLogsChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Канал ошибок</div><div class="setting-value">${esc(s.errorsChannel || '—')}</div></div>
          <div class="setting-card"><div class="setting-label">Статус бота</div><div class="setting-value ${s.botConnected ? 'ok' : 'err'}">${s.botConnected ? 'Подключён' : 'Не подключён'}</div></div>
        </div>
      </div>
    `;
  } catch (e) { body.innerHTML = `<div class="empty-state" style="color:var(--red);">${esc(e.message)}</div>`; }
}

async function loadMonitorBlock(body) {
  body.innerHTML = '<div class="loading-state"><div class="spinner"></div> Проверка...</div>';
  const start = performance.now();
  let apiStatus = 'err', ping = '—';
  try { await api('/api/me'); ping = Math.round(performance.now() - start) + ' ms'; apiStatus = 'ok'; }
  catch { /* error */ }
  body.innerHTML = `
    <div class="section-block">
      <div class="section-block-head"><div><div class="section-block-title">Мониторинг</div></div><button class="btn-act ghost" onclick="loadMonitorBlock(document.getElementById('mgBody'))">Обновить</button></div>
      <div class="settings-grid">
        <div class="setting-card"><div class="setting-label">API</div><div class="setting-value ${apiStatus}">${apiStatus === 'ok' ? 'Работает' : 'Ошибка'}</div></div>
        <div class="setting-card"><div class="setting-label">Ping</div><div class="setting-value">${ping}</div></div>
      </div>
    </div>
  `;
}
