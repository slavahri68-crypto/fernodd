<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Профиль</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
  body > .auth-widget { display: none !important; }
  .my-page { min-height: 100vh; padding: 80px 24px 140px; position: relative; z-index: 1; }
  .my-container { max-width: 1100px; margin: 0 auto; }

  .my-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .my-header-left { display: flex; align-items: center; gap: 12px; }
  .my-header-balance { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 100px; font-family: 'Unbounded', sans-serif; font-size: 13px; color: #fff; font-weight: 700; }
  .my-header-right { display: flex; align-items: center; gap: 10px; }

  .profile-avatar-btn { position: relative; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); border-radius: 100px; transition: all 0.3s; }
  .profile-avatar-btn:hover { border-color: var(--red); }
  .profile-avatar-btn img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .profile-avatar-btn .chev { width: 14px; height: 14px; color: var(--text-dim); transition: transform 0.3s; }
  .profile-avatar-btn.open .chev { transform: rotate(180deg); }

  .my-menu { position: absolute; top: calc(100% + 12px); right: 0; width: 320px; background: #0e0e0e; border: 1px solid var(--border-bright); border-radius: 18px; padding: 12px; box-shadow: 0 25px 70px rgba(0,0,0,0.9); opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-10px) scale(0.96); transform-origin: top right; transition: opacity 0.25s, transform 0.25s, visibility 0s linear 0.25s; z-index: 600; }
  .profile-avatar-btn.open .my-menu { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1); transition: opacity 0.25s, transform 0.25s, visibility 0s; }
  .my-menu-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-width: 0; }
  .my-menu-avatar { width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--red); object-fit: cover; flex-shrink: 0; }
  .my-menu-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 3px; white-space: normal; overflow-wrap: anywhere; word-break: break-word; line-height: 1.2; max-width: 100%; }
  .my-menu-balance { font-size: 12px; color: var(--text-dim); }
  .my-menu-divider { height: 1px; background: var(--border); margin: 10px 8px; }
  .my-menu-item { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 10px; color: var(--text-dim); font-size: 14px; font-weight: 500; text-decoration: none; transition: all 0.2s; }
  .my-menu-item:hover { background: rgba(225,6,0,0.12); color: #fff; transform: translateX(3px); }
  .my-menu-item.active { background: rgba(225,6,0,0.15); color: #fff; }
  .my-menu-icon { width: 22px; text-align: center; font-size: 16px; }

  /* STEAM-КАРТОЧКА */
  .steam-card { background: #0e0e0e; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; position: relative; }
  .steam-cover { height: 180px; background: linear-gradient(135deg, #1a1a1a 0%, #060606 100%); background-size: cover; background-position: center; position: relative; overflow: hidden; }
  .steam-cover::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(225,6,0,0.15), transparent 60%); }
  .steam-cover-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 80px; color: rgba(255,255,255,0.06); font-weight: 900; letter-spacing: -3px; }
  .steam-cover-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 2; }
  .cover-icon-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid var(--border-bright); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; text-decoration: none; }
  .cover-icon-btn:hover { color: var(--red); border-color: var(--red); transform: translateY(-2px); }
  .cover-icon-btn svg { width: 18px; height: 18px; }

  .steam-body { padding: 0 24px 24px; position: relative; }
  .steam-avatar-wrap { position: relative; width: 130px; height: 130px; margin-top: -65px; margin-bottom: 12px; border: 4px solid #0e0e0e; border-radius: 6px; overflow: hidden; z-index: 2; background: #060606; }
  .steam-avatar { width: 100%; height: 100%; object-fit: cover; display: block; }
  .steam-status { position: absolute; bottom: 6px; right: 6px; width: 24px; height: 24px; border: 4px solid #0e0e0e; border-radius: 4px; z-index: 3; }
  .steam-status.online  { background: #57cbde; }
  .steam-status.idle    { background: #fbbf24; }
  .steam-status.dnd     { background: #ef4444; }
  .steam-status.offline { background: #898989; }

  .steam-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; min-width: 0; }
  .steam-name { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.5px; word-break: break-word; overflow-wrap: anywhere; line-height: 1.15; max-width: 100%; }
  .steam-badge { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
  .steam-role-badge { display: inline-flex; padding: 5px 14px; background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.5); border-radius: 100px; font-family: 'Unbounded', sans-serif; font-size: 12px; font-weight: 700; color: #60a5fa; margin-bottom: 8px; }
  .steam-status-text { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .steam-status-text b { color: #57cbde; }

  .steam-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .steam-btn { padding: 9px 18px; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid var(--border-bright); background: rgba(255,255,255,0.04); color: var(--text); transition: all 0.25s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .steam-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--red); }
  .steam-btn.primary { background: linear-gradient(135deg, var(--red), var(--red-dark)); border-color: var(--red); color: #fff; }
  .steam-btn.primary:hover { box-shadow: 0 8px 24px rgba(225,6,0,0.4); transform: translateY(-2px); }

  @media (min-width: 700px) {
    .steam-card.pc-layout .steam-avatar-wrap { position: absolute; top: -65px; left: 24px; margin: 0; }
    .steam-card.pc-layout .steam-content { margin-left: 154px; padding-top: 16px; min-height: 100px; }
  }
  @media (max-width: 699px) {
    .steam-cover { height: 140px; }
    .steam-cover-text { font-size: 50px; }
    .steam-body { padding: 0 16px 20px; text-align: center; }
    .steam-avatar-wrap { margin-left: auto; margin-right: auto; width: 110px; height: 110px; margin-top: -55px; }
    .steam-name-row { justify-content: center; text-align: center; }
    .steam-name { font-size: 20px; }
    .steam-role-badge { margin: 0 auto 8px; }
    .steam-actions { justify-content: center; }
    .my-page { padding: 70px 12px 120px; }
    .my-menu { width: 280px; right: -50px; }
  }

  .loading-state { display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 10px; color: var(--text-dim); font-size: 13px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
  .empty-state .ico { font-size: 36px; margin-bottom: 10px; opacity: 0.35; }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-glow-3"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="auth-widget" id="authWidget"></div>

<main class="my-page">
  <div class="my-container">
    <div class="my-header">
      <div class="my-header-left">
        <div class="my-header-balance"><span id="headerBalance">0 ₽</span></div>
      </div>
      <div class="my-header-right">
        <div class="profile-avatar-btn" id="profileAvatarBtn" onclick="toggleProfileMenu(event)">
          <img id="headerAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          <div id="profileMenuContent"></div>
        </div>
      </div>
    </div>

    <div class="steam-card pc-layout" id="steamCard">
      <div class="steam-cover" id="steamCover">
        <div class="steam-cover-text" id="coverText">FERNODD</div>
        <div class="steam-cover-actions">
          <a class="cover-icon-btn" href="#" id="steamLinkBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0z"/></svg>
          </a>
          <button class="cover-icon-btn" onclick="copyProfileLink()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
        </div>
      </div>
      <div class="steam-body">
        <div class="steam-avatar-wrap">
          <img class="steam-avatar" id="steamAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
          <span class="steam-status offline" id="steamStatus"></span>
        </div>
        <div class="steam-content" id="steamContent">
          <div class="loading-state"><div class="spinner"></div> Загрузка профиля...</div>
        </div>
      </div>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a class="nav-btn" href="/index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Главная</span></a>
  <a class="nav-btn" href="/rules.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Правила</span></a>
  <a class="nav-btn" href="/roles.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Роли</span></a>
  <a class="nav-btn" href="/apply.html"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Заявка</span></a>
  <a class="nav-btn active" href="/profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg><span>Профиль</span></a>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/js/common.js"></script>
<script src="/js/my-profile.js"></script>
<script src="/js/auth.js"></script>
<script>
let targetUserId = null;

window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  if (!user) {
    document.getElementById('steamContent').innerHTML = '<div class="empty-state"><div class="ico">🔒</div>Войдите через Steam</div>';
    return;
  }
  document.getElementById('headerAvatar').src = user.avatar || '';
  document.getElementById('headerBalance').textContent = `${user.balance || 0} ₽`;
  document.getElementById('profileMenuContent').innerHTML = renderProfileMenu('profile');
  const params = new URLSearchParams(window.location.search);
  targetUserId = params.get('id') || user.steamId || user.id;
  loadProfile();
});

async function loadProfile() {
  try {
    const r = await api(`/api/users/${targetUserId}`);
    const user = r.user;
    if (!user) {
      document.getElementById('steamContent').innerHTML = '<div class="empty-state"><div class="ico">🔍</div>Не найден</div>';
      return;
    }
    renderSteamCard(user);
  } catch (e) {
    document.getElementById('steamContent').innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

function renderSteamCard(user) {
  const avatar = user.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
  const name = user.nickname || user.global_name || user.username || 'Пользователь';
  const status = (user.presence && user.presence.status) || 'offline';
  const statusText = { online: 'В сети', idle: 'Неактивен', dnd: 'Не беспокоить', offline: 'Не в сети' }[status] || 'Не в сети';

  document.getElementById('steamAvatar').src = avatar;
  document.getElementById('steamStatus').className = 'steam-status ' + status;

  if (user.backgroundUrl) {
    const cover = document.getElementById('steamCover');
    cover.style.background = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('${user.backgroundUrl}') center/cover`;
    document.getElementById('coverText').style.display = 'none';
  }

  const topRole = user.topRole || (user.roles || [])[0];
  const ROLE_COLORS = {
    'Главная администрация': '#e10600',
    'Владелец': '#e10600',
    'Разработчик': '#e10600',
    'Следящий': '#e10600',
    'Куратор': '#e10600',
    'Поддержка': '#e10600',
    'Медиа': '#e10600',
    'Главный модератор': '#22d3ee',
    'Старший модератор': '#4ade80',
    'Модератор': '#3b82f6',
    'Игрок': '#a855f7',
  };
  const roleColor = ROLE_COLORS[topRole] || '#60a5fa';
  const steamLink = user.profileUrl || (user.steamId ? `https://steamcommunity.com/profiles/${user.steamId}` : '#');
  document.getElementById('steamLinkBtn').href = steamLink;

  const desc = user.description || 'Is it worth it?';

  let socialLinks = '';
  if (user.telegram) socialLinks += `<a class="steam-btn" href="${escapeHtml(user.telegram)}" target="_blank" rel="noopener">📱 Telegram</a>`;
  if (user.vk) socialLinks += `<a class="steam-btn" href="${escapeHtml(user.vk)}" target="_blank" rel="noopener">🅥 VK</a>`;

  document.getElementById('steamContent').innerHTML = `
    ${topRole ? `<div class="steam-role-badge" style="background:${roleColor}22;border-color:${roleColor}88;color:${roleColor};">${escapeHtml(topRole)}</div>` : ''}
    <div class="steam-name-row">
      <div class="steam-name">${escapeHtml(name)}</div>
      ${user.isOwner ? '<div class="steam-badge">👑</div>' : ''}
    </div>
    <div class="steam-status-text">
      <b>${statusText}</b> · ${escapeHtml(desc)}
    </div>
    <div class="steam-actions">
      <a class="steam-btn primary" href="${steamLink}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0z"/></svg>
        Steam профиль
      </a>
      <a class="steam-btn" href="/settings.html">⚙️ Настройки</a>
      ${socialLinks}
    </div>
  `;
}

function copyProfileLink() {
  const url = `${window.location.origin}/profile.html?id=${targetUserId}`;
  navigator.clipboard.writeText(url).then(() => showToast('✅ Скопировано', 'success'))
    .catch(() => showToast('Не удалось', 'error'));
}
</script>
</body>
</html>
