<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Профиль</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
  body > .auth-widget { display: none !important; }
  .my-page { min-height: 100vh; padding: 70px 0 100px; position: relative; z-index: 1; }
  .my-container { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 14px; }

  .my-header { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; padding: 0 4px; }
  .my-header-right { display: flex; align-items: center; gap: 10px; }

  .steam-profile { position: relative; border-radius: 18px; overflow: hidden; background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); margin-bottom: 14px; }
  .steam-banner { height: 140px; background: linear-gradient(135deg, #1a1a1a 0%, #060606 100%); background-size: cover; background-position: center; position: relative; }
  .steam-banner::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 120%, rgba(225,6,0,0.25), transparent 60%); pointer-events: none; }

  .steam-social-corner { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 3; }
  .steam-social-corner a { width: 36px; height: 36px; border-radius: 10px; background: rgba(10,10,10,0.75); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; transition: all 0.25s; color: #b0b0b0; }
  .steam-social-corner a:hover { transform: translateY(-3px); color: #fff; border-color: var(--red); background: rgba(225,6,0,0.15); box-shadow: 0 6px 20px rgba(225,6,0,0.35); }
  .steam-social-corner svg { width: 18px; height: 18px; fill: currentColor; }

  .profile-avatar-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: -55px auto 12px;
    position: relative;
    z-index: 2;
    padding: 0 20px;
  }
  .steam-avatar-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    border-radius: 14px;
    border: 3px solid #0e0e0e;
    overflow: hidden;
    background: #060606;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    flex-shrink: 0;
  }
  .steam-avatar { width: 100%; height: 100%; object-fit: cover; display: block; }
  .steam-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); color: var(--text-dim); font-size: 20px; }
  .steam-avatar-empty::after { content: '—'; opacity: 0.4; }

  .steam-body { padding: 0 20px 22px; text-align: center; }
  .steam-role-badge { display: inline-block; padding: 5px 14px; background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.5); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; color: #60a5fa; margin-bottom: 12px; }
  .steam-name-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .steam-name { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; word-break: break-word; line-height: 1.15; max-width: 100%; }

  .steam-badge-item { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; line-height: 1; }
  .steam-badge-item.verify { background: transparent; border: none; padding: 0; filter: drop-shadow(0 0 8px rgba(251,191,36,0.6)); animation: fernoddPlusPulse 3s ease-in-out infinite; }
  @keyframes fernoddPlusPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(251,191,36,0.5)); }
    50% { filter: drop-shadow(0 0 16px rgba(251,191,36,0.9)); }
  }
  .steam-badge-item.verify svg { width: 18px; height: 18px; }
  .steam-badge-item.fire { background: rgba(255,68,0,0.15); color: #ff4400; border: 1px solid rgba(255,68,0,0.35); padding: 4px 10px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12px; }
  .steam-badge-item .badge-icon { display: inline-flex; width: 12px; height: 12px; align-items: center; justify-content: center; }
  .steam-badge-item .badge-icon svg { width: 12px; height: 12px; fill: currentColor; }

  .steam-status-text { font-size: 12.5px; font-weight: 600; margin-bottom: 14px; font-family: 'Unbounded', sans-serif; letter-spacing: -0.2px; }
  .steam-status-text.online { color: #4ade80; }
  .steam-status-text.offline { color: #8a8a8a; }
  .steam-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; padding: 0 8px; }

  .profile-reactions { display: flex; align-items: center; gap: 18px; margin: 10px 0 16px; padding: 0 20px; justify-content: center; }
  .reaction-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 100px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.25s; user-select: none; }
  .reaction-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .reaction-btn:hover { transform: translateY(-2px); border-color: rgba(225,6,0,0.4); color: #fff; }
  .reaction-btn.active-like { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.5); color: #4ade80; }
  .reaction-btn.active-dislike { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.5); color: #ef4444; }
  .reaction-views { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; color: var(--text-dim); }
  .reaction-views svg { width: 16px; height: 16px; fill: currentColor; }

  .steam-menu { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 18px; padding: 8px; margin-bottom: 14px; }
  .steam-menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500; text-decoration: none; transition: all 0.2s; background: transparent; border: none; width: 100%; text-align: left; cursor: pointer; }
  .steam-menu-item:hover { background: rgba(225,6,0,0.08); color: #fff; transform: translateX(4px); }
  .steam-menu-item.active { background: rgba(225,6,0,0.12); color: #fff; }
  .steam-menu-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-dim); transition: color 0.2s; }
  .steam-menu-item:hover .steam-menu-icon { color: var(--red); }
  .steam-menu-item.active .steam-menu-icon { color: var(--red); }
  .steam-menu-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .tab-panel { display: none; animation: fadeUp 0.35s; }
  .tab-panel.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-title { font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  .section-title .cnt { padding: 3px 10px; background: rgba(255,255,255,0.06); border-radius: 100px; font-size: 11px; color: var(--text-dim); font-weight: 700; }

  .inv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .inv-card { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 14px; padding: 14px 12px; position: relative; overflow: visible; display: flex; flex-direction: column; transition: all 0.3s; }
  .inv-card:hover { transform: translateY(-4px); border-color: var(--item-color, var(--red)); }
  .inv-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--item-color, var(--red)); box-shadow: 0 0 15px var(--item-color, var(--red)); opacity: 0.7; border-radius: 14px 14px 0 0; }
  .inv-tag { display: inline-block; align-self: flex-start; padding: 3px 9px; border-radius: 6px; font-size: 10px; font-weight: 800; font-family: 'Unbounded', sans-serif; letter-spacing: 0.3px; margin-bottom: 10px; background: rgba(225,6,0,0.15); color: var(--red); }
  .inv-tag.vip { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .inv-image { height: 70px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; filter: drop-shadow(0 0 20px rgba(251,191,36,0.25)); color: var(--item-color, var(--red)); }
  .inv-image svg { width: 44px; height: 44px; fill: currentColor; }
  .inv-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 6px; letter-spacing: -0.3px; min-height: 32px; display: flex; align-items: center; justify-content: center; }
  .inv-info { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: var(--text-dim); padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
  .inv-info b { color: #fff; font-weight: 600; }

  .inv-actions-btn { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; z-index: 5; padding: 0; }
  .inv-actions-btn:hover { background: rgba(225,6,0,0.12); border-color: rgba(225,6,0,0.5); color: var(--red); }
  .inv-actions-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .inv-actions-menu { position: absolute; top: 44px; right: 10px; min-width: 140px; background: #0e0e0e; border: 1px solid var(--border-bright); border-radius: 10px; padding: 5px; box-shadow: 0 12px 40px rgba(0,0,0,0.85), 0 0 0 1px rgba(225,6,0,0.08); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.96); transform-origin: top right; transition: opacity 0.2s, transform 0.2s, visibility 0s linear 0.2s; z-index: 10; }
  .inv-card.menu-open .inv-actions-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); transition: opacity 0.2s, transform 0.2s, visibility 0s; }
  .inv-actions-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: transparent; border: none; border-radius: 7px; color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; text-align: left; cursor: pointer; transition: all 0.2s; }
  .inv-actions-item:hover { background: rgba(239,68,68,0.12); color: #ef4444; }
  .inv-actions-item svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .friends-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .f-tab { padding: 8px 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 100px; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px; }
  .f-tab.active { background: rgba(225,6,0,0.15); color: #fff; border-color: var(--red); }
  .f-tab .count { display: inline-block; padding: 1px 7px; background: rgba(255,255,255,0.06); border-radius: 100px; font-size: 10px; }
  .f-tab.active .count { background: rgba(225,6,0,0.25); }

  .friends-list { display: flex; flex-direction: column; gap: 6px; }
  .friend-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #0e0e0e; border: 1px solid var(--border); border-radius: 12px; transition: all 0.25s; text-decoration: none; }
  .friend-row:hover { border-color: rgba(225,6,0,0.4); transform: translateX(4px); }
  .friend-avatar-wrap { position: relative; flex-shrink: 0; }
  .friend-avatar { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
  .friend-avatar-empty { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); color: var(--text-dim); }
  .friend-avatar-empty::after { content: '—'; opacity: 0.5; }
  .friend-status { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid #0e0e0e; }
  .friend-status.online { background: #4ade80; }
  .friend-status.offline { background: #6b7280; }
  .friend-status.busy { background: #ef4444; }
  .friend-info { flex: 1; min-width: 0; }
  .friend-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .friend-meta { font-size: 11px; color: var(--text-dim); }

  .tx-list { display: flex; flex-direction: column; gap: 8px; }
  .tx-item { display: flex; gap: 12px; padding: 12px 14px; background: #0e0e0e; border: 1px solid var(--border); border-radius: 12px; transition: all 0.2s; }
  .tx-item:hover { border-color: rgba(225,6,0,0.3); }
  .tx-arrow { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; flex-shrink: 0; }
  .tx-arrow.income { background: rgba(74,222,128,0.12); color: #4ade80; }
  .tx-arrow.outcome { background: rgba(239,68,68,0.12); color: #ef4444; }
  .tx-body { flex: 1; min-width: 0; }
  .tx-title { font-size: 12.5px; color: #fff; line-height: 1.4; margin-bottom: 4px; word-break: break-word; }
  .tx-amount-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tx-amount { font-family: 'Unbounded', sans-serif; font-size: 12.5px; font-weight: 700; }
  .tx-amount.income { color: #4ade80; }
  .tx-amount.outcome { color: #ef4444; }
  .tx-date { font-size: 10.5px; color: var(--text-dim); }

  .settings-card { background: linear-gradient(145deg, #0e0e0e, #0a0a0a); border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 20px; margin-bottom: 14px; }
  .form-label { display: block; font-size: 12.5px; color: #fff; margin-bottom: 8px; font-weight: 600; font-family: 'Unbounded', sans-serif; letter-spacing: -0.2px; }
  .form-input { width: 100%; padding: 12px 16px; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 10px; color: #fff; font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; margin-bottom: 16px; transition: all 0.3s; }
  .form-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(225,6,0,0.12); }
  .form-input::placeholder { color: #555; }
  .form-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .discord-link-box { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(96,165,250,0.06); border: 1px solid rgba(96,165,250,0.35); border-radius: 10px; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .discord-link-info { display: flex; align-items: center; gap: 12px; }
  .discord-link-info img { width: 36px; height: 36px; border-radius: 10px; }
  .discord-link-info .name { font-size: 13px; color: #fff; font-weight: 600; }
  .discord-unlink { padding: 8px 14px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); border-radius: 8px; color: #ef4444; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.3s; }
  .discord-unlink:hover { background: rgba(239,68,68,0.25); }
  .btn-link-discord { padding: 8px 14px; background: linear-gradient(135deg, #5865f2, #4752c4); border-radius: 8px; color: #fff; font-weight: 600; font-size: 12px; text-decoration: none; }

  .save-all-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border: none; border-radius: 12px; color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 14px; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(225,6,0,0.35); letter-spacing: -0.2px; }
  .save-all-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(225,6,0,0.55); }
  .save-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .link-block { position: relative; padding: 14px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-bright); border-radius: 12px; margin-bottom: 16px; }
  .link-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .link-head-title { font-family: 'Unbounded', sans-serif; font-size: 12.5px; font-weight: 700; color: #fff; display: inline-flex; align-items: center; gap: 8px; }
  .link-head-title .ico { width: 26px; height: 26px; border-radius: 7px; background: rgba(225,6,0,0.12); border: 1px solid rgba(225,6,0,0.3); display: inline-flex; align-items: center; justify-content: center; color: var(--red); }
  .link-head-title .ico svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  .link-head-clear { font-size: 11.5px; color: var(--text-dim); cursor: pointer; text-decoration: none; padding: 4px 10px; border-radius: 8px; transition: all 0.2s; background: transparent; border: 1px solid transparent; font-family: 'Inter', sans-serif; }
  .link-head-clear:hover { color: var(--red); background: rgba(225,6,0,0.08); }

  .badge-tag { padding: 3px 9px; background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; border-radius: 100px; font-size: 9.5px; font-weight: 900; letter-spacing: 0.5px; font-family: 'Unbounded', sans-serif; }
  .badge-tag.no-plus { background: linear-gradient(135deg, #ff4400, #8b0000); color: #fff; }

  .link-input-row { display: flex; align-items: stretch; background: var(--bg-elevated); border: 1px solid var(--border-bright); border-radius: 10px; overflow: hidden; transition: all 0.25s; min-height: 46px; }
  .link-input-row:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225,6,0,0.12); }
  .link-prefix { display: flex; align-items: center; padding: 0 12px; background: rgba(255,255,255,0.02); border-right: 1px solid var(--border-bright); color: var(--red); font-family: 'Inter', monospace; font-weight: 700; font-size: 13px; white-space: nowrap; user-select: none; }
  .link-input { flex: 1; min-width: 0; padding: 0 12px; background: transparent; border: none; color: #fff; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; outline: none; line-height: 46px; }
  .link-input::placeholder { color: #4a4a4a; font-weight: 400; }
  .link-input:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-input-actions { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-left: 1px solid var(--border-bright); }
  .link-icon-btn { width: 30px; height: 30px; border-radius: 7px; background: transparent; border: 1px solid transparent; color: var(--text-dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
  .link-icon-btn:hover:not(:disabled) { color: #fff; background: rgba(255,255,255,0.05); }
  .link-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .link-icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .link-status-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .link-status { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-dim); }
  .link-status .dot-indicator { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .link-status.ok { color: #4ade80; }
  .link-status.ok .dot-indicator { opacity: 1; box-shadow: 0 0 8px currentColor; }
  .link-status.err { color: #ef4444; }
  .link-status.err .dot-indicator { opacity: 1; }
  .link-status.checking { color: #60a5fa; }
  .link-counter { font-family: 'Unbounded', sans-serif; font-size: 11px; color: var(--text-dim); font-weight: 700; margin-top: 8px; display: block; }
  .link-block.locked .link-input-row, .link-block.locked .link-status-row, .link-block.locked .link-counter { filter: blur(3px); opacity: 0.4; pointer-events: none; }
  .link-lock-overlay { position: absolute; inset: 0; background: linear-gradient(145deg, rgba(10,10,10,0.85), rgba(6,6,6,0.92)); backdrop-filter: blur(6px); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 6px; z-index: 5; }
  .link-lock-icon { width: 30px; height: 30px; color: #fbbf24; filter: drop-shadow(0 0 16px rgba(251,191,36,0.5)); }
  .link-lock-icon svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2; }
  .link-lock-title { font-family: 'Unbounded', sans-serif; font-size: 12.5px; font-weight: 800; color: #fbbf24; letter-spacing: -0.2px; }
  .link-lock-desc { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-dim); line-height: 1.4; max-width: 240px; }
  .link-lock-btn { padding: 8px 16px; background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; border-radius: 8px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 11px; text-decoration: none; box-shadow: 0 6px 20px rgba(251,191,36,0.4); margin-top: 4px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
  .loading-state { display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 10px; color: var(--text-dim); font-size: 13px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border-bright); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 699px) {
    .steam-banner { height: 110px; }
    .profile-avatar-row { margin-top: -48px; gap: 12px; padding: 0 16px; }
    .steam-avatar-wrap { width: 96px; height: 96px; border-radius: 12px; }
    .steam-name { font-size: 17px; }
    .steam-body { padding: 0 16px 20px; }
    .inv-grid { gap: 8px; }
    .inv-image { height: 60px; }
    .inv-image svg { width: 36px; height: 36px; }
    .inv-name { font-size: 12px; }
    .settings-card { padding: 16px; }
    .tx-title { font-size: 12px; }
    .steam-menu-item { font-size: 14px; padding: 12px 14px; }
  }
</style>
</head>

<script src="/js/common.js"></script>

<script>
let targetUserId = null;
let currentUserData = null;
let linkCheckTimer = null;
let lastCheckedLink = '';
let linkStatus = 'idle';

let isOwnProfile = true;
let canEditSettings = false;
let canViewTransactions = false;

let allFriends = [];
let currentFriendFilter = 'all';

document.addEventListener('DOMContentLoaded', () => {
  const ico = document.getElementById('linkHeadIco');
  if (ico) ico.innerHTML = window.ICONS.link;
});

window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  if (!user) {
    document.getElementById('steamBody').innerHTML = '<div class="empty-state">Войдите через Steam</div>';
    return;
  }
  const av = document.getElementById('headerAvatar');
  if (av) {
    if (user.avatar) { av.src = user.avatar; av.style.display = ''; }
    else { av.style.display = 'none'; }
  }
  const menuBox = document.getElementById('profileMenuContent');
  if (menuBox) menuBox.innerHTML = renderProfileMenu('profile');
  currentUserData = user;

  const pathParts = window.location.pathname.split('/').filter(Boolean);
  let urlId = null;
  if (pathParts[0] === 'profile' && pathParts[1]) urlId = pathParts[1];
  const params = new URLSearchParams(window.location.search);
  targetUserId = urlId || params.get('id') || user.steamId || user.id;

  loadProfile();

  const openTabFromHash = () => {
    const h = window.location.hash.replace('#', '');
    if (h && ['profile', 'skins', 'inventory', 'friends', 'transactions', 'settings'].includes(h)) {
      switchProfileTab(h);
    }
  };
  setTimeout(openTabFromHash, 500);
  window.addEventListener('hashchange', openTabFromHash);
});

function switchProfileTab(tab) {
  if (tab === 'settings' && !canEditSettings) return;
  if (tab === 'transactions' && !isOwnProfile && !canViewTransactions) return;
  document.querySelectorAll('.steam-menu-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
}

async function loadProfile() {
  if (!targetUserId) {
    document.getElementById('steamBody').innerHTML = '<div class="empty-state">Войдите через Steam</div>';
    return;
  }
  try {
    const r = await api(`/api/users/${targetUserId}`);
    const user = r.user;
    if (!user) {
      document.getElementById('steamBody').innerHTML = '<div class="empty-state">Не найден</div>';
      return;
    }
    const mySteamId = currentUserData?.steamId || currentUserData?.id;
    isOwnProfile = !!(mySteamId && mySteamId === user.steamId);
    const isStaff = window.canEditOthersProfiles && window.canEditOthersProfiles(currentUserData);
    canEditSettings = !!user.canEditSettings && (isOwnProfile || isStaff);
    canViewTransactions = !!user.canViewTransactions && (isOwnProfile || isStaff);

    renderSteamProfile(user);
    renderProfileSocials(user);
    renderProfileReactions(user);
    document.getElementById('profileDesc').innerHTML = escapeHtml(user.description || 'Is it worth it?');
    applyProfileVisibility(user);
    loadInventory(user.steamId);
    loadFriends(user.steamId);
    if (isOwnProfile) loadTransactions();
    else if (canViewTransactions) loadTransactions(user.steamId);
    if (isOwnProfile) loadDiscordInfo(currentUserData.discordId);
    else loadDiscordInfo(user.discordId);
    if (canEditSettings) loadSettingsDataFor(user);
  } catch (e) {
    document.getElementById('steamBody').innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

function renderSteamProfile(user) {
  const avatarImg = document.getElementById('steamAvatar');
  const avatarEmpty = document.getElementById('steamAvatarEmpty');
  if (user.avatar) {
    avatarImg.src = user.avatar;
    avatarImg.style.display = 'block';
    avatarEmpty.style.display = 'none';
  } else {
    avatarImg.style.display = 'none';
    avatarEmpty.style.display = 'flex';
  }

  const banner = document.getElementById('steamBanner');
  if (user.backgroundUrl) {
    try {
      const u = new URL(user.backgroundUrl);
      if (u.protocol === 'http:' || u.protocol === 'https:') {
        banner.style.background = `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.6)), url("${u.href}") center/cover`;
      } else {
        banner.style.background = '';
      }
    } catch {
      banner.style.background = '';
    }
  } else {
    banner.style.background = '';
  }

  const name = user.nickname || user.global_name || user.username || 'Пользователь';

  const ROLE_COLORS = {
    'Владелец': '#5865f2',
    'Главная администрация': '#5865f2',
    'Техническая поддержка': '#5865f2',
    'Следящий': '#f0b232',
    'Куратор': '#f0b232',
    'Главный модератор': '#00a8fc',
    'Старший модератор': '#23a55a',
    'Модератор': '#5865f2',
    'Игрок': '#a855f7',
  };
  const topRole = user.topRole || (user.roles || [])[0] || 'Игрок';
  const roleColor = ROLE_COLORS[topRole] || '#60a5fa';
  const desc = user.description || 'Is it worth it?';
  const status = user.siteStatus === 'online' ? 'online' : 'offline';
  const statusText = status === 'online' ? 'В сети' : 'Не в сети';

  const tagMatch = name.match(/#\S+/);
  const cleanName = name.replace(/#\S+/g, '').trim();
  const tag = user.tag || (tagMatch ? tagMatch[0] : '');

  const verifyBadge = user.isVerified
    ? `<span class="steam-badge-item verify" title="FERNODD+">
         <svg viewBox="0 0 24 24" fill="none">
           <path d="M12 2l2.4 1.8 3-.3 1.2 2.7 2.7 1.2-.3 3L22 12l-1.8 2.4.3 3-2.7 1.2-1.2 2.7-3-.3L12 22l-2.4-1.8-3 .3-1.2-2.7-2.7-1.2.3-3L2 12l1.8-2.4-.3-3 2.7-1.2 1.2-2.7 3 .3L12 2z" fill="url(#fernoddPlusGrad)"/>
           <path d="M8.5 12.5l2.2 2.2 4.8-4.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
           <defs>
             <linearGradient id="fernoddPlusGrad" x1="0" y1="0" x2="1" y2="1">
               <stop offset="0%" stop-color="#fbbf24"/>
               <stop offset="100%" stop-color="#d97706"/>
             </linearGradient>
           </defs>
         </svg>
       </span>` : '';

  let activityBadge = '';
  const fireIcon = window.ICONS.flame;
  const snowIcon = window.ICONS.snowflake;

  if (user.activity > 0) {
    const frozen = user.streakFrozen;
    const icon = frozen ? snowIcon : fireIcon;
    const color = frozen ? '#60a5fa' : '#ff4400';
    const borderColor = frozen ? 'rgba(96,165,250,0.4)' : 'rgba(255,68,0,0.35)';
    const bgColor = frozen ? 'rgba(96,165,250,0.15)' : 'rgba(255,68,0,0.15)';
    const clickAttr = isOwnProfile ? `onclick="openStreakModal(event)"` : '';
    activityBadge = `<span class="steam-badge-item fire" id="activityBadge" ${clickAttr} style="cursor:${isOwnProfile ? 'pointer' : 'default'};background:${bgColor};color:${color};border-color:${borderColor};">
      <span class="badge-icon">${icon}</span>
      <span id="activityCount">${user.activity}</span>
    </span>`;
  } else {
    activityBadge = `<span class="steam-badge-item fire" id="activityBadge" ${isOwnProfile ? 'onclick="openStreakModal(event)"' : ''} style="cursor:${isOwnProfile ? 'pointer' : 'default'};background:rgba(255,68,0,0.08);color:rgba(255,68,0,0.6);border-color:rgba(255,68,0,0.2);opacity:0.8;">
      <span class="badge-icon">${fireIcon}</span>
      <span id="activityCount">0</span>
    </span>`;
  }

  const tagBadge = tag ? `<span class="steam-badge-item tag" style="background:rgba(255,255,255,0.06);color:var(--text-dim);border:1px solid var(--border-bright);font-size:10.5px;">${escapeHtml(tag)}</span>` : '';

  // УБРАЛИ БОЛЬШОЙ ОГОНЁК (он был тут, теперь его нет)

  document.getElementById('steamBody').innerHTML = `
    <div class="steam-role-badge" style="background:${roleColor}15;border-color:${roleColor}66;color:${roleColor};">
      ${escapeHtml(topRole)}
    </div>
    <div class="steam-name-row">
      <div class="steam-name">${escapeHtml(cleanName)}</div>
      ${verifyBadge}
      ${activityBadge}
      ${tagBadge}
    </div>
    <div class="steam-status-text ${status}">${statusText}</div>
    <div class="steam-desc">${escapeHtml(desc)}</div>
  `;
}

function renderProfileSocials(user) {
  const corner = document.getElementById('steamSocialCorner');
  if (!corner) return;
  const socials = [];
  socials.push({
    url: user.profileUrl || `https://steamcommunity.com/profiles/${user.steamId}`,
    label: 'Steam',
    icon: window.ICONS.steam
  });
  if (user.telegram) socials.push({ url: user.telegram, label: 'Telegram', icon: window.ICONS.telegram });
  if (user.discordId) socials.push({ url: `https://discord.com/users/${user.discordId}`, label: 'Discord', icon: window.ICONS.discord });
  if (user.vk) socials.push({ url: user.vk, label: 'VK', icon: window.ICONS.vk });

  corner.innerHTML = socials.map(s =>
    `<a href="${s.url}" target="_blank" rel="noopener" title="${s.label}">${s.icon}</a>`
  ).join('');
}

async function renderProfileReactions(user) {
  const box = document.getElementById('profileReactions');
  if (!box) return;

  box.innerHTML = `
    <button class="reaction-btn" data-type="like" disabled>
      ${window.ICONS.thumbsUp}
      <span id="likeCount">0</span>
    </button>
    <button class="reaction-btn" data-type="dislike" disabled>
      ${window.ICONS.thumbsDown}
      <span id="dislikeCount">0</span>
    </button>
    <span class="reaction-views">
      ${window.ICONS.eye}
      <span id="viewsCount">0</span>
    </span>
  `;

  try {
    const r = await api(`/api/reactions/${user.steamId}`);
    document.getElementById('likeCount').textContent = r.likes || 0;
    document.getElementById('dislikeCount').textContent = r.dislikes || 0;
    document.getElementById('viewsCount').textContent = r.views || 0;

    const likeBtn = box.querySelector('[data-type="like"]');
    const dislikeBtn = box.querySelector('[data-type="dislike"]');
    likeBtn.disabled = false;
    dislikeBtn.disabled = false;

    if (r.myReaction === 'like') likeBtn.classList.add('active-like');
    if (r.myReaction === 'dislike') dislikeBtn.classList.add('active-dislike');

    const handler = async (type) => {
      if (!window.getToken()) {
        showToast('Войдите через Steam', 'error');
        return;
      }
      try {
        await api(`/api/reactions/${user.steamId}`, {
          method: 'POST',
          body: JSON.stringify({ type })
        });
        const updated = await api(`/api/reactions/${user.steamId}`);
        document.getElementById('likeCount').textContent = updated.likes || 0;
        document.getElementById('dislikeCount').textContent = updated.dislikes || 0;
        likeBtn.classList.toggle('active-like', updated.myReaction === 'like');
        dislikeBtn.classList.toggle('active-dislike', updated.myReaction === 'dislike');
      } catch (e) {
        const errors = {
          self_reaction: 'Нельзя реагировать на свой профиль',
          bad_type: 'Ошибка типа реакции',
        };
        const key = e.message.split(' — ')[0];
        showToast(errors[key] || e.message, 'error');
      }
    };

    likeBtn.onclick = () => handler('like');
    dislikeBtn.onclick = () => handler('dislike');
  } catch (e) {
    console.error('[reactions]', e);
  }
}

function applyProfileVisibility(user) {
  const isOwn = !!(currentUserData && (currentUserData.steamId === user.steamId));
  const isStaff = window.canEditOthersProfiles && window.canEditOthersProfiles(currentUserData);
  const canEdit = !!user.canEditSettings && (isOwn || isStaff);
  const canViewTx = !!user.canViewTransactions && (isOwn || isStaff);

  document.querySelectorAll('.steam-menu-item').forEach(t => {
    const tab = t.dataset.tab;
    if (tab === 'transactions' && !canViewTx) { t.style.display = 'none'; return; }
    if (tab === 'settings' && !canEdit) { t.style.display = 'none'; return; }
    t.style.display = '';
  });

  const activeTab = document.querySelector('.steam-menu-item.active')?.dataset.tab;
  const activeEl = document.querySelector(`.steam-menu-item[data-tab="${activeTab}"]`);
  if (!activeEl || activeEl.style.display === 'none') switchProfileTab('profile');

  const adminNotice = document.getElementById('adminEditNotice');
  if (adminNotice) {
    adminNotice.style.display = canEdit && !isOwn ? 'block' : 'none';
    if (canEdit && !isOwn) adminNotice.innerHTML = `Вы редактируете профиль <b>${escapeHtml(user.username || user.steamId)}</b> от имени персонала`;
  }
}

async function loadInventory(steamId) {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '<div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div> Загрузка...</div>';
  try {
    const q = steamId ? ('?steamId=' + encodeURIComponent(steamId)) : '';
    const data = await api('/api/inventory' + q);
    const items = data.items || [];
    document.getElementById('invCount').textContent = items.length;
    if (!items.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Пока нет покупок</div>`;
      return;
    }

    const ICONS = {
      fernodd_plus: {
        svg: window.ICONS.star,
        color: '#fbbf24',
        tag: 'vip',
        tagLabel: 'FERNODD+'
      }
    };

    const ROLE_ICONS = {
      'Модератор': { svg: window.ICONS.shield, color: '#5865f2', tagLabel: 'МОДЕРАТОР' },
      'Старший модератор': { svg: window.ICONS.shield, color: '#23a55a', tagLabel: 'СТ. МОДЕРАТОР' },
      'Главный модератор': { svg: window.ICONS.shield, color: '#00a8fc', tagLabel: 'ГЛ. МОДЕРАТОР' },
      'Куратор': { svg: window.ICONS.user, color: '#f0b232', tagLabel: 'КУРАТОР' },
      'Следящий': { svg: window.ICONS.eye, color: '#f0b232', tagLabel: 'СЛЕДЯЩИЙ' },
      'Техническая поддержка': { svg: window.ICONS.settings, color: '#5865f2', tagLabel: 'ТЕХ. ПОДДЕРЖКА' },
      'Главная администрация': { svg: window.ICONS.star, color: '#5865f2', tagLabel: 'ГЛ. АДМИН' },
    };

    const NON_REMOVABLE = [
      'Модератор', 'Старший модератор', 'Главный модератор', 'Медиа', 'Разработчик',
      'Куратор', 'Следящий', 'Техническая поддержка', 'Главная администрация', 'Владелец'
    ];

    grid.innerHTML = items.map(it => {
      let meta;
      if (it.isRole) meta = ROLE_ICONS[it.itemName] || { svg: window.ICONS.shield, color: 'var(--red)', tagLabel: 'РОЛЬ' };
      else meta = ICONS[it.itemId] || { svg: window.ICONS.gift, color: 'var(--red)', tag: 'vip', tagLabel: 'Услуга' };

      const canRemove = isOwnProfile && (
        (it.isRole && !NON_REMOVABLE.includes(it.itemName)) ||
        !it.isRole
      );

      const lastDate = new Date(it.lastPurchase).toLocaleDateString('ru-RU');
      let duration = 'Активно';
      if (it.isRole) duration = 'Навсегда';
      else if (it.forever) duration = 'Навсегда';
      else if (it.expiresAt) {
        const diff = new Date(it.expiresAt) - Date.now();
        duration = diff > 0 ? `до ${new Date(it.expiresAt).toLocaleDateString('ru-RU')}` : 'Истекла';
      } else if (it.totalDays > 0) duration = `${it.totalDays} дн.`;

      const menuBtn = canRemove
        ? `<button class="inv-actions-btn" onclick="toggleInvMenu(event, '${it.itemId}')" title="Действия">
             <svg viewBox="0 0 24 24">
               <circle cx="12" cy="5" r="1.6"/>
               <circle cx="12" cy="12" r="1.6"/>
               <circle cx="12" cy="19" r="1.6"/>
             </svg>
           </button>
           <div class="inv-actions-menu" id="menu-${it.itemId}">
             <button class="inv-actions-item" onclick="removeInventoryItem('${it.itemId}', '${escapeHtml(it.itemName).replace(/'/g, "\\'")}')">
               <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
               Удалить
             </button>
           </div>`
        : '';

      return `
        <div class="inv-card" style="--item-color:${meta.color};" data-item-id="${it.itemId}">
          ${menuBtn}
          <span class="inv-tag ${meta.tag || ''}">${meta.tagLabel}${it.count > 1 ? ` ×${it.count}` : ''}</span>
          <div class="inv-image" style="color:${meta.color};">${meta.svg}</div>
          <div class="inv-name">${escapeHtml(it.itemName)}</div>
          <div class="inv-info">
            <span>Действует: <b>${duration}</b></span>
            <span>${it.isRole ? 'Роль' : 'Покупка'}: <b>${lastDate}</b></span>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;color:var(--red);">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

window.toggleInvMenu = function (e, itemId) {
  e.stopPropagation();
  const card = e.currentTarget.closest('.inv-card');
  if (!card) return;
  const wasOpen = card.classList.contains('menu-open');
  document.querySelectorAll('.inv-card.menu-open').forEach(c => c.classList.remove('menu-open'));
  if (!wasOpen) card.classList.add('menu-open');
};

document.addEventListener('click', (e) => {
  if (!e.target.closest('.inv-card')) {
    document.querySelectorAll('.inv-card.menu-open').forEach(c => c.classList.remove('menu-open'));
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.inv-card.menu-open').forEach(c => c.classList.remove('menu-open'));
  }
});

window.removeInventoryItem = async function (itemId, itemName) {
  document.querySelectorAll('.inv-card.menu-open').forEach(c => c.classList.remove('menu-open'));

  window.confirmSiteModal({
    title: `Удалить «${itemName}»?`,
    desc: `Это действие необратимо.\nРоль также снимется в Discord.`,
    confirmText: 'Удалить',
    cancelText: 'Отмена',
    onConfirm: async () => {
      try {
        await api('/api/inventory/remove', {
          method: 'POST',
          body: JSON.stringify({ itemId })
        });
        showToast(`«${itemName}» удалено`, 'success');
        loadProfile();
      } catch (e) {
        const errors = {
          non_removable_role: 'Эту роль нельзя удалить',
          role_not_owned: 'У вас нет этой роли',
          subscription_not_found: 'Подписка не найдена',
          missing_item_id: 'Ошибка: неверный ID',
          no_db: 'Ошибка базы данных',
        };
        const key = e.message.split(' — ')[0];
        showToast((errors[key] || e.message), 'error');
      }
    }
  });
};

async function loadFriends(steamId) {
  const list = document.getElementById('friendsList');
  list.innerHTML = '<div class="loading-state"><div class="spinner"></div> Загрузка друзей...</div>';
  try {
    const q = steamId ? ('?steamId=' + encodeURIComponent(steamId)) : '';
    const data = await api('/api/friends' + q);
    allFriends = data.friends || [];
    document.getElementById('countAll').textContent = allFriends.length;
    document.getElementById('countReg').textContent = allFriends.filter(f => f.registered).length;
    document.getElementById('countOnline').textContent = allFriends.filter(f => f.status === 'online').length;
    renderFriends();
  } catch (e) {
    list.innerHTML = `<div class="empty-state" style="color:var(--red);">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

function renderFriends() {
  const list = document.getElementById('friendsList');
  let arr = allFriends;
  if (currentFriendFilter === 'registered') arr = arr.filter(f => f.registered);
  if (currentFriendFilter === 'online') arr = arr.filter(f => f.status === 'online');
  if (!arr.length) {
    list.innerHTML = `<div class="empty-state">Никого не найдено</div>`;
    return;
  }
  list.innerHTML = arr.map(f => {
    const href = f.registered && f.steamId ? `/profile/${f.steamId}` : f.profileUrl;
    const target = f.registered ? '' : 'target="_blank" rel="noopener"';
    const statusText = f.status === 'online' ? 'В сети' : (f.status === 'busy' ? 'Занят' : 'Не в сети');
    const avatarHTML = f.avatar
      ? `<img class="friend-avatar" src="${f.avatar}" alt="">`
      : `<div class="friend-avatar friend-avatar-empty"></div>`;
    return `<a class="friend-row" href="${href}" ${target}>
      <div class="friend-avatar-wrap">
        ${avatarHTML}
        <span class="friend-status ${f.status}"></span>
      </div>
      <div class="friend-info">
        <div class="friend-name">${escapeHtml(f.name)}</div>
        <div class="friend-meta">${statusText}${f.registered ? ' · На сайте' : ''}</div>
      </div>
    </a>`;
  }).join('');
}

function switchFTab(el, filter) {
  document.querySelectorAll('.f-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentFriendFilter = filter;
  renderFriends();
}

async function loadSettingsDataFor(user) {
  try {
    window.__originalProfileLink = user.profileLink || '';
    document.getElementById('descInput').value = user.description || 'Is it worth it?';
    document.getElementById('bgInput').value = user.backgroundUrl || '';
    document.getElementById('linkInput').value = user.profileLink || '';
    document.getElementById('tgInput').value = user.telegram || '';
    document.getElementById('vkInput').value = user.vk || '';

    const mySteamId = currentUserData?.steamId || currentUserData?.id;
    const isOwn = mySteamId === user.steamId;
    const isStaff = window.canEditOthersProfiles && window.canEditOthersProfiles(currentUserData);

    // ИСПРАВЛЕНА ПРОВЕРКА FERNODD+
    const allRoles = [...(user.roles || []), ...(user.siteRoles || [])].map(r => String(r || '').toLowerCase());
    const hasPlus = allRoles.some(r => r.includes('fernodd'));

    const shouldUnlock = isOwn ? hasPlus : isStaff;
    applyFernoddPlusLock(shouldUnlock, user.profileLink || '');

    const notice = document.getElementById('adminEditNotice');
    if (notice) {
      const showNotice = isStaff && !isOwn;
      notice.style.display = showNotice ? 'block' : 'none';
      if (showNotice) notice.innerHTML = `Вы редактируете профиль <b>${escapeHtml(user.username || user.steamId)}</b> от имени персонала`;
    }
    updateLinkUI();
  } catch (e) { console.error(e); }
}

const linkInput = document.getElementById('linkInput');
linkInput.addEventListener('input', () => {
  let v = linkInput.value.replace(/[^a-zA-Z0-9_\-]/g, '').toLowerCase().slice(0, 20);
  if (v !== linkInput.value) linkInput.value = v;
  updateLinkUI();
});

function updateLinkUI() {
  const v = linkInput.value.trim();
  const statusEl = document.getElementById('linkStatus');
  const statusText = document.getElementById('linkStatusText');
  const counter = document.getElementById('linkCounter');
  counter.textContent = `${v.length} / 20`;
  if (!v) {
    statusEl.className = 'link-status idle';
    statusText.textContent = '3–20 символов: латиница, цифры, «_» и «-»';
    linkStatus = 'idle';
    lastCheckedLink = '';
    return;
  }
  if (v.length < 3 || !/^[a-zA-Z0-9_\-]{3,20}$/.test(v)) {
    statusEl.className = 'link-status err';
    statusText.textContent = v.length < 3 ? 'Минимум 3 символа' : 'Неверный формат';
    linkStatus = 'err';
    return;
  }
  if (v === lastCheckedLink) return;
  clearTimeout(linkCheckTimer);
  linkStatus = 'checking';
  statusEl.className = 'link-status checking';
  statusText.textContent = 'Проверяем...';
  linkCheckTimer = setTimeout(async () => {
    try {
      const r = await api('/api/profile/check-link?link=' + encodeURIComponent(v));
      lastCheckedLink = v;
      if (r.available) {
        linkStatus = 'ok';
        statusEl.className = 'link-status ok';
        statusEl.innerHTML = '<span class="dot-indicator"></span><span>Свободно</span>';
      } else {
        linkStatus = 'err';
        statusEl.className = 'link-status err';
        statusEl.innerHTML = `<span class="dot-indicator"></span><span>Уже занято</span>`;
      }
    } catch {
      linkStatus = 'ok';
      statusEl.className = 'link-status ok';
      statusEl.innerHTML = '<span class="dot-indicator"></span><span>Готово</span>';
    }
  }, 500);
}

function applyFernoddPlusLock(hasPlus, currentLink) {
  const block = document.getElementById('linkBlock');
  const input = document.getElementById('linkInput');
  const clearBtn = block.querySelector('.link-head-clear');
  const iconBtns = block.querySelectorAll('.link-icon-btn');
  const badge = document.getElementById('plusBadge');
  const noPlusBadge = document.getElementById('noPlusBadge');

  if (hasPlus) {
    block.classList.remove('locked');
    input.disabled = false;
    clearBtn.style.display = '';
    iconBtns.forEach(b => b.disabled = false);
    if (badge) badge.style.display = 'inline-block';
    if (noPlusBadge) noPlusBadge.style.display = 'none';
    const ov = block.querySelector('.link-lock-overlay');
    if (ov) ov.remove();
    return;
  }

  block.classList.add('locked');
  input.disabled = true;
  clearBtn.style.display = 'none';
  iconBtns.forEach(b => b.disabled = true);
  if (badge) badge.style.display = 'none';
  if (noPlusBadge) noPlusBadge.style.display = 'inline-block';
  const oldOv = block.querySelector('.link-lock-overlay');
  if (oldOv) oldOv.remove();
  const overlay = document.createElement('div');
  overlay.className = 'link-lock-overlay';
  overlay.innerHTML = `
    <div class="link-lock-icon">${window.ICONS.lock}</div>
    <div class="link-lock-title">Только для FERNODD+</div>
    <div class="link-lock-desc">Оформите подписку, чтобы установить свою ссылку профиля</div>
    <a class="link-lock-btn" href="/shop">В магазин</a>
  `;
  block.appendChild(overlay);
}

window.clearProfileLink = function () {
  linkInput.value = '';
  updateLinkUI();
  linkInput.focus();
};

window.copyProfileUrl = function () {
  const v = linkInput.value.trim();
  if (!v) { showToast('Введите ссылку', 'error'); return; }
  const url = `${window.location.origin}/profile/${v}`;
  navigator.clipboard.writeText(url).then(() => showToast('Скопировано', 'success')).catch(() => showToast('Ошибка', 'error'));
};

async function saveAllSettings() {
  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true;
  btn.textContent = 'Сохранение...';
  const isOwn = isOwnProfile;

  const payload = {
    description: document.getElementById('descInput').value.trim(),
    backgroundUrl: document.getElementById('bgInput').value.trim(),
    telegram: document.getElementById('tgInput').value.trim(),
    vk: document.getElementById('vkInput').value.trim(),
  };

  const linkVal = linkInput.value.trim();
  const originalLink = window.__originalProfileLink || '';
  if (linkVal !== originalLink) {
    payload.profileLink = linkVal;
    if (!isOwn && canEditSettings) payload.steamId = targetUserId;
  }

  try {
    await api('/api/profile/update', { method: 'POST', body: JSON.stringify(payload) });
    showToast('Настройки сохранены', 'success');
    window.__originalProfileLink = linkVal;
    loadProfile();
  } catch (e) {
    const errors = {
      bad_link_format: 'Неверный формат ссылки',
      link_taken: 'Ссылка уже занята',
      fernodd_plus_required: 'Только для FERNODD+ (ссылка профиля)',
      not_allowed_for_others: 'Нет прав на изменение чужого профиля',
      bad_steam_id: 'Неверный Steam ID',
      bad_background_url: 'Некорректный URL фона',
      bad_telegram_url: 'Некорректный URL Telegram',
      bad_vk_url: 'Некорректный URL VK',
      no_db: 'Ошибка базы данных',
    };
    const key = e.message.split(' — ')[0];
    showToast((errors[key] || e.message), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Сохранить';
  }
}

async function loadDiscordInfo(discordId) {
  const box = document.getElementById('discordBox');
  if (!discordId) {
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;flex-wrap:wrap;">
        <div style="font-size:13px;color:var(--text-dim);">Не привязан</div>

  try {

async function unlinkDiscord() {
  window.confirmSiteModal({
    title: 'Отвязать Discord?',
    desc: 'Discord будет отвязан от вашего Steam-аккаунта.',
    confirmText: 'Отвязать',
    cancelText: 'Отмена',
    onConfirm: async () => {
      const payload = {};
      if (!isOwnProfile && canEditSettings) payload.steamId = targetUserId;
      try {
        await api('/api/unlink-discord', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Discord отвязан', 'success');
        setTimeout(() => location.reload(), 800);
      } catch (e) {
        showToast('Ошибка: ' + e.message, 'error');
      }
    }
  });
}
