<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernodd — Магазин</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
  body > .auth-widget { display: none !important; }
  .shop-page { min-height: 100vh; padding: 80px 24px 140px; position: relative; z-index: 1; }
  .shop-container { max-width: 1200px; margin: 0 auto; }
  .shop-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .shop-title { font-family: 'Unbounded', sans-serif; font-size: clamp(28px, 5vw, 44px); font-weight: 900; letter-spacing: -1.5px; color: #fff; }
  .shop-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .shop-tab { padding: 12px 22px; background: transparent; border: none; border-bottom: 3px solid transparent; color: var(--text-dim); font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.25s; margin-bottom: -5px; display: inline-flex; align-items: center; gap: 8px; letter-spacing: -0.3px; }
  .shop-tab:hover { color: #fff; }
  .shop-tab.active { color: #fff; border-bottom-color: var(--red); text-shadow: 0 0 20px rgba(225,6,0,0.5); }
  .shop-tab .tab-count { padding: 2px 9px; background: rgba(255,255,255,0.06); border-radius: 100px; font-size: 11px; font-weight: 700; font-family: 'Unbounded', sans-serif; }
  .shop-tab.active .tab-count { background: rgba(225,6,0,0.25); color: #fff; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .shop-card { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border); border-radius: 20px; padding: 26px 22px 22px; position: relative; overflow: hidden; transition: all 0.35s cubic-bezier(0.22,1,0.36,1); display: flex; flex-direction: column; }
  .shop-card:hover { transform: translateY(-8px); border-color: var(--item-color, var(--red)); box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(225,6,0,0.2); }
  .shop-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--item-color, var(--red)); box-shadow: 0 0 20px var(--item-color, var(--red)); }
  .shop-badge { position: absolute; top: 14px; left: 14px; padding: 5px 12px; background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(217,119,6,0.15)); border: 1px solid rgba(251,191,36,0.5); border-radius: 100px; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 900; color: #fbbf24; z-index: 2; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 0 20px rgba(251,191,36,0.3); }
  .shop-icon-wrap { height: 130px; display: flex; align-items: center; justify-content: center; margin: 12px 0 8px; }
  .shop-icon { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 74px; filter: drop-shadow(0 0 30px rgba(225,6,0,0.4)); transition: transform 0.4s; line-height: 1; }
  .shop-card:hover .shop-icon { transform: scale(1.12) rotate(-3deg); }
  .shop-name { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 6px; letter-spacing: -0.5px; }
  .shop-desc { font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.5; margin-bottom: 14px; min-height: 36px; }
  .shop-price { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 900; color: #fff; text-align: center; letter-spacing: -1px; margin-bottom: 16px; }
  .shop-price .new { color: var(--red); }
  .shop-price .unit { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-left: 4px; }
  .shop-buy-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.3s; letter-spacing: -0.2px; box-shadow: 0 8px 24px rgba(225,6,0,0.4); }
  .shop-buy-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(225,6,0,0.7); }
  .shop-buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .fd-plus-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .fd-plus-modal.visible { display: flex; }
  .fd-plus-inner { background: linear-gradient(145deg, #0e0e0e, #060606); border: 1px solid var(--border-bright); border-radius: 24px; max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 32px 30px; position: relative; }
  .fd-plus-inner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--red), var(--red-glow), var(--red)); border-radius: 24px 24px 0 0; }
  .fd-plus-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-bright); color: var(--text-dim); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 2; }
  .fd-plus-close:hover { color: var(--red); border-color: var(--red); }
  .fd-plus-header { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .fd-plus-header-icon { width: 76px; height: 76px; border-radius: 20px; background: linear-gradient(145deg, rgba(225,6,0,0.15), rgba(139,0,0,0.05)); border: 1px solid rgba(225,6,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 42px; flex-shrink: 0; box-shadow: 0 0 40px rgba(225,6,0,0.3); }
  .fd-plus-header-title { font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 900; color: #fff; letter-spacing: -1px; margin-bottom: 6px; }
  .fd-plus-header-title span { color: var(--red); text-shadow: 0 0 20px rgba(225,6,0,0.7); }
  .fd-plus-header-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .fd-plus-features { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 22px; }
  .fd-plus-feature { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--text); }
  .fd-plus-feature svg { width: 16px; height: 16px; stroke: #4ade80; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .fd-plus-section-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.8px; margin-bottom: 12px; }
  .fd-tariff-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .fd-tariff { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: rgba(255,255,255,0.02); border: 1.5px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
  .fd-tariff:hover { border-color: rgba(225,6,0,0.5); background: rgba(225,6,0,0.04); }
  .fd-tariff.selected { border-color: var(--red); background: linear-gradient(135deg, rgba(225,6,0,0.12), rgba(139,0,0,0.05)); box-shadow: 0 0 30px rgba(225,6,0,0.2); }
  .fd-tariff-bullet { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-bright); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.25s; }
  .fd-tariff.selected .fd-tariff-bullet { border-color: var(--red); background: var(--red); }
  .fd-tariff.selected .fd-tariff-bullet::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .fd-tariff-info { flex: 1; min-width: 0; }
  .fd-tariff-name { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; letter-spacing: -0.3px; }
  .fd-tariff-sub { font-size: 11.5px; color: var(--text-dim); }
  .fd-tariff-price { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 900; color: var(--red); white-space: nowrap; flex-shrink: 0; }
  .fd-tariff-tag { position: absolute; top: 8px; right: 12px; padding: 2px 9px; background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; border-radius: 100px; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
  .fd-total { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-bright); border-radius: 14px; margin-bottom: 16px; }
  .fd-total-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
  .fd-total-value { font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 900; color: var(--red); letter-spacing: -1px; }
  .fd-plus-buy-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 32px rgba(225,6,0,0.5); }
  .fd-plus-buy-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 16px 45px rgba(225,6,0,0.8); }
  .fd-plus-buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 699px) {
    .shop-page { padding: 70px 12px 120px; }
    .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .shop-card { padding: 18px 14px 14px; border-radius: 16px; }
    .shop-icon-wrap { height: 90px; }
    .shop-icon { width: 70px; height: 70px; font-size: 52px; }
    .shop-name { font-size: 13px; }
    .shop-desc { font-size: 10.5px; min-height: 30px; margin-bottom: 10px; }
    .shop-price { font-size: 18px; margin-bottom: 12px; }
    .shop-buy-btn { padding: 11px; font-size: 11px; }
    .shop-tab { padding: 10px 16px; font-size: 12px; }
    .fd-plus-inner { padding: 24px 20px; border-radius: 20px; }
    .fd-plus-header-icon { width: 60px; height: 60px; font-size: 34px; border-radius: 16px; }
    .fd-plus-header-title { font-size: 19px; }
    .fd-plus-header-desc { font-size: 12px; }
    .fd-tariff { padding: 12px 14px; }
    .fd-tariff-name { font-size: 13px; }
    .fd-tariff-price { font-size: 14px; }
    .fd-total-value { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-glow-3"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="auth-widget" id="authWidget"></div>

<main class="shop-page">
  <div class="shop-container">
    <div class="shop-header">
      <div class="shop-title">Магазин</div>
    </div>

    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="roles">
        Роли
        <span class="tab-count" id="rolesCount">1</span>
      </button>
    </div>

    <div class="shop-grid" id="shopGrid"></div>
  </div>
</main>

<div class="fd-plus-modal" id="fdPlusModal">
  <div class="fd-plus-inner" id="fdPlusInner"></div>
</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="/"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Главная</span></a>
  <a class="nav-btn" href="/rules"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Правила</span></a>
  <a class="nav-btn" href="/roles"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Роли</span></a>
  <a class="nav-btn active" href="/shop"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Магазин</span></a>
  <a class="nav-btn" href="/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg><span>Профиль</span></a>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/js/common.js"></script>
<script src="/js/my-profile.js"></script>
<script src="/js/auth.js"></script>
<script>
const SHOP_DATA = {
  roles: [
    {
      id: 'fernodd_plus',
      name: 'FERNODD+',
      description: 'Премиум-подписка с уникальными возможностями',
      icon: '⭐',
      color: '#fbbf24',
      badge: '-45%',
      type: 'subscription',
      tariffs: [
        { id: 'month',   label: '1 месяц',   sub: 'Отличный старт',   price: 249,   days: 30,  badge: '' },
        { id: 'q3',      label: '3 месяца',  sub: 'Экономия 30₽/мес', price: 499,   days: 90,  badge: '' },
        { id: 'q6',      label: '6 месяцев', sub: 'Экономия 50₽/мес', price: 1199,  days: 180, badge: 'ХИТ' },
        { id: 'year',    label: '1 год',     sub: 'Лучшая цена',      price: 2399,  days: 365, badge: 'ВЫГОДНО' },
        { id: 'forever', label: 'Навсегда',  sub: 'Разовая покупка',  price: 24999, days: 0,   badge: 'TOP' },
      ]
    }
  ]
};

let currentUser = null;
let selectedTariffId = 'month';

function bootShop() {
  renderShop();
  if (window.currentUser) {
    const menuBox = document.getElementById('profileMenuContent');
    if (menuBox) menuBox.innerHTML = renderProfileMenu('shop');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootShop);
} else {
  bootShop();
}

window.addEventListener('auth:changed', (e) => {
  const user = e.detail.user;
  currentUser = user;
  renderShop();
  if (user) {
    const menuBox = document.getElementById('profileMenuContent');
    if (menuBox) menuBox.innerHTML = renderProfileMenu('shop');
  }
});

function renderShop() {
  const grid = document.getElementById('shopGrid');
  const roles = SHOP_DATA.roles;
  document.getElementById('rolesCount').textContent = roles.length;
  grid.innerHTML = roles.map(item => {
    const priceHTML = item.type === 'subscription'
      ? `<span class="new">от ${Math.min(...item.tariffs.map(t => t.price))}₽</span><span class="unit">/ ${item.tariffs[0].label}</span>`
      : `<span class="new">${item.price}₽</span>`;
    const badgeHTML = item.badge
      ? `<div class="shop-badge">
           <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:#fbbf24;"><path d="M12 2c-1.5 3.5-3.5 5-3.5 8a3.5 3.5 0 0 0 7 0c0-3-2-4.5-3.5-8z"/></svg>
           ${escapeHtml(item.badge)}
         </div>` : '';
    return `
      <div class="shop-card" style="--item-color:${item.color};">
        ${badgeHTML}
        <div class="shop-icon-wrap">
          <div class="shop-icon" style="color:${item.color};">${item.icon}</div>
        </div>
        <div class="shop-name">${escapeHtml(item.name)}</div>
        <div class="shop-desc">${escapeHtml(item.description)}</div>
        <div class="shop-price">${priceHTML}</div>
        <button class="shop-buy-btn" onclick="openProduct('${item.id}')">Выбрать тариф</button>
      </div>
    `;
  }).join('');
}

window.openProduct = function(itemId) {
  const item = SHOP_DATA.roles.find(r => r.id === itemId);
  if (!item) return;
  if (item.type === 'subscription') openSubscriptionModal(item);
};

function openSubscriptionModal(item) {
  const modal = document.getElementById('fdPlusModal');
  const inner = document.getElementById('fdPlusInner');
  inner.innerHTML = `
    <button class="fd-plus-close" onclick="closeSubscriptionModal()">✕</button>
    <div class="fd-plus-header">
      <div class="fd-plus-header-icon">⭐</div>
      <div style="flex:1;min-width:0;">
        <div class="fd-plus-header-title">FERNODD<span>+</span></div>
        <div class="fd-plus-header-desc">${escapeHtml(item.description)}</div>
      </div>
    </div>
    <div class="fd-plus-features">
      <div class="fd-plus-feature"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Уникальный префикс и цветной ник</div>
      <div class="fd-plus-feature"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Доступ к закрытым каналам</div>
      <div class="fd-plus-feature"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Приоритетная поддержка</div>
      <div class="fd-plus-feature"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> +50% к койнам за активность</div>
      <div class="fd-plus-feature"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Эксклюзивные ивенты</div>
    </div>
    <div class="fd-plus-section-title">Выберите тариф</div>
    <div class="fd-tariff-list" id="tariffList">
      ${item.tariffs.map(t => `
        <div class="fd-tariff ${t.id === selectedTariffId ? 'selected' : ''}" data-id="${t.id}" onclick="selectTariff('${t.id}')">
          ${t.badge ? `<div class="fd-tariff-tag">${escapeHtml(t.badge)}</div>` : ''}
          <div class="fd-tariff-bullet"></div>
          <div class="fd-tariff-info">
            <div class="fd-tariff-name">${escapeHtml(t.label)}</div>
            <div class="fd-tariff-sub">${escapeHtml(t.sub)}</div>
          </div>
          <div class="fd-tariff-price">${t.price} ₽</div>
        </div>
      `).join('')}
    </div>
    <div class="fd-total">
      <div class="fd-total-label">Итого</div>
      <div class="fd-total-value" id="totalPrice">— ₽</div>
    </div>
    <button class="fd-plus-buy-btn" id="buyBtn" onclick="buySubscription('${item.id}')">Купить FERNODD+</button>
  `;
  modal.classList.add('visible');
  document.body.style.overflow = 'hidden';
  updateTotal(item);
}

window.closeSubscriptionModal = function() {
  document.getElementById('fdPlusModal').classList.remove('visible');
  document.body.style.overflow = '';
};
document.getElementById('fdPlusModal').addEventListener('click', (e) => { if (e.target.id === 'fdPlusModal') closeSubscriptionModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSubscriptionModal(); });

window.selectTariff = function(tariffId) {
  selectedTariffId = tariffId;
  document.querySelectorAll('.fd-tariff').forEach(el => { el.classList.toggle('selected', el.dataset.id === tariffId); });
  const item = SHOP_DATA.roles.find(r => r.id === 'fernodd_plus');
  updateTotal(item);
};

function updateTotal(item) {
  const tariff = item.tariffs.find(t => t.id === selectedTariffId);
  if (!tariff) return;
  document.getElementById('totalPrice').textContent = `${tariff.price} ₽`;
}

window.buySubscription = async function(itemId) {
  const item = SHOP_DATA.roles.find(r => r.id === itemId);
  const tariff = item.tariffs.find(t => t.id === selectedTariffId);
  if (!tariff) return;
  const balance = currentUser?.balance || 0;
  if (balance < tariff.price) {
    showToast('❌ Недостаточно средств. Пополните баланс.', 'error');
    return;
  }
  const btn = document.getElementById('buyBtn');
  btn.disabled = true;
  btn.textContent = 'Обработка...';
  try {
    await api('/api/shop/buy-subscription', { method: 'POST', body: JSON.stringify({ itemId: 'fernodd_plus', tariffId: tariff.id }) });
    showToast(`✅ FERNODD+ (${tariff.label}) оформлен!`, 'success');
    closeSubscriptionModal();
    const me = await api('/api/me');
    currentUser = me.user;
    window.currentUser = currentUser;
  } catch (e) {
    const errors = { insufficient_balance: 'Недостаточно средств', role_not_found: 'Роль FERNODD+ не найдена на сервере. Создай её в Discord.', item_not_found: 'Товар не найден', tariff_not_found: 'Тариф не найден' };
    const key = e.message.split(' — ')[0];
    showToast('❌ ' + (errors[key] || e.message), 'error');
    btn.disabled = false;
    btn.textContent = 'Купить FERNODD+';
  }
};
</script>
</body>
</html>
